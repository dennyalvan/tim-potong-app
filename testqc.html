// v.22: URL Web App CODE SYNC AKUNTANSI (Apps Script TERPISAH, gak terafiliasi dengan

const SYNC_AKUNTANSI_URL = 'https://script.google.com/macros/s/AKfycbxq6tZ6oT8mSJd9FIK1SfFyzELDvh0WbRMTcUWiCrGSV80N603T6F14cVricks_410W0g/exec?token=rafkids2026sinkron';
const DAFTAR_UKURAN_URUT = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', '5XL', '6XL'];
const HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

function formatTanggalPendek(tanggalStr) {
  if (!tanggalStr) return '';
  const d = new Date(tanggalStr + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  return HARI_ID[d.getDay()] + ', ' + dd + '/' + mm + '/' + yy;
}

function formatKg(n) {
  return Number(n || 0).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' kg';
}
// v.16: peta nama warna -> hex, buat kasih warna beneran di swatch & aksen kartu Stok Kain
// (sebelumnya kosong, semua kartu default abu-abu). Mencakup nama dasar Indonesia & Inggris,
// plus istilah tekstil/fashion yang muncul di KAMUS SINONIM WARNA & contoh nota supplier.
// Nama warna di data sering GABUNGAN 2+ kata (mis. "STEEL NAVY", "HITAM ONYX", "DUSTY PINK") -
// warnaKeHex_() di bawah nyoba exact match dulu, baru fallback cari kata kunci yang paling
// SPESIFIK (istilah 2 kata diprioritaskan sebelum 1 kata, biar "DUSTY PINK" gak kepotong jadi
// cuma cocok ke "PINK" doang).
const WARNA_KE_HEX = {
  // dasar Indonesia & Inggris
  'HITAM': '#1C1C1E', 'BLACK': '#1C1C1E', 'ONYX': '#1C1C1E',
  'PUTIH': '#F4F4F0', 'WHITE': '#F4F4F0', 'IVORY': '#FFFFF0',
  'MERAH': '#DC2626', 'RED': '#DC2626',
  'MARUN': '#7B241C', 'MAROON': '#7B241C', 'MERAH HATI': '#7B241C',
  'HIJAU': '#16A34A', 'GREEN': '#16A34A', 'HIJAU TUA': '#14532D', 'HIJAU BOTOL': '#14532D',
  'BIRU': '#2563EB', 'BLUE': '#2563EB',
  'NAVY': '#1E3A5F', 'DONGKER': '#1E3A5F', 'BIRU DONGKER': '#1E3A5F', 'BIRU TUA': '#1E3A5F',
  'STEEL BLUE': '#4A6FA5', 'ST. BLUE': '#4A6FA5', 'ST BLUE': '#4A6FA5', 'DENIM': '#4A5D75',
  'KUNING': '#EAB308', 'YELLOW': '#EAB308',
  'MUSTARD': '#C89B3C', 'KUNING BUSUK': '#C89B3C', 'KUBUS': '#C89B3C',
  'ABU': '#9CA3AF', 'ABU-ABU': '#9CA3AF', 'GREY': '#9CA3AF', 'GRAY': '#9CA3AF', 'MISTY': '#B0B7C0',
  'COKLAT': '#78502E', 'COKELAT': '#78502E', 'BROWN': '#78502E', 'MOCHA': '#8A6E5A', 'MILO': '#6B4A2F',
  'UNGU': '#7C3AED', 'PURPLE': '#7C3AED', 'VIOLET': '#7C3AED',
  'ORANGE': '#EA580C', 'ORANYE': '#EA580C', 'FANTA': '#F97316',
  'CREAM': '#F5E6C8', 'KRIM': '#F5E6C8', 'CREAM SUSU': '#F5E6C8', 'COKSU': '#F5E6C8',
  'PINK': '#EC4899', 'MERAH MUDA': '#EC4899',
  'DUSTY PINK': '#C98E9B', 'DUSTY': '#C98E9B',
  'TERRACOTTA': '#B5573B', 'TERACOTA': '#B5573B', 'BATA': '#B5573B', 'MERAH BATA': '#B5573B',
  'SAGE': '#9CAF88', 'TOSCA': '#2C9A9E', 'TOSCA MUDA': '#5FC2C5', 'KHAKI': '#BFB08F',
  'SILVER': '#C7CCD6', 'GOLD': '#C6A15B', 'BEIGE': '#D8CBB4', 'TAN': '#C8A876'
};
function warnaKeHex_(namaWarna) {
  const w = String(namaWarna || '').toUpperCase().trim();
  if (WARNA_KE_HEX[w]) return WARNA_KE_HEX[w];
  const kunciTerurut = Object.keys(WARNA_KE_HEX).sort(function (a, b) { return b.length - a.length; });
  for (let i = 0; i < kunciTerurut.length; i++) {
    if (w.indexOf(kunciTerurut[i]) !== -1) return WARNA_KE_HEX[kunciTerurut[i]];
  }
  return '#9aa3b2'; // gak ketemu sama sekali - default abu-abu netral
}

// v.09: cache instan (stale-while-revalidate) khusus buat PAINT PERTAMA - data yang tampil
// dari cache SELALU ditandai jelas di label "Terakhir dimuat ... - memuat ulang..." (bukan
// diam-diam dianggap fresh), dan begitu data asli selesai ditarik, langsung diganti + label
// balik normal. BEDA dari testproduksi.html: di sini datanya emang harus selalu fresh buat
// keputusan QC, jadi cache CUMA buat isi layar sebentar sambil nunggu, bukan pengganti fetch.
function ambilCacheDashboard_(kunci) {
  try {
    const raw = localStorage.getItem('dashboard_cache_' + kunci);
    if (!raw) return null;
    return JSON.parse(raw); // { waktu, data }
  } catch (e) {
    return null;
  }
}
function simpanCacheDashboard_(kunci, data) {
  try {
    localStorage.setItem('dashboard_cache_' + kunci, JSON.stringify({ waktu: Date.now(), data: data }));
  } catch (e) {
    // storage penuh/disabled - gak fatal, cuma gak ke-cache
  }
}
function formatWaktuLalu_(waktuMs) {
  const detik = Math.round((Date.now() - waktuMs) / 1000);
  if (detik < 60) return 'baru saja';
  const menit = Math.round(detik / 60);
  if (menit < 60) return menit + ' menit lalu';
  const jam = Math.round(menit / 60);
  return jam + ' jam lalu';
}
// v.19: "Terakhir dimuat..." dan "Update HH:MM" sebelumnya nempel permanen sebagai teks di
// atas judul (elemen #lastUpdate) - sekarang gak ada lagi teks yang nongkrong di canvas sama
// sekali, keduanya jadi toast yang muncul sebentar terus otomatis hilang.
function tampilkanLabelCache_(namaTab, waktuCache) {

}

// v.12: auto-retry SEKALI kalau fetch pertama gagal (biasanya transient - Worker baru "bangun"
// dari idle, atau koneksi WebView Telegram belum settle pas Mini App baru kebuka) - biar gak
// perlu tap Refresh manual buat kasus yang harusnya sembuh sendiri dalam ~1.5 detik.
// v.14: FIX bug "kayak ngedip doang, gak kejadian apa2" pas ganti tab Stok Kain/Rekap QC -
// akar masalahnya ternyata efek samping dari fix ver.12 kemarin: retry otomatis itu SILENT,
// gak ada indikasi visual apapun pas lagi nunggu 1.5 detik buat nyoba ulang, jadi kesannya
// kayak gak kejadian apa2 (padahal proses beneran lagi jalan di background). Sekarang:
// (1) indikator "Memuat..." di header dipakai KONSISTEN di ketiga tab, nyala terus sepanjang
// percobaan pertama SAMPAI retry-nya kelar (gak kedip mati-nyala di antara percobaan),
// (2) ada penjaga (sedangMuatX) biar gak nembak request dobel kalau tab/checkbox dipencet
// berkali-kali pas masih proses loading.
let sedangMuatLaporan = false;
function muatDaftarLaporan(percobaan, manual) {
  percobaan = percobaan || 0;
  manual = manual !== false; // default true (manual) kalau gak disebutkan eksplisit
  if (percobaan === 0) {
    if (sedangMuatLaporan) return;
    sedangMuatLaporan = true;
    tampilkanLoading(true);
    if (daftarLaporanData.length === 0) {
      const cache = ambilCacheDashboard_('laporan_qc');
      if (cache) {
        daftarLaporanData = cache.data || [];
        if (manual) tampilkanLabelCache_('Proses & QC', cache.waktu);
        renderDaftarLaporan();
      }
    }
  }
  fetch(WORKER_URL + '/data/laporan-qc')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      daftarLaporanData = Array.isArray(data) ? data : [];
      simpanCacheDashboard_('laporan_qc', daftarLaporanData);
      updateJamRefresh(manual);
      renderDaftarLaporan();
      sedangMuatLaporan = false;
      tampilkanLoading(false);
    })
    .catch(function (e) {
      if (percobaan < 1) { setTimeout(function () { muatDaftarLaporan(percobaan + 1, manual); }, 1500); return; }
      sedangMuatLaporan = false;
      tampilkanLoading(false);
      tampilkanToast('Gagal memuat laporan: ' + e.message);
    });
}

function tampilkanLoading(tampil) {
  document.getElementById('loadingIndicator').classList.toggle('show', !!tampil);
}

// v.11: ketebalan teks "X hari lalu" bertingkat 3 level (usia-baru/sedang/lama) - semakin lama
// belum diproses, semakin TEBAL tulisannya, jadi Denny bisa langsung lihat prioritas dari mana
// yang tulisannya paling tebal tanpa perlu baca angkanya satu-satu.
function hariLaluTeks(tanggalStr) {
  if (!tanggalStr) return '';
  const tgl = new Date(tanggalStr + 'T00:00:00');
  const now = new Date();
  const diffHari = Math.floor((now - tgl) / (1000 * 60 * 60 * 24));
  let teks;
  if (diffHari <= 0) teks = 'hari ini';
  else if (diffHari === 1) teks = '1 hari lalu';
  else teks = diffHari + ' hari lalu';
  let kelas = 'usia-baru'; // 0-2 hari
  if (diffHari >= 6) kelas = 'usia-lama'; // 6+ hari - paling tebal
  else if (diffHari >= 3) kelas = 'usia-sedang'; // 3-5 hari - lebih tebal dari baru
  return '<span class="' + kelas + '">' + teks + '</span>';
}

function renderDaftarLaporan() {
  let data = daftarLaporanData.slice();

  if (filterKategori !== 'semua') {
    data = data.filter(function (r) { return String(r.kategoriBadge || '').toLowerCase() === filterKategori; });
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    data = data.filter(function (r) { return String(r.jenisWarnaBaju || '').toLowerCase().indexOf(q) !== -1; });
  }
  data.sort(function (a, b) {
    if (sortLaporan === 'lama') return new Date(a.tanggal) - new Date(b.tanggal);
    return new Date(b.tanggal) - new Date(a.tanggal);
  });

  document.getElementById('countLabel').textContent = data.length + ' dari ' + daftarLaporanData.length + ' laporan';

  const container = document.getElementById('daftarLaporan');
  container.innerHTML = data.map(function (r, idx) { return renderLaporanCard(r, idx + 1); }).join('');
  pasangEventLaporanCard();
}

function renderLaporanCard(r, nomor) {
  const pending = hitungPendingUntukLaporan_(r.id);
  const selesaiTampil = r.totalSelesai + pending.pendingSelesai;
  const persen = r.jumlah > 0 ? Math.round((selesaiTampil / r.jumlah) * 100) : 0;
  const terbuka = !!laporanTerbuka[r.id];
  const badgeClass = String(r.kategoriBadge || '').toLowerCase() === 'anak' ? 'anak' : '';
  const badgeJam = pending.jumlahEntri > 0 ? '<span class="pending-badge">🕓</span>' : '';
  const sudahDiAntrian = pending.jumlahEntri > 0;

  // v.02: lingkaran cuma muncul kalau UDAH ADA progress (totalSelesai > 0) - biar mata
  // langsung fokus ke angka yang lagi dikerjakan. Kalau masih 0, tampil "-/jumlah" polos
  // tanpa lingkaran (sesuai contoh pembanding). v.05: kalau ada entri "nunggu dikirim" di
  // antrian, angka & progress bar-nya LANGSUNG kelihatan hasil akhirnya (live preview),
  // ditandai ikon jam kecil - biar Denny gak perlu nunggu submit beneran buat lihat efeknya.
  const fraksiHtml = selesaiTampil > 0
    ? '<span class="fraction-circle">' + selesaiTampil + '</span><span class="fraction-total">/' + r.jumlah + '</span>' + badgeJam
    : '<span class="fraction-total">-/' + r.jumlah + '</span>' + badgeJam;

  let html = '<div class="laporan-card' + (sudahDiAntrian ? ' ada-antrian' : '') + '" data-id="' + r.id + '">' +
    '<div class="laporan-top">' +
    '<span class="idx">' + nomor + '</span>' +
    '<input type="checkbox" class="chk-selesai" data-quickdone="' + r.id + '"' + (sudahDiAntrian ? ' checked' : '') + ' title="Tandai selesai semua sisa">' +
    '<div class="laporan-info" data-toggle="' + r.id + '">' +
    '<span class="nama">' + escapeHtml(r.jenisWarnaBaju) + '</span>' +
    (r.kategoriBadge ? '<span class="badge-kat ' + badgeClass + '">' + escapeHtml(r.kategoriBadge) + '</span>' : '') +
    '<div class="laporan-meta">' + formatTanggalPendek(r.tanggal) + ' · <span class="roll">Roll ' + (r.kodeRoll ? escapeHtml(r.kodeRoll) : '-') + '</span> · ' + formatKg(r.pemakaianKainKg) + ' · ' + hariLaluTeks(r.tanggal) + '</div>' +
    '</div>' +
    '<div class="progress-circle" data-toggle="' + r.id + '">' + fraksiHtml +
    '<div class="progress-bar-mini"><div class="fill" style="width:' + persen + '%"></div></div></div>' +
    '<span class="row-chevron' + (terbuka ? ' open' : '') + '" data-toggle="' + r.id + '">▶</span>' +
    '</div>';

  if (terbuka) {
    html += renderLaporanExpand(r);
  }
  html += '</div>';
  return html;
}

function renderLaporanExpand(r) {
  const pending = hitungPendingUntukLaporan_(r.id);
  const selesaiTampil = r.totalSelesai + pending.pendingSelesai;
  const rejectTampil = r.totalReject + pending.pendingReject;
  const sisaTampil = r.jumlah - selesaiTampil - rejectTampil;
  const persen = r.jumlah > 0 ? Math.round((selesaiTampil / r.jumlah) * 100) : 0;
  const mode = modePerLaporan[r.id] || 'ringkas';
  const perUkuranSorted = r.perUkuran.slice().sort(function (a, b) { return DAFTAR_UKURAN_URUT.indexOf(a.ukuran) - DAFTAR_UKURAN_URUT.indexOf(b.ukuran); });

  let html = '<div class="laporan-expand">' +
    '<div class="ukuran-badges">' + perUkuranSorted.map(function (u) { return '<span class="ukuran-badge">' + u.ukuran + '<span class="n">' + u.qty + '</span></span>'; }).join('') + '</div>';

  if (pending.jumlahEntri > 0) {
    html += '<div class="pending-pill">🕓 ' + pending.jumlahEntri + ' di antrian (+' + pending.pendingSelesai + ' sel / +' + pending.pendingReject + ' rej)</div>';
  }

  html += '<div class="progress-bar-full"><div class="fill" style="width:' + persen + '%"></div></div>' +
    '<div class="stats-line"><span class="sel">Sel<span class="num">' + selesaiTampil + '</span></span><span class="rej">Rej<span class="num">' + rejectTampil + '</span></span><span class="sisa">Sisa<span class="num">' + sisaTampil + '</span></span></div>' +
    '<div class="mode-toggle">' +
    '<button class="mode-btn ' + (mode === 'ringkas' ? 'active' : '') + '" data-modebtn="ringkas" data-id="' + r.id + '">Ringkas</button>' +
    '<button class="mode-btn ' + (mode === 'rincian' ? 'active' : '') + '" data-modebtn="rincian" data-id="' + r.id + '">Rincian</button>' +
    '</div>';

  if (mode === 'ringkas') {
    html += '<div class="ringkas-fields">' +
      '<div class="field"><label>Selesai</label><input type="number" min="0" id="ringkasSelesai-' + r.id + '" placeholder="0"></div>' +
      '<div class="field"><label>Reject</label><input type="number" min="0" id="ringkasReject-' + r.id + '" placeholder="0"></div>' +
      '</div>';
  } else {
    html += '<table class="rincian-table"><thead><tr><th>UK</th><th>QTY</th><th>SEL</th><th>REJ</th><th>SISA</th></tr></thead><tbody>';
    perUkuranSorted.forEach(function (u) {
      const selesai = u.sisa <= 0
        ? u.selesai
        : '<input type="number" min="0" max="' + u.sisa + '" id="rincianSel-' + r.id + '-' + u.ukuran + '" placeholder="0">';
      const reject = u.sisa <= 0
        ? u.reject
        : '<input type="number" min="0" max="' + u.sisa + '" id="rincianRej-' + r.id + '-' + u.ukuran + '" placeholder="0">';
      html += '<tr><td>' + u.ukuran + '</td><td>' + u.qty + '</td><td>' + selesai + '</td><td>' + reject + '</td><td>' + u.sisa + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<button class="btn-tambah-antrian" data-tambah="' + r.id + '">+ Tambah ke Daftar</button></div>';
  return html;
}

function pasangEventLaporanCard() {
  document.querySelectorAll('[data-toggle]').forEach(function (el) {
    el.addEventListener('click', function () {
      const id = el.dataset.toggle;
      laporanTerbuka[id] = !laporanTerbuka[id];
      renderDaftarLaporan();
    });
  });
  document.querySelectorAll('[data-modebtn]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      modePerLaporan[el.dataset.id] = el.dataset.modebtn;
      renderDaftarLaporan();
    });
  });
  document.querySelectorAll('[data-tambah]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      tambahKeAntrian(parseInt(el.dataset.tambah, 10));
    });
  });
  // v.02: checkbox shortcut "tandai selesai semua sisa" - LANGSUNG masuk antrian (mode ringkas,
  // Selesai = sisa saat ini, Reject 0), TAPI tetap harus lewat "Kirim Rekap" buat beneran
  // terkirim - jadi tetap ada jeda konfirmasi (antrian ringkasan-nya berfungsi sebagai preview),
  // bukan langsung submit ke server saat itu juga.
  // v.11: checkbox sekarang mencerminkan status NYATA (ada/gaknya entri di antrian utk item
  // ini) - dicentang & TETAP centang selama masih di antrian (gak lagi dipaksa balik kosong),
  // dan card-nya ikut berubah kontras (lihat .ada-antrian) sebagai penanda baru dipilih.
  // v.12: penyebab "kayak ngedip doang, gak kejadian apa2" ketemu - begitu antrianSection
  // baru pertama kali muncul (dari display:none) DAN semua card lain ikut kolaps bersamaan,
  // seluruh daftar laporan geser turun/naik SEKETIKA, jadi checkbox yang barusan dipencet
  // "kabur" dari posisi yang lagi dilihat mata (padahal aksinya sendiri sukses). Fix: scroll
  // card yang bersangkutan balik ke pandangan begitu render selesai.
  document.querySelectorAll('[data-quickdone]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      const id = parseInt(el.dataset.quickdone, 10);
      const r = daftarLaporanData.find(function (x) { return x.id === id; });
      if (!r || r.sisa <= 0) { el.checked = false; tampilkanToast('Item ini sudah gak ada sisa.'); return; }
      const sudahDiAntrian = antrianQC.some(function (a) { return a.timPotongId === id; });
      if (sudahDiAntrian) {
        // v.15: uncek checkbox = otomatis hapus SEMUA entri laporan ini dari antrian, gak
        // perlu lagi buka kotak preview terus tap tombol ✕ satu-satu.
        antrianQC = antrianQC.filter(function (a) { return a.timPotongId !== id; });
        laporanTerbuka = {};
        renderDaftarLaporan();
        renderAntrian();
        requestAnimationFrame(function () {
          const kartuBaru = document.querySelector('.laporan-card[data-id="' + id + '"]');
          if (kartuBaru) kartuBaru.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        tampilkanToast('✕ "' + r.jenisWarnaBaju + '" dihapus dari antrian.');
        return;
      }
      antrianQC.push({
        timPotongId: id, mode: 'ringkas', ringkas: { selesai: r.sisa, reject: 0 },
        preview: r.jenisWarnaBaju + ' - Selesaikan sisa ' + r.sisa + ' pcs'
      });
      laporanTerbuka = {}; // v.11: auto-collapse semua card begitu ada item baru masuk antrian
      renderDaftarLaporan(); // refresh badge/pill/checklist/highlight kartu
      renderAntrian();
      requestAnimationFrame(function () {
        const kartuBaru = document.querySelector('.laporan-card[data-id="' + id + '"]');
        if (kartuBaru) kartuBaru.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      tampilkanToast('✓ "' + r.jenisWarnaBaju + '" ditambahkan ke antrian (selesaikan semua sisa) - cek dulu di daftar antrian sebelum Kirim Rekap.');
    });
  });
}

function tambahKeAntrian(id) {
  const sudahAdaDiAntrian = antrianQC.some(function (a) { return a.timPotongId === id; });
  if (sudahAdaDiAntrian) { tampilkanToast('Laporan ini sudah ada di antrian - hapus dulu kalau mau ubah angkanya.'); return; }

  const r = daftarLaporanData.find(function (x) { return x.id === id; });
  const mode = modePerLaporan[id] || 'ringkas';
  let entry = { timPotongId: id, mode: mode, preview: r.jenisWarnaBaju };

  if (mode === 'ringkas') {
    const s = parseFloat(document.getElementById('ringkasSelesai-' + id).value) || 0;
    const rj = parseFloat(document.getElementById('ringkasReject-' + id).value) || 0;
    if (s <= 0 && rj <= 0) { tampilkanToast('Isi dulu Selesai/Reject.'); return; }
    entry.ringkas = { selesai: s, reject: rj };
    entry.preview += ' - Ringkas Sel ' + s + ' Rej ' + rj;
  } else {
    const rincian = [];
    r.perUkuran.forEach(function (u) {
      if (u.sisa <= 0) return;
      const selEl = document.getElementById('rincianSel-' + id + '-' + u.ukuran);
      const rejEl = document.getElementById('rincianRej-' + id + '-' + u.ukuran);
      const s = selEl ? (parseFloat(selEl.value) || 0) : 0;
      const rj = rejEl ? (parseFloat(rejEl.value) || 0) : 0;
      if (s > 0 || rj > 0) rincian.push({ ukuran: u.ukuran, selesai: s, reject: rj });
    });
    if (rincian.length === 0) { tampilkanToast('Isi dulu minimal 1 ukuran.'); return; }
    entry.rincian = rincian;
    entry.preview += ' - Rincian ' + rincian.map(function (x) { return x.ukuran + ':' + x.selesai + '/' + x.reject; }).join(', ');
  }

  antrianQC.push(entry);
  laporanTerbuka = {}; // v.11: auto-collapse SEMUA card, bukan cuma yang barusan diisi
  renderDaftarLaporan();
  renderAntrian();
  requestAnimationFrame(function () {
    const kartuBaru = document.querySelector('.laporan-card[data-id="' + id + '"]');
    if (kartuBaru) kartuBaru.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  tampilkanToast('✓ Ditambahkan ke antrian');
}

// Hitung total Selesai/Reject yang lagi "nunggu dikirim" buat 1 laporan (dari antrianQC) -
// dipakai buat preview live di baris laporan (lingkaran angka + pill "di antrian").
function hitungPendingUntukLaporan_(id) {
  const entri = antrianQC.filter(function (a) { return a.timPotongId === id; });
  let pendingSelesai = 0, pendingReject = 0;
  entri.forEach(function (a) {
    if (a.mode === 'ringkas') {
      pendingSelesai += a.ringkas.selesai;
      pendingReject += a.ringkas.reject;
    } else {
      a.rincian.forEach(function (r2) { pendingSelesai += r2.selesai; pendingReject += r2.reject; });
    }
  });
  return { jumlahEntri: entri.length, pendingSelesai: pendingSelesai, pendingReject: pendingReject };
}

function hapusDariAntrian(index) {
  antrianQC.splice(index, 1);
  renderDaftarLaporan();
  renderAntrian();
}

function renderAntrian() {
  const section = document.getElementById('antrianSection');
  const caption = document.getElementById('antrianCaption');
  const btnKirim = document.getElementById('btnKirimRekap');
  const previewBox = document.getElementById('antrianPreviewBox');

  if (antrianQC.length === 0) {
    section.style.display = 'none';
    previewBox.style.display = 'none';
    btnKirim.textContent = '🚀 Kirim Rekap (0)';
    btnKirim.disabled = true;
    return;
  }

  section.style.display = 'block';
  caption.textContent = antrianQC.length + ' laporan menunggu dikirim';

  btnKirim.textContent = '🚀 Kirim Rekap (' + antrianQC.length + ')';
  btnKirim.disabled = false;

  // v.11: gak ada lagi kartu putih terpisah di atas - hapus item sekarang langsung dari box
  // preview gelap ini, tiap baris dikasih tombol ✕ sendiri.
  previewBox.style.display = 'block';
  previewBox.innerHTML = '<div class="judul">📋 REKAP UPDATE QC (' + antrianQC.length + ' laporan)</div>' +
    antrianQC.map(function (a, i) {
      const angka = a.mode === 'ringkas' ? a.ringkas : null;
      const angkaTeks = angka
        ? ('Selesai: ' + angka.selesai + ' pcs · Reject: ' + angka.reject + ' pcs')
        : a.rincian.map(function (r2) { return r2.ukuran + ': ' + r2.selesai + ' sel / ' + r2.reject + ' rej'; }).join(', ');
      return '<div class="item">' +
        '<div class="itext"><div class="inama">' + escapeHtml(a.preview.split(' - ')[0]) + '</div>' +
        '<div class="iangka">' + escapeHtml(angkaTeks) + '</div></div>' +
        '<button class="item-hapus" data-hapusantrian="' + i + '">✕</button>' +
        '</div>';
    }).join('') +
    '<div class="hint">preview - klik "Kirim Rekap" utk kirim beneran</div>';
  previewBox.querySelectorAll('[data-hapusantrian]').forEach(function (el) {
    el.addEventListener('click', function () { hapusDariAntrian(parseInt(el.dataset.hapusantrian, 10)); });
  });
}

document.getElementById('btnKirimRekap').addEventListener('click', function () {
  if (!tg || !tg.initData) { tampilkanToast('Harus dibuka lewat Telegram.'); return; }
  if (antrianQC.length === 0) return;
  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Mengirim...';

  const antrianSalinan = antrianQC.slice();
  let berhasil = 0, gagalPesan = [];

  function prosesSatuPersatu(i) {
    if (i >= antrianSalinan.length) {
      antrianQC = [];
      renderAntrian();
      muatDaftarLaporan();
      if (gagalPesan.length > 0) {
        tampilkanToast(berhasil + ' berhasil, ' + gagalPesan.length + ' gagal - cek detail.');
        alert('Gagal:\n' + gagalPesan.join('\n'));
      } else {
        tampilkanToast('✓ Semua (' + berhasil + ') berhasil dikirim!');
      }
      return;
    }
    const item = antrianSalinan[i];
    const payload = { initData: tg.initData, timPotongId: item.timPotongId, mode: item.mode };
    if (item.mode === 'ringkas') payload.ringkas = item.ringkas; else payload.rincian = item.rincian;

    fetch(WORKER_URL + '/submit-qc', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) berhasil++; else gagalPesan.push(item.preview + ': ' + data.error);
        prosesSatuPersatu(i + 1);
      })
      .catch(function (e) {
        gagalPesan.push(item.preview + ': ' + e.message);
        prosesSatuPersatu(i + 1);
      });
  }
  prosesSatuPersatu(0);
});

let sedangMuatStok = false;
function muatStokUtuh(percobaan, manual) {
  percobaan = percobaan || 0;
  manual = manual !== false;
  if (percobaan === 0) {
    if (sedangMuatStok) return;
    sedangMuatStok = true;
    tampilkanLoading(true);
    if (!stokUtuhData) {
      const cache = ambilCacheDashboard_('stok_utuh');
      if (cache && cache.data) {
        stokUtuhData = cache.data;
        if (manual) tampilkanLabelCache_('Stok Kain', cache.waktu);
        document.getElementById('totalKgTersisa').innerHTML = formatAngka(stokUtuhData.totalKg) + ' <span class="unit">kg</span>';
        document.getElementById('totalKgSub').textContent = 'di ' + stokUtuhData.totalRoll + ' roll · ' + stokUtuhData.totalWarna + ' warna';
        renderWarnaGrid();
      }
    }
  }
  fetch(WORKER_URL + '/data/stok-utuh')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      stokUtuhData = data;
      simpanCacheDashboard_('stok_utuh', data);
      updateJamRefresh(manual);
      document.getElementById('totalKgTersisa').innerHTML = formatAngka(data.totalKg) + ' <span class="unit">kg</span>';
      document.getElementById('totalKgSub').textContent = 'di ' + data.totalRoll + ' roll · ' + data.totalWarna + ' warna';
      renderWarnaGrid();
      sedangMuatStok = false;
      tampilkanLoading(false);
    })
    .catch(function (e) {
      if (percobaan < 1) { setTimeout(function () { muatStokUtuh(percobaan + 1, manual); }, 1500); return; }
      sedangMuatStok = false;
      tampilkanLoading(false);
      tampilkanToast('Gagal memuat stok: ' + e.message);
    });
}
function renderWarnaGrid() {
  if (!stokUtuhData) return;
  let list = stokUtuhData.perWarna.slice();
  if (searchWarnaQuery) {
    const q = searchWarnaQuery.toLowerCase();
    list = list.filter(function (w) { return w.warna.toLowerCase().indexOf(q) !== -1; });
  }
  if (sortWarna === 'kg') list.sort(function (a, b) { return b.totalKg - a.totalKg; });
  else if (sortWarna === 'nama') list.sort(function (a, b) { return a.warna.localeCompare(b.warna); });
  else if (sortWarna === 'roll') list.sort(function (a, b) { return b.jumlahRoll - a.jumlahRoll; });

  document.getElementById('warnaGrid').innerHTML = list.map(function (w, i) {
    const terbuka = !!warnaTerbuka[w.warna];
    const hexWarna = warnaKeHex_(w.warna);
    let html = '<div class="warna-card" style="border-left:4px solid ' + hexWarna + '" data-warnatoggle="' + escapeAttr(w.warna) + '">' +
      '<div class="warna-card-top"><span class="swatch" style="background:' + hexWarna + '"></span>' +
      '<span class="nama">' + (i + 1) + '. ' + escapeHtml(w.warna) + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:4px"><span class="roll-count">' + w.jumlahRoll + ' roll</span><span class="kg">' + formatAngka(w.totalKg) + ' kg</span></div>';
    if (terbuka) {
      html += '<div class="warna-detail">' + w.rolls.map(function (r) {
        return '<div class="roll-row"><span>Roll ' + (r.kodeRoll ? escapeHtml(r.kodeRoll) : '-') + '</span><span>' + formatAngka(r.kg) + ' kg</span></div>';
      }).join('') + '</div>';
    }
    html += '</div>';
    return html;
  }).join('');

  document.querySelectorAll('[data-warnatoggle]').forEach(function (el) {
    el.addEventListener('click', function () {
      const w = el.dataset.warnatoggle;
      warnaTerbuka[w] = !warnaTerbuka[w];
      renderWarnaGrid();
    });
  });
}

});
document.getElementById('searchRekap').addEventListener('input', function () {

let rekapItemsRaw = [];

let sedangMuatRekap = false;
function muatRekapQC(percobaan, manual) {
  percobaan = percobaan || 0;
  manual = manual !== false;
  let munculDariCache = false;
  if (percobaan === 0) {
    if (sedangMuatRekap) return;
    sedangMuatRekap = true;
    tampilkanLoading(true);
    if (rekapItemsRaw.length === 0) {
      const cache = ambilCacheDashboard_('rekap_qc');
      if (cache && cache.data) {
        rekapItemsRaw = cache.data;
        if (manual) tampilkanLabelCache_('Rekap QC', cache.waktu);
        renderRekapQC();
        munculDariCache = true;
      }
    }
    if (!munculDariCache) document.getElementById('rekapSummary').textContent = 'Memuat...';
  }
  fetch(WORKER_URL + '/data/rekap-qc?hari=14')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      rekapItemsRaw = Array.isArray(data) ? data : [];
      simpanCacheDashboard_('rekap_qc', rekapItemsRaw);
      updateJamRefresh(manual);
      renderRekapQC();
      sedangMuatRekap = false;
      tampilkanLoading(false);
    })
    .catch(function (e) {
      if (percobaan < 1) { setTimeout(function () { muatRekapQC(percobaan + 1, manual); }, 1500); return; }
      sedangMuatRekap = false;
      tampilkanLoading(false);
      if (rekapItemsRaw.length > 0) {
        tampilkanToast('Gagal refresh Rekap QC: ' + e.message);
      } else {
        document.getElementById('rekapSummary').textContent = 'Gagal memuat';
        document.getElementById('rekapList').innerHTML = '<div class="rekap-row" style="grid-template-columns:1fr"><div class="rekap-muted">Gagal memuat: ' + escapeHtml(e.message) + '</div></div>';
      }
    });
}

function formatWaktuRekap(waktuIso) {
  if (!waktuIso) return '-';
  const d = new Date(waktuIso);
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// Kolom ukuran cuma yang BENERAN dipakai di data yang lagi ditampilkan (biar gak banyak kolom
// kosong). Kolom Reject SENGAJA cuma 1 (total angka), bukan dipecah per ukuran - detail
// per-ukurannya tetap ada di database (notasi ringkas), cuma gak ditampilkan di sini biar
// tabel gak penuh. Harga Jait/Total Bayar SENGAJA TIDAK ditampilkan (itu info akunting).
function renderRekapQC() {
  let items = rekapItemsRaw;
  if (searchRekapQuery) {
    const q = searchRekapQuery.toLowerCase();
    items = items.filter(function (it) {
      return String(it.warna || '').toLowerCase().indexOf(q) !== -1 ||
        String(it.varian || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  const semuaUkuranDipakai = {};
  items.forEach(function (it) { it.perUkuran.forEach(function (u) { semuaUkuranDipakai[u.ukuran] = true; }); });
  const ukuranDipakai = DAFTAR_UKURAN_URUT.filter(function (u) { return semuaUkuranDipakai[u]; });

  const LEBAR_WAKTU = 92, LEBAR_WARNA = 110, LEBAR_VARIAN = 100, LEBAR_UKURAN = 34, LEBAR_ANGKA = 60;
  const templateKolom = LEBAR_WAKTU + 'px ' + LEBAR_WARNA + 'px ' + LEBAR_VARIAN + 'px ' +
    ukuranDipakai.map(function () { return LEBAR_UKURAN + 'px'; }).join(' ') +
    ' ' + LEBAR_ANGKA + 'px ' + LEBAR_ANGKA + 'px';
  const lebarTotal = LEBAR_WAKTU + LEBAR_WARNA + LEBAR_VARIAN + (ukuranDipakai.length * LEBAR_UKURAN) + (LEBAR_ANGKA * 2);

  const list = document.getElementById('rekapList');
  list.style.minWidth = lebarTotal + 'px';

  const summary = document.getElementById('rekapSummary');
  const headHtml = '<div class="rekap-row rekap-head" style="grid-template-columns:' + templateKolom + '">' +
    '<div>Waktu</div><div>Warna</div><div>Varian</div>' +
    ukuranDipakai.map(function (u) { return '<div class="rekap-num">' + u + '</div>'; }).join('') +
    '<div class="rekap-num">Selesai</div><div class="rekap-num">Reject</div></div>';

  if (items.length === 0) {
    summary.textContent = searchRekapQuery ? 'Gak ada hasil buat "' + searchRekapQuery + '".' : 'Belum ada submit QC dalam 14 hari terakhir.';
    list.innerHTML = headHtml + '<div class="rekap-row" style="grid-template-columns:1fr"><div class="rekap-muted">' + (searchRekapQuery ? 'Gak ada hasil pencarian.' : 'Belum ada submit QC.') + '</div></div>';
    document.getElementById('rekapFoot').innerHTML = '';
    return;
  }
  summary.textContent = items.length + ' submit' + (searchRekapQuery ? ' (hasil pencarian)' : ' (14 hari terakhir)');

  const barisHtml = items.map(function (it) {
    const petaUkuran = {};
    it.perUkuran.forEach(function (u) { petaUkuran[u.ukuran] = u.selesai; });
    return '<div class="rekap-row" style="grid-template-columns:' + templateKolom + '">' +
      '<div class="rekap-muted">' + formatWaktuRekap(it.waktu) + '</div>' +
      '<div>' + escapeHtml(it.warna || '-') + '</div>' +
      '<div class="rekap-muted">' + escapeHtml(it.varian || '-') + '</div>' +
      ukuranDipakai.map(function (u) { return '<div class="rekap-num">' + (petaUkuran[u] ? petaUkuran[u] : '<span class="rekap-muted">–</span>') + '</div>'; }).join('') +
      '<div class="rekap-selesai">' + it.total + '</div>' +
      '<div class="' + (it.rejectTotal > 0 ? 'rekap-reject' : 'rekap-num rekap-muted') + '">' + it.rejectTotal + '</div>' +
      '</div>';
  }).join('');

  list.innerHTML = headHtml + barisHtml;

  const totalSel = items.reduce(function (s, it) { return s + it.total; }, 0);
  const totalRej = items.reduce(function (s, it) { return s + it.rejectTotal; }, 0);
  document.getElementById('rekapFoot').innerHTML =
    '<span>Total selesai: <b>' + totalSel + '</b></span><span>Total reject: <b>' + totalRej + '</b></span>';
}

// ------------------------------------------------------------
// HELPER
// ------------------------------------------------------------
function escapeHtml(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeAttr(t) { return escapeHtml(t).replace(/"/g, '&quot;'); }
// v.14: SEBELUMNYA maximumFractionDigits:1 - bikin angka kg kepotong presisinya (mis. 24.85kg
// di Supabase tampil "24,9" di sini, ketauan Denny). Kg disimpan sampai 2 desimal di Supabase,
// jadi format tampilan disamain ke 2 desimal biar PERSIS sama kayak sumber datanya, bukan
// dibulatkan.
function formatAngka(n) { return Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }); }
function tampilkanToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 2500);
}

// ------------------------------------------------------------
// REALTIME - auto-update tanpa refresh manual. Begitu ada perubahan di tim_potong/log_qc di
// Supabase (dari Mini App Input Produksi, atau dari Dashboard ini sendiri sesi lain), data di
// layar ini ke-refresh OTOMATIS. Pakai "debounce" biar kalau banyak perubahan numpuk
// bersamaan, gak nembak ulang Worker berkali-kali beruntun - tunggu 800ms hening dulu.
// ------------------------------------------------------------
// v.08: helper terpusat - refresh tab yang LAGI KELIATAN aja (bukan semua tab sekaligus,
// biar gak boros request buat tab yang gak lagi dilihat).
// v.20: muatTabAktif_() dipakai buat auto-sync Realtime + jaring pengaman visibilitychange/
// focus (ver.08) - keduanya SILENT/otomatis, jadi semua panggilan di sini eksplisit manual=false
// biar gak nembak toast "✓ Update ..." sendiri di background.
function muatTabAktif_() {
  muatDaftarLaporan(0, false);
  if (document.getElementById('tabStok').style.display !== 'none') muatStokUtuh(0, false);
  if (document.getElementById('tabRekap').style.display !== 'none') muatRekapQC(0, false);
}

let timerDebounceRealtime = null;
function jadwalkanMuatUlang() {
  if (timerDebounceRealtime) clearTimeout(timerDebounceRealtime);
  timerDebounceRealtime = setTimeout(muatTabAktif_, 800);
}

// v.08: JARING PENGAMAN - koneksi WebSocket Realtime bisa putus diam-diam kalau tab dibiarkan
// lama di background (WebView Telegram/OS suka "menidurkan" tab background buat hemat baterai),
// tanpa ada tanda apa pun ke user. Begitu tab ini balik keliatan/fokus lagi, TARIK ULANG data
// sekali secara paksa (gak nunggu event Realtime yang mungkin udah gak nyambung lagi) - jadi
// walau koneksi sempat putus, paling telat ke-update pas dibuka lagi, bukan nyangkut selamanya.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') muatTabAktif_();
});
window.addEventListener('focus', muatTabAktif_);

function setupRealtime() {
  if (!window.supabase) { console.warn('Supabase JS client gagal dimuat - auto-update nonaktif, tetap bisa refresh manual.'); return; }
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  client.channel('dashboard-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tim_potong' }, jadwalkanMuatUlang)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'log_qc' }, jadwalkanMuatUlang)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stok_kain' }, jadwalkanMuatUlang)
    .subscribe();
}

// ------------------------------------------------------------
// BOOTSTRAP
// ------------------------------------------------------------
muatDaftarLaporan();
setupRealtime();
</script>
