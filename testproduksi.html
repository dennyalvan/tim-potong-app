<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Worker Produksi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; padding: 16px; background: #f2f2f2; }
  button { padding: 12px 20px; font-size: 16px; margin: 8px 0; width: 100%; }
  pre { background: #fff; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .ok { color: green; font-weight: bold; }
  .gagal { color: red; font-weight: bold; }
</style>
</head>
<body>
  <h3>Tes Worker Produksi (Tahap 1)</h3>
  <p>Halaman ini SEMENTARA, cuma buat ngetes - bukan Mini App produksi yang sebenarnya.</p>

  <!-- GANTI URL INI sesuai URL Worker yang sudah Denny deploy -->
  <p>URL Worker: <input type="text" id="workerUrl" style="width:100%" value="https://tim-potong-api.GANTI-SESUAI-USER.workers.dev/tes-validasi-initdata"></p>

  <button onclick="tesValidasi()">Tes Validasi initData</button>
  <div id="hasil"></div>

  <hr>
  <h4>Tahap 2 - Data Referensi</h4>
  <button onclick="tesData('kategori-varian')">Tes /data/kategori-varian</button>
  <button onclick="tesData('kombinasi-warna')">Tes /data/kombinasi-warna</button>
  <button onclick="tesData('warna-kanonik')">Tes /data/warna-kanonik</button>
  <button onclick="tesData('stok-roll')">Tes /data/stok-roll</button>
  <div id="hasilData"></div>

  <hr>
  <h4>Tahap 3 - Submit Produksi (contoh)</h4>
  <p>Contoh: kategori Dewasa, kode item "TS" (Pendek 24S), warna NAVY, kg 5, roll TES0001, size S=2 M=3</p>
  <button onclick="tesSubmit()">Tes Submit Produksi (data contoh)</button>
  <div id="hasilSubmit"></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.ready();

    function tesValidasi() {
      const hasilDiv = document.getElementById('hasil');
      const workerUrl = document.getElementById('workerUrl').value.trim();
      if (!tg || !tg.initData) {
        hasilDiv.innerHTML = '<p class="gagal">Halaman ini HARUS dibuka dari Telegram (lewat Mini App), bukan browser biasa - initData kosong.</p>';
        return;
      }
      hasilDiv.innerHTML = '<p>Mengirim...</p>';
      fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          hasilDiv.innerHTML =
            '<p class="' + (data.ok ? 'ok' : 'gagal') + '">' + (data.ok ? '✅ VALID' : '❌ GAGAL') + '</p>' +
            '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        })
        .catch(function (err) {
          hasilDiv.innerHTML = '<p class="gagal">Error jaringan: ' + err.message + '</p>';
        });
    }
    function tesData(namaEndpoint) {
      const hasilDiv = document.getElementById('hasilData');
      const workerBase = document.getElementById('workerUrl').value.trim().replace('/tes-validasi-initdata', '');
      hasilDiv.innerHTML = '<p>Mengirim ke /data/' + namaEndpoint + '...</p>';
      fetch(workerBase + '/data/' + namaEndpoint)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          hasilDiv.innerHTML = '<p class="ok">✅ Respons diterima</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        })
        .catch(function (err) {
          hasilDiv.innerHTML = '<p class="gagal">Error: ' + err.message + '</p>';
        });
    }
    function tesSubmit() {
      const hasilDiv = document.getElementById('hasilSubmit');
      const workerBase = document.getElementById('workerUrl').value.trim().replace('/tes-validasi-initdata', '');
      if (!tg || !tg.initData) {
        hasilDiv.innerHTML = '<p class="gagal">Harus dibuka dari Telegram.</p>';
        return;
      }
      const contoh = {
        initData: tg.initData,
        items: [
          {
            kategori: 'Dewasa',
            kodeItem: 'TS',
            warna: 'NAVY',
            kg: 5,
            kodeRoll: 'TES0001',
            ukuran: { S: 2, M: 3 }
          }
        ]
      };
      hasilDiv.innerHTML = '<p>Mengirim...</p>';
      fetch(workerBase + '/submit-produksi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(contoh)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          hasilDiv.innerHTML =
            '<p class="' + (data.ok ? 'ok' : 'gagal') + '">' + (data.ok ? '✅ SUKSES' : '❌ GAGAL') + '</p>' +
            '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        })
        .catch(function (err) {
          hasilDiv.innerHTML = '<p class="gagal">Error: ' + err.message + '</p>';
        });
    }
  </script>
</body>
</html>
