<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Input Produksi - Tim Potong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #eef2fb;
    --card-bg: #ffffff;
    --teal: #14b8a6;
    --teal-dark: #0d9488;
    --navy: #1e3a5f;
    --navy-dark: #16324a;
    --mode-accent: var(--teal);
    --mode-accent-dark: var(--teal-dark);
    --mode-accent-rgb: 20,184,166;
    --blue-link: #2563eb;
    --orange-link: #d97706;
    --gray-label: #9aa3b2;
    --gray-text: #6b7280;
    --border: #e2e8f0;
    --green: #22c55e;
    --green-dark: #16a34a;
    --danger: #ef4444;
    --page-bg: var(--bg);
  }
  * { box-sizing: border-box; }
  /* v.17: FIX font Space Grotesk gak nyampe ke tombol/input (request Denny) - browser secara
     default gak nurunin font-family body ke elemen form (button, input, select, textarea),
     mereka pakai font UI sistem sendiri kecuali di-reset eksplisit kayak gini. Ini yang bikin
     tombol KATEGORI (Anak/Dewasa) & semua kotak isian keliatan masih pakai font lama. */
  button, input, select, textarea { font-family: inherit; }
  /* v.10: background HALAMAN juga ikut gelap pas mode DEWASA (request Denny - sebelumnya cuma
     tombol toggle & beberapa elemen form doang yang berubah, background-nya tetap sama). Pakai
     variabel --page-bg TERPISAH dari --bg (bukan override --bg langsung), soalnya --bg juga
     dipakai buat isian input/kombi-chip yang HARUS tetap terang biar teks di dalamnya kebaca. */
  body.mode-dewasa {
    --mode-accent: #475569;
    --mode-accent-dark: #1e293b;
    --mode-accent-rgb: 71,85,105;
    --page-bg: #c7d0dc;
  }
  body {
    margin: 0;
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--page-bg);
    color: #1c1c1e;
    padding-bottom: 90px;
    transition: background .25s ease;
  }
  #app, #previewScreen { max-width: 480px; margin: 0 auto; padding: 16px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .header h1 { font-size: 20px; margin: 0; letter-spacing: 0.3px; }
  .header-right { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .link-btn { display: block; background: none; border: none; font-size: 13px; cursor: pointer; padding: 2px 0; text-align: right; width: 100%; }
  /* v.23: ganti lagi (request Denny) - ternyata bukan cuma soal warna, emoji 🔄 di PC-nya
     Denny tampil dengan LATAR kotak rounded biru (kayak app-icon), tapi di HP cuma tampil
     garis polos tanpa latar - beda desain emoji per device lagi. Sekarang dibikin custom:
     kotak rounded biru solid + ikon putih di dalamnya, dijamin sama persis di semua device
     karena semuanya custom (background & ikon), gak ada bagian yang masih pinjam dari font
     emoji sistem. */
  .link-btn.refresh {
    display: inline-flex; width: 30px; height: 30px; border-radius: 9px; border: none;
    background: #2196F3; align-items: center; justify-content: center; padding: 0; box-shadow: none;
  }
  .link-btn.refresh svg { width: 18px; height: 18px; }
  .link-btn.atur { color: var(--orange-link); }

  .section-label { font-size: 12.5px; color: var(--gray-label); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin: 14px 4px 6px; }

  .kategori-toggle { display: flex; gap: 8px; }
  .kat-btn {
    flex: 1; padding: 10px 8px; border-radius: 16px; border: none;
    background: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px; color: #374151;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.04);
    transition: all .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .kat-btn .emoji { font-size: 18px; }
  .kat-btn.active {
    background: linear-gradient(160deg, var(--mode-accent), var(--mode-accent-dark));
    color: #fff; transform: translateY(-3px) scale(1.015);
    box-shadow: 0 10px 22px -6px rgba(var(--mode-accent-rgb),.4);
  }

  .cut-divider { position: relative; height: 2px; margin: 16px 4px 2px; background-image: repeating-linear-gradient(90deg, #d3dae8 0 7px, transparent 7px 15px); }
  .cut-divider .scissor-chip {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--bg); width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    border: 1.5px dashed #d3dae8;
  }

  .card { background: var(--card-bg); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.04); }
  .field-row {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; gap: 10px;
    border-bottom: 0.5px solid var(--border); cursor: pointer;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .flabel { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .field-row .fvalue { color: #9aa3b2; font-size: 14px; text-align: right; }
  .field-row .fvalue.filled { color: #1c1c1e; font-weight: 600; }
  .badge-wajib { background: #f3f4f6; color: #6b7280; font-size: 10.5px; padding: 2px 8px; border-radius: 6px; font-weight: 650; }
  .chevron { color: #c7cedb; font-size: 11px; margin-left: 4px; }
  .field-row.wrap { flex-direction: column; align-items: stretch; cursor: default; gap: 6px; }
  .field-row.wrap .frow-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
  .field-row input[type="text"], .field-row input[type="number"] {
    border: none; outline: none; background: transparent; flex: 1; min-width: 0;
    text-align: right; font-size: 15px; font-weight: 600; color: #1c1c1e; font-family: inherit; padding: 0;
  }
  .field-row input::placeholder { color: #9aa3b2; font-weight: 500; }
  .field-row input[readonly] { color: var(--mode-accent-dark); }
  .field-row.wrap .suggestion-list { margin-top: 2px; }
  #rowWarna, #rowKodeRoll { border-bottom: none; }
  .chk-sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--gray-text); font-weight: 600; }
  .chk-sub input[type="checkbox"] { width: auto; flex: none; margin: 0; }
  .combo-picker-btn {
    background: rgba(var(--mode-accent-rgb),0.08); border: 1.5px dashed var(--mode-accent);
    border-radius: 12px; padding: 11px 13px; font-size: 15px; font-weight: 600; color: var(--mode-accent-dark);
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin: 10px 16px;
  }
  .combo-picker-btn .chev { font-size: 13px; opacity: .7; }

  .dropdown-list { max-height: 260px; overflow-y: auto; overflow-x: hidden; margin: 8px 14px 10px; border-radius: 14px; border: 1px solid var(--border); }
  .dropdown-item { padding: 10px 14px; font-weight: 600; font-size: 14.5px; cursor: pointer; border-bottom: 0.5px solid rgba(0,0,0,.06); }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:nth-child(6n+1) { background: #F1F7FD; }
  .dropdown-item:nth-child(6n+2) { background: #EAF3FB; }
  .dropdown-item:nth-child(6n+3) { background: #F5F9FE; }
  .dropdown-item:nth-child(6n+4) { background: #E6F0FA; }
  .dropdown-item:nth-child(6n+5) { background: #EFF6FC; }
  .dropdown-item:nth-child(6n+0) { background: #E3EEF9; }
  .dropdown-item .accent { float: right; color: #9aa3b2; font-weight: 500; font-size: 13px; }
  .dropdown-item.manual { color: var(--orange-link); background: #fff; }

  .subrow { padding: 10px 16px; }
  .kg-input-full {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px;
    text-align: right;
  }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 0 16px 14px; font-size: 13px; color: var(--gray-text); }

  .kombi-chips { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }

  .kombi-chip .num { position: absolute; top: -8px; left: 8px; background: var(--navy); color: #fff; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .ganti-kombinasi { padding: 0 16px 10px; margin-top: 2px; }
  .ganti-kombinasi a { color: var(--blue-link); font-size: 12.5px; font-weight: 600; cursor: pointer; }

  .kombi-warna-section { padding: 10px 16px 14px; border-bottom: 1px solid var(--border); }
  .kombi-warna-section .sub-title { font-size: 11.5px; font-weight: 650; color: var(--gray-label); margin: 10px 0 4px; }
  .kombi-warna-section .sub-title-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; gap: 8px; }
  .kombi-warna-section .sub-title-row .sub-title { margin: 0; }
  /* v.31: wrapper buat 2 checkbox (Pakai habis + Pakai Estimasi) berdampingan di baris warna
     pertama - tanpa ini, space-between di .sub-title-row bakal misah keduanya ke ujung-ujung
     yang beda (request Denny: dua-duanya harus nempel bareng di kanan). */
  .sub-title-checks { display: flex; align-items: center; gap: 10px; }
  /* v.34 (request Denny): "Kg + Kode Roll" sekarang dibikin nyambung kayak sel tabel Excel -
     1 kotak bareng dengan garis pemisah vertikal antara kolom Kg & Kode Roll, bukan lagi 2 kotak
     lepas yang cuma dikasih gap kosong tanpa pembeda. Susah dibedain kalau banyak baris warna
     sekaligus (Kombinasi 3 Warna/Ringer/Custom - ketiganya pakai class yang sama, jadi 1 CSS ini
     kepakai di semuanya). Warna background & border TETAP var(--bg)/var(--border) yang sudah ada
     (konsisten sama input lain di app), cuma susunannya yang diubah jadi grid nyambung. */
  .kombi-warna-section .sub-fields { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .kombi-warna-section input.kg-mini { flex: 0 0 70px; min-width: 0; padding: 9px 8px; border: none; border-right: 1.5px solid var(--border); border-radius: 0; font-size: 14px; font-weight: 600; background: var(--bg); }
  .kombi-warna-section input.roll-mini-input, .kombi-warna-section input.roll-mini-input-custom { flex: 1; min-width: 0; padding: 9px 8px; border: none; border-radius: 0; font-size: 13.5px; font-weight: 600; background: var(--bg); text-overflow: ellipsis; }
  .kombi-warna-section input.kg-mini::placeholder, .kombi-warna-section input.roll-mini-input::placeholder, .kombi-warna-section input.roll-mini-input-custom::placeholder { font-weight: 500; color: #9aa3b2; }

  .autocomplete-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; }
  .suggestion-list { max-height: 260px; overflow-y: auto; overflow-x: hidden; margin-top: 8px; border-radius: 14px; border: 1px solid var(--border); }
  .suggestion-item { padding: 10px 14px; font-size: 14.5px; font-weight: 600; cursor: pointer; border-bottom: 0.5px solid rgba(0,0,0,.06); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:nth-child(6n+1) { background: #F1F7FD; }
  .suggestion-item:nth-child(6n+2) { background: #EAF3FB; }
  .suggestion-item:nth-child(6n+3) { background: #F5F9FE; }

  .suggestion-item .kg-hint { float: right; color: #9aa3b2; font-weight: 500; font-size: 13px; }
  .suggestion-item.roll-suggestion { text-align: right; }

  .qty-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 9px 14px; }
  .qty-cell { text-align: center; }
  .qty-cell label { display: block; color: var(--gray-label); font-weight: 650; font-size: 11px; margin-bottom: 2px; }
  .qty-cell input { width: 100%; padding: 6px 4px; border: 1px solid var(--border); border-radius: 10px; text-align: center; font-size: 15px; font-weight: 600; background: var(--bg); }

  .total-qty #totalQtyItem { color: #1c1c1e; font-size: 16px; font-weight: 700; }

  .queue-box { background: var(--navy); border-radius: 16px; padding: 14px 16px; color: #fff; }
  .queue-box .qtitle { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.5px; color: #b8c4d9; font-weight: 700; margin-bottom: 10px; }
  .queue-box .qbadge { background: var(--blue-link); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  .queue-item .qtag.dewasa { background: #475569; color: #fff; }
  .queue-item .qdesc { font-weight: 700; font-size: 13px; }

  .queue-item .qremove { background: none; border: none; color: #f87171; font-size: 16px; cursor: pointer; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--page-bg);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px;
    max-width: 480px; margin: 0 auto; box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
  }
  .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn.tambah { background: #dbe4fb; color: var(--navy); }
  .btn.buatteks { background: var(--green); color: #fff; }
  .btn.buatteks:disabled { background: #c4c4c4; color: #8a8a8a; }
  /* v.11: kontras tombol bawah kurang pas di mode Dewasa (request Denny) - warna aslinya
     (#dbe4fb terang, navy gelap) dirancang buat background terang; begitu --page-bg ikut
     digelapin, tombol.tambah yang terang jadi nyaris nyatu sama background. Override khusus
     di sini: tombol.tambah dibikin lebih terang lagi (bukan makin gelap) biar tetap menonjol
     kontras dari background medium-gelapnya, tombol.buatteks tetap gelap pekat.
     v.36: tombol.buatteks warnanya sekarang ngikut var(--green) di atas (bukan navy statis lagi)
     - override khusus mode Dewasa ini jadi gak perlu, dihapus. */
  body.mode-dewasa .btn.tambah { background: #f1f5f9; color: #1e293b; }
  .btn.kirim { background: var(--green); color: #fff; width: 100%; padding: 16px; font-size: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
  .btn.kirim:disabled { background: #9ad9ae; cursor: wait; }
  .btn.secondary { flex: 1; background: #dbe4fb; color: var(--navy); padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }

  .preview-center { text-align: center; padding: 30px 10px 10px; }
  .preview-center .icon { width: 48px; height: 48px; background: #dbe4fb; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px; }
  .preview-center h2 { margin: 0 0 8px; }
  .preview-center p { color: var(--gray-text); font-size: 13px; line-height: 1.5; max-width: 320px; margin: 0 auto; }
  .preview-box { background: #fff; border-radius: 14px; padding: 16px; margin: 20px 0; white-space: pre-wrap; font-size: 14px; line-height: 1.6; min-height: 60px; }

  .kg-suspicious { color: var(--danger) !important; font-weight: 800 !important; }
  .kg-warning-text { font-size: 11.5px; color: var(--danger); margin-top: 4px; font-weight: 650; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1c1c1e; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>

<script>
// ============================================================
// KONFIGURASI - GANTI sesuai URL Worker produksi yang sudah di-deploy
// ============================================================
const WORKER_URL = 'https://tim-potong-api.dennyalvan.workers.dev';

const DAFTAR_UKURAN_UTAMA = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
const DAFTAR_UKURAN_LAIN = ['3XL', '4XL', '5XL', '6XL'];
const RING_WARNA_LIST = ['GREY NAVY', 'PUTIH TERACOTA', 'PUTIH HITAM', 'MUSTARD NAVY', 'PUTIH COKLAT', 'PUTIH MUSTARD', 'PUTIH MERAH', 'PUTIH BIRU'];

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// ------------------------------------------------------------
// AUTO-SCROLL - jaga elemen (dropdown/suggestion yg baru muncul) tetap terlihat di atas
// keyboard virtual, di device apapun. Dipanggil tiap kali dropdown/daftar saran dirender;
// juga di-listen ulang lewat visualViewport (kalau keyboard baru muncul/animasi SETELAH
// render, misal delay animasi keyboard Android/iOS).
// ------------------------------------------------------------
let __elemJagaTerlihat = null;
function __scrollKeVisible(el) {
  if (!el || !el.isConnected) return;
  const margin = 16;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const rect = el.getBoundingClientRect();
  if (rect.bottom > vh - margin) {
    window.scrollBy({ top: Math.ceil(rect.bottom - vh + margin), behavior: 'smooth' });
  } else if (rect.top < margin) {
    window.scrollBy({ top: Math.ceil(rect.top - margin), behavior: 'smooth' });
  }
}
function jagaTerlihat(el) {
  if (!el) return;
  __elemJagaTerlihat = el;
  setTimeout(function () { __scrollKeVisible(el); }, 280);
}
function cekKgLebih99(el, warnEl) {
  const v = parseFloat(el.value);
  const bermasalah = !isNaN(v) && v > 99;
  el.classList.toggle('kg-suspicious', bermasalah);
  if (warnEl) {
    warnEl.style.display = bermasalah ? 'block' : 'none';
    warnEl.textContent = bermasalah ? '⚠️ ' + v + 'kg? Gak ada kain 1 roll yang beratnya di atas 40kg - cek ulang angkanya.' : '';
  }
}
// v.33: peringatan (BUKAN blokir - tetap boleh lanjut, sama pola kayak peringatan kg>99 di atas)
// kalau kode roll yang DIKETIK MANUAL gak ketemu di stokRollData buat warna itu (request Denny).
// Sengaja dicek pas BLUR (bukan tiap keystroke kayak kg) - exact-match ke daftar kode yang beneran
// ada, kalau dicek tiap huruf pas masih setengah ngetik bakal nge-flash "gak ketemu" terus-terusan
// sebelum kodenya lengkap.
// v.35 (request Denny): tambah state KETIGA - kode roll DITEMUKAN tapi kg sisa-nya KURANG dari kg
// yang diminta. Beda dari "gak ketemu" (informasinya emang gak ada, bisa jadi cuma belum ke-input
// ke sistem) - ini BLOKIR TOTAL, karena datanya JELAS ada & PASTI gak cukup. Return true/false -
// dipakai gate di itemBaruValid() (dicek ULANG dari nol tiap mau nambah ke antrian, gak
// mengandalkan warning yang sempat/belum sempat muncul di layar). kgInput opsional - kalau gak
// dikasih (mis. dipanggil dari alur lama), cuma cek "ketemu/enggak" kayak sebelumnya.
function cekKodeRollTakDikenal_(warna, kodeInput, warnEl, kgInput) {
  if (!warnEl) return true;
  const kode = String(kodeInput || '').trim();
  if (!kode || !warna) { warnEl.style.display = 'none'; warnEl.textContent = ''; return true; }
  const roll = daftarRollUntukWarna(warna).find(function (r) { return String(r.kodeRoll || '').toUpperCase() === kode.toUpperCase(); });
  if (!roll) {
    warnEl.style.display = 'block';
    warnEl.textContent = '⚠️ Kode roll "' + kode + '" gak ketemu di database buat warna ' + warna + ' - cek ulang, atau pilih dari daftar saran.';
    return true;
  }
  const kg = parseFloat(kgInput);
  if (!isNaN(kg) && kg > 0 && kg > roll.kg) {
    warnEl.style.display = 'block';
    warnEl.textContent = '⛔ Roll "' + kode + '" cuma tersisa ' + roll.kg.toFixed(2) + 'kg, gak cukup buat ' + kg.toFixed(2) + 'kg yang diminta - gak bisa ditambah ke antrian.';
    return false;
  }
  warnEl.style.display = 'none';
  warnEl.textContent = '';
  return true;
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    setTimeout(function () { __scrollKeVisible(__elemJagaTerlihat); }, 60);
  });
}

// ------------------------------------------------------------
// STATE
// ------------------------------------------------------------
let kategoriVarianData = [];   // dari /data/kategori-varian
let kombinasiWarnaData = [];   // dari /data/kombinasi-warna
let stokRollData = {};         // dari /data/stok-roll : { WARNA_KANONIK: [{kodeRoll, kg}] }
let warnaKanonikMap = {};      // dari /data/warna-kanonik
let standarPemakaianData = []; // dari /data/standar-pemakaian

let kategoriAktif = 'Anak';
let itemBaru = kosongkanItemBaru();
let daftarAntrian = [];
let antrianSeq = 0;
let ukuranLainTerbuka = false;
let openDropdown = null; // 'varian' | 'warna' | 'kodeRoll' | 'kombinasiWarna' | 'roll-<idx>' | null

function kosongkanItemBaru() {
  return {
    kategori: kategoriAktif,
    varianLabel: null,
    kodeItem: null,
    isKombinasi: false,
    isCustom: false,
    namaCustom: '',
    warna: null,
    kg: '',
    kgSumber: null, // 'Pakai Habis' | 'Estimasi' | null (manual) - buat keterangan asal angka kg
    estimasi: false,
    pakaiHabis: false,
    kodeRoll: null,
    kombinasi: null, // { warna: [...], kg: [...], kodeRoll: [...], kgSumber: [...] }
    ukuran: {}
  };
}

// ------------------------------------------------------------
// AMBIL DATA REFERENSI
// ------------------------------------------------------------
// v.05: 4 data referensi (kategori varian, kombinasi warna, kamus warna, standar pemakaian)
// JARANG berubah - dicache di HP (localStorage, 30 menit) biar app langsung kepake TANPA nunggu
// network sama sekali, sambil data terbaru ditarik diam-diam di belakang buat sesi BERIKUTNYA.
// stok-roll SENGAJA TETAP selalu fresh tiap buka (jangan sampai salah cocok stok gara-gara data
// lama) - itu-satunya yang bikin app nunggu network beneran. Alasan: Supabase-nya di region
// Mumbai, jauh dari Indonesia - tiap round-trip kerasa, jadi yang bisa dihindari dihindari.
const CACHE_REFDATA_KEY_ = 'produksi_refdata_cache_v1';
const CACHE_REFDATA_MAX_AGE_MS_ = 30 * 60 * 1000;

function ambilCacheRefData_() {
  try {
    const raw = localStorage.getItem(CACHE_REFDATA_KEY_);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.waktu || (Date.now() - parsed.waktu) > CACHE_REFDATA_MAX_AGE_MS_) return null;
    return parsed.data;
  } catch (e) {
    return null;
  }
}
function simpanCacheRefData_(data) {
  try {
    localStorage.setItem(CACHE_REFDATA_KEY_, JSON.stringify({ waktu: Date.now(), data: data }));
  } catch (e) {
    // storage penuh/disabled - gak fatal, cuma sesi berikutnya gak dapet cache
  }
}

// v.12: auto-retry SEKALI kalau gagal di percobaan pertama - Promise.all di bawah nembak 5
// request PARALEL ke Worker yang sama, jadi peluang minimal 1 dari 5 gagal/timeout pas Worker
// baru "bangun" dari idle lebih besar dibanding 1 request tunggal. Sebelumnya kalau ini gagal
// dan belum ada cache sama sekali (buka pertama kali), layar produksi jadi kosong sampai Denny
// tap Refresh manual - sekarang dicoba ulang otomatis sekali dulu sebelum nyerah.
function muatDataReferensi(percobaan) {
  percobaan = percobaan || 0;
  const cache = ambilCacheRefData_();
  if (cache) {
    kategoriVarianData = cache.kategoriVarianData || [];
    kombinasiWarnaData = cache.kombinasiWarnaData || [];
    warnaKanonikMap = cache.warnaKanonikMap || {};
    standarPemakaianData = cache.standarPemakaianData || [];
    renderDetailCard();
    renderQtyGrid();
  }

  Promise.all([
    fetch(WORKER_URL + '/data/kategori-varian').then(function (r) { return r.json(); }),
    fetch(WORKER_URL + '/data/kombinasi-warna').then(function (r) { return r.json(); }),
    fetch(WORKER_URL + '/data/stok-roll').then(function (r) { return r.json(); }),
    fetch(WORKER_URL + '/data/warna-kanonik').then(function (r) { return r.json(); }),
    fetch(WORKER_URL + '/data/standar-pemakaian').then(function (r) { return r.json(); })
  ]).then(function (hasil) {
    kategoriVarianData = hasil[0] || [];
    kombinasiWarnaData = hasil[1] || [];
    stokRollData = hasil[2] || {}; // SENGAJA gak ikut dicache - harus selalu data terbaru
    warnaKanonikMap = hasil[3] || {};
    standarPemakaianData = hasil[4] || [];
    simpanCacheRefData_({
      kategoriVarianData: kategoriVarianData,
      kombinasiWarnaData: kombinasiWarnaData,
      warnaKanonikMap: warnaKanonikMap,
      standarPemakaianData: standarPemakaianData
    });
    renderDetailCard();
    renderQtyGrid();
  }).catch(function (err) {
    if (percobaan < 1) { setTimeout(function () { muatDataReferensi(percobaan + 1); }, 1500); return; }
    if (!cache) tampilkanToast('Gagal memuat data referensi: ' + err.message);
  });
}

// ------------------------------------------------------------
// KATEGORI TOGGLE
// ------------------------------------------------------------
document.querySelectorAll('.kat-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.kat-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    kategoriAktif = btn.dataset.kat;
    document.body.classList.toggle('mode-dewasa', kategoriAktif === 'Dewasa'); // v.09
    itemBaru = kosongkanItemBaru();
    openDropdown = null;
    renderDetailCard();
    renderQtyGrid();
  });
});

document.getElementById('btnRefresh').addEventListener('click', function () {
  tampilkanToast('Memuat ulang data...');
  muatDataReferensi();
});

// ------------------------------------------------------------
// HELPER VARIAN
// ------------------------------------------------------------
function daftarVarianUntukKategori() {
  return kategoriVarianData.filter(function (v) { return String(v.kategori).toLowerCase() === kategoriAktif.toLowerCase(); });
}
function isVarianKombinasi(label) {
  return String(label || '').toUpperCase().indexOf('KOMBINASI') !== -1;
}
function isVarianRinger(label) {
  return String(label || '').toUpperCase().indexOf('RINGER') !== -1;
}

// Porting PERSIS dari bikinAwalan_() (HTML PRODUKSI.html lama)
function bikinAwalanPreview(kategori, kodeItem) {
  const kodeUpper = kodeItem ? String(kodeItem).toUpperCase() : '';
  const butuhKataAnak = String(kategori || '').toLowerCase() === 'anak' && (kodeUpper === '' || kodeUpper === 'PJG');
  if (butuhKataAnak) return kodeUpper ? ('ANAK ' + kodeUpper) : 'ANAK';
  return kodeUpper;
}

function getSinonimGrup(warna) {
  const w = String(warna || '').toUpperCase();
  const kan = warnaKanonikMap[w] || w;
  return kan;
}

function daftarRollUntukWarna(warna) {
  const kanonik = getSinonimGrup(warna);
  return stokRollData[kanonik] || [];
}

// v.06: daftar warna buat autosuggest HARUS tetap muncul walau stoknya lagi kosong (kg_sisa=0
// atau memang belum pernah dibeli dengan ejaan itu) - gak boleh cuma dari stokRollData (yang
// isinya cuma warna yang KEBETULAN masih ada rollnya). Gabung sama semua nama kanonik yang
// dikenal sistem (dari KAMUS SINONIM WARNA) - biar tim potong tetap kelihatan saran nama warna
// meski rollnya kosong, baru nanti kotak Kode Roll yang kasih tau "- / kg" kalau gak ada.
// v.07 (revert v.06): SEBELUMNYA sempat digabung sama semua nama kanonik di KAMUS SINONIM
// WARNA - ternyata itu salah diagnosis (dikira warna kosong-stok gak muncul saran, padahal itu
// murni cache lama yang belum ke-refresh). Gabungan itu malah bikin bug baru: entri kanonik
// "generik" tanpa stok beneran (misal "VIOLET" doang) ikut nongol bersaingan sama entri stok
// asli yang lebih spesifik ("VIOLET 30S" - itu jenis kain beda, BUKAN sinonim). Balik ke
// stokRollData polos - itu udah otomatis mencakup SEMUA warna yang beneran ada stoknya
// (termasuk yang kode roll-nya kosong/null, asal kg_sisa masih > 0).
function daftarSemuaWarnaDikenal_() {
  return Object.keys(stokRollData).sort();
}

// v.25: buat fitur checkbox "Pakai habis" - cari kg_sisa persis buat 1 kode roll yang lagi
// kepilih (bukan seluruh daftar), dipakai buat auto-isi Kg Kain Terpakai. null kalau warna/roll
// belum lengkap kepilih atau kodenya gak ketemu di daftar stok.
function cariKgRollTerpilih_(warna, kodeRoll) {
  if (!warna || !kodeRoll) return null;
  const semua = daftarRollUntukWarna(warna);
  const cocok = semua.find(function (r) { return String(r.kodeRoll || '') === String(kodeRoll); });
  return cocok ? cocok.kg : null;
}

// ------------------------------------------------------------
// AUTOCOMPLETE - filter di memori (data sudah ke-load duluan), jadi instan tanpa
// nembak server tiap ketik. Cuma update <div> saran-nya doang (bukan render ulang
// seluruh kartu), supaya fokus/kursor di kotak ketik gak keganggu/reset.
// ------------------------------------------------------------
function renderWarnaSuggestions(query) {
  const box = document.getElementById('warnaSuggestions');
  if (!box) return;
  const q = String(query || '').trim().toUpperCase();
  if (!q) { box.innerHTML = ''; return; } // v.02: gak tampilin apa-apa sebelum ada huruf diketik
  const semua = daftarSemuaWarnaDikenal_();
  const cocok = semua.filter(function (w) { return w.indexOf(q) === 0; });
  box.innerHTML = cocok.slice(0, 8).map(function (w) {
    return '<div class="suggestion-item" data-pick-warna="' + escapeAttr(w) + '">' + escapeHtml(w) + '</div>';
  }).join('');
  if (box.children.length) jagaTerlihat(box);
  box.querySelectorAll('[data-pick-warna]').forEach(function (el) {
    el.addEventListener('mousedown', function (e) {
      e.preventDefault(); // supaya kepilih SEBELUM event blur nutup daftar saran
      itemBaru.warna = el.dataset.pickWarna;
      itemBaru.kodeRoll = null;
      const inputWarna = document.getElementById('inputWarna');
      const inputRoll = document.getElementById('inputKodeRoll');
      if (inputWarna) inputWarna.value = itemBaru.warna;
      if (inputRoll) inputRoll.value = '';
      box.innerHTML = '';
      renderRollSuggestions('');
      const rollBox = document.getElementById('rollSuggestions');
      if (rollBox && rollBox.children.length) jagaTerlihat(rollBox);
    });
  });
}

function renderRollSuggestions(query) {
  const box = document.getElementById('rollSuggestions');
  if (!box) return;
  const q = String(query || '').trim().toUpperCase();
  const semua = daftarRollUntukWarna(itemBaru.warna);
  // v.03: begitu warna udah kepilih, langsung tampilin SEMUA roll yang ada buat warna itu
  // (gak perlu ketik dulu) - beda dari saran Warna yang emang sengaja nunggu ketikan.
  const cocok = q ? semua.filter(function (r) { return String(r.kodeRoll).toUpperCase().indexOf(q) === 0; }) : semua;
  if (cocok.length) {
    box.innerHTML = cocok.map(function (r) {
      return '<div class="suggestion-item roll-suggestion" data-pick-roll="' + escapeAttr(r.kodeRoll || '') + '" data-kg="' + r.kg + '">Roll ' + escapeHtml(r.kodeRoll || '-') + ' / ' + r.kg + 'kg</div>';
    }).join('');
  } else if (!q && itemBaru.warna) {
    // v.06: warna udah kepilih tapi gak ada roll tersisa buat warna itu - kasih tau jelas
    // (bukan diam2 kosong), biar tim potong tau ini beneran gak ada, bukan lagi loading/nyari.
    box.innerHTML = '<div class="suggestion-item roll-suggestion" style="color:var(--gray-label);cursor:default;">- / kg (belum ada roll tercatat buat warna ini)</div>';
  } else {
    box.innerHTML = '';
  }
  if (box.children.length) jagaTerlihat(box);
  box.querySelectorAll('[data-pick-roll]').forEach(function (el) {
    el.addEventListener('mousedown', function (e) {
      e.preventDefault();
      itemBaru.kodeRoll = el.dataset.pickRoll || null;
      const inputRoll = document.getElementById('inputKodeRoll');
      // v.03: tampilin format lengkap "Roll <kode> / <kg>kg" di kotaknya sendiri (bukan cuma
      // kodenya doang) - biar tim potong gampang nyontek angka kg-nya tanpa buka daftar lagi.
      if (inputRoll) inputRoll.value = 'Roll ' + (itemBaru.kodeRoll || '-') + ' / ' + el.dataset.kg + 'kg';
      box.innerHTML = '';
      // v.25: kalau checkbox Pakai Habis lagi aktif, kg langsung ikut roll yang BARU dipilih ini
      // (dataset.kg udah ada di sini, gak perlu lookup ulang) - biar konsisten kalau roll diganti.
      if (itemBaru.pakaiHabis) {
        itemBaru.kg = String(el.dataset.kg);
        const inputKg = document.getElementById('inputKg');
        if (inputKg) { inputKg.value = itemBaru.kg; cekKgLebih99(inputKg, document.getElementById('kgWarningInfo')); }
      }
      // v.33: kepilih dari saran = kode-nya PASTI ketemu (gak mungkin lagi "gak dikenal"), tapi
      // v.35: TETAP perlu cek kecukupan kg (dicek TERAKHIR, setelah kg ikut ke-update di atas
      // kalau Pakai Habis aktif) - roll-nya valid, tapi kalau kg yang udah diketik duluan lebih
      // besar dari kg roll ini, harus tetap ke-blokir (request Denny).
      cekKodeRollTakDikenal_(itemBaru.warna, itemBaru.kodeRoll, document.getElementById('rollWarningInfo'), itemBaru.kg);
    });
  });
}

    '<span class="flabel">Varian</span>' +
    '<span class="fvalue' + (varianTampil ? ' filled' : '') + '">' + (varianTampil || '— pilih —') + ' <span class="chevron">▾</span></span>' +
    '</div>';
  if (openDropdown === 'varian') {
    html += '<div class="dropdown-list">';
    daftarVarianUntukKategori().forEach(function (v) {
      html += '<div class="dropdown-item" data-varian="' + escapeAttr(v.label_varian) + '" data-kode="' + escapeAttr(v.prefix_tele || '') + '">' + escapeHtml(v.label_varian) + '</div>';

      html += renderWarnaRingerSection();
    } else {
      html += '<div class="field-row wrap" id="rowWarna">' +
        '<div class="frow-line"><span class="flabel">Warna</span>' +
        '<input type="text" id="inputWarna" placeholder="— pilih warna —" autocomplete="off" value="' + escapeAttr(itemBaru.warna || '') + '"></div>' +
        '<div class="suggestion-list" id="warnaSuggestions"></div>' +
        '</div>';

      // --- Kg Kain Terpakai (single, non kombinasi) ---
      html += '<div class="field-row wrap" id="rowKg">' +
        '<div class="frow-line"><span class="flabel">Kg Kain Terpakai</span>' +
        '<input type="number" id="inputKg" placeholder="' + (itemBaru.estimasi ? 'Otomatis' : '0') + '" value="' + (itemBaru.kg || '') + '"' + ((itemBaru.pakaiHabis || itemBaru.estimasi) ? ' readonly' : '') + '></div>' +
        '<div class="kg-warning-text" id="kgWarningInfo" style="display:none;"></div>' +
        // v.25: checkbox "Pakai habis" - dicentang -> Kg Kain Terpakai otomatis diisi dari sisa
        // stok (kg_sisa) kode roll yang lagi kepilih, gak perlu ngetik manual. Field-nya jadi
        // readonly selama dicentang (biar gak konflik sama angka yang diisi otomatis) - uncentang
        // buat balik isi manual.
        '<label class="chk-sub"><input type="checkbox" id="chkPakaiHabis" ' + (itemBaru.pakaiHabis ? 'checked' : '') + '> Pakai habis</label>' +
        '<label class="chk-sub"><input type="checkbox" id="chkEstimasi" ' + (itemBaru.estimasi ? 'checked' : '') + '> Pakai Estimasi</label>' +
        '</div>';

      // --- Kode Roll ---
      html += '<div class="field-row wrap" id="rowKodeRoll">' +
        '<div class="frow-line"><span class="flabel">Kode Roll <span class="badge-wajib">wajib isi</span></span>' +
        '<input type="text" id="inputKodeRoll" placeholder="Ketik / pilih kode roll" autocomplete="off" value="' + escapeAttr(itemBaru.kodeRoll || '') + '"></div>' +
        '<div class="kg-warning-text" id="rollWarningInfo" style="display:none;"></div>' +

        '</div>';
    }
  } else {
    // --- Item Custom: nama bebas + warna 1 (opsional) + kg 1 + roll 1, bisa tambah warna ke-2
    // buat produk kombinasi 2 warna bahan. Warna dipisah eksplisit (bukan ditebak dari nama
    // custom yang bebas format) supaya potong stok akurat - pakai struktur `kombinasi` yang
    // sama dengan mode Kombinasi biasa, cuma warnanya bebas ketik (autocomplete dari stok yang
    // ada), bukan pilih dari daftar kombinasi tetap.

    if (!itemBaru.kombinasi) itemBaru.kombinasi = { warna: [''], kg: [''], kgSumber: [null], kodeRoll: [null] };
    itemBaru.kombinasi.warna.forEach(function (warna, i) {

      html += '<div class="ganti-kombinasi"><a id="tambahWarna2Custom">+ Tambah warna ke-2 (kombinasi)</a></div>';
    }
  }

  card.innerHTML = html;
  pasangEventDetailCard();
  const ddl = card.querySelector('.dropdown-list');
  if (ddl) jagaTerlihat(ddl);
}

function pasangEventDetailCard() {
  const rowVarian = document.getElementById('rowVarian');
  if (rowVarian) rowVarian.addEventListener('click', function () { openDropdown = (openDropdown === 'varian') ? null : 'varian'; renderDetailCard(); });

  document.querySelectorAll('[data-varian]').forEach(function (el) {
    el.addEventListener('click', function () {
      const label = el.dataset.varian;
      if (label === '__CUSTOM__') {
        itemBaru = kosongkanItemBaru();
        itemBaru.isCustom = true;
      } else {
        itemBaru = kosongkanItemBaru();
        itemBaru.varianLabel = label;
        itemBaru.kodeItem = el.dataset.kode || '';
        itemBaru.isKombinasi = isVarianKombinasi(label);
      }
      openDropdown = null;
      renderDetailCard();
      // v.29: renderQtyGrid() SEBELUMNYA gak kepanggil di sini - itemBaru.ukuran udah kereset
      // kosong (lihat kosongkanItemBaru() di atas), tapi kotak-kotak Qty per Size (beda region
      // DOM dari #cardDetail yang di-refresh renderDetailCard) gak ikut digambar ulang, jadi
      // angka yang udah keketik (mis. "12") keliatan masih nempel walau datanya sebenarnya udah
      // kosong. Ditemukan Denny lewat testing (ganti varian, angka lama masih tampil).
      renderQtyGrid();
      updateBottomBar();
    });
  });

  const inputWarna = document.getElementById('inputWarna');
  if (inputWarna) {
    inputWarna.addEventListener('input', function () {
      itemBaru.warna = inputWarna.value.toUpperCase();
      itemBaru.kodeRoll = null;
      const inputRoll = document.getElementById('inputKodeRoll');
      if (inputRoll) inputRoll.value = '';
      // v.33: warna ganti -> kode roll lama ikut kereset, jadi peringatan "gak ketemu" yang
      // nempel dari ketikan sebelumnya juga harus ilang (bukan nyangkut nunjuk warna yang salah).
      const rollWarnInfo = document.getElementById('rollWarningInfo');
      if (rollWarnInfo) { rollWarnInfo.style.display = 'none'; rollWarnInfo.textContent = ''; }
      // v.25: warna ganti -> roll lama gak relevan lagi, kalau Pakai Habis aktif kosongin kg
      // dulu (nunggu roll baru dipilih) daripada nampilin angka kg roll warna SEBELUMNYA.
      if (itemBaru.pakaiHabis) {
        itemBaru.kg = '';
        const inputKg = document.getElementById('inputKg');
        if (inputKg) inputKg.value = '';
      }
      renderWarnaSuggestions(inputWarna.value);
      renderRollSuggestions('');
    });
    inputWarna.addEventListener('focus', function () { renderWarnaSuggestions(inputWarna.value); });
    inputWarna.addEventListener('blur', function () { setTimeout(function () { const b = document.getElementById('warnaSuggestions'); if (b) b.innerHTML = ''; }, 150); });
  }

  const inputKg = document.getElementById('inputKg');
  if (inputKg) {
    const cekKg = function () {
      cekKgLebih99(inputKg, document.getElementById('kgWarningInfo'));
      // v.35: kg berubah -> kecukupan roll yang udah keisi juga harus ke-recheck ulang (request
      // Denny) - kalau cuma ngandelin cek pas blur kode roll, kg yang diketik BELAKANGAN gak

    el.addEventListener('blur', function () {

  const inputNamaCustom = document.getElementById('inputNamaCustom');

  document.querySelectorAll('[data-cwidx]').forEach(function (el) {
    const idx = parseInt(el.dataset.cwidx, 10);
    el.addEventListener('input', function () {
      itemBaru.kombinasi.warna[idx] = el.value.toUpperCase();
      itemBaru.kombinasi.kodeRoll[idx] = null;
      renderCustomWarnaSuggestions(idx, el.value);

      const crollWarn = document.getElementById('crollWarning-' + idx);

    });
    el.addEventListener('focus', function () { renderCustomWarnaSuggestions(idx, el.value); });
    el.addEventListener('blur', function () { setTimeout(function () { const b = document.getElementById('customWarnaSuggestions-' + idx); if (b) b.innerHTML = ''; }, 150); });
  });
  document.querySelectorAll('[data-ckgidx]').forEach(function (el) {
    const idx = parseInt(el.dataset.ckgidx, 10);
    const warn = document.getElementById('ckgWarning-' + idx);
    el.addEventListener('input', function () {
      itemBaru.kombinasi.kg[idx] = el.value;
      cekKgLebih99(el, warn);
      // v.35: kg slot ini berubah -> kecukupan roll di slot yang sama ikut ke-recheck (request Denny).
      cekKodeRollTakDikenal_(itemBaru.kombinasi.warna[idx], itemBaru.kombinasi.kodeRoll[idx], document.getElementById('crollWarning-' + idx), itemBaru.kombinasi.kg[idx]);

    cekKgLebih99(el, warn);

  document.querySelectorAll('[data-crollidx]').forEach(function (el) {
    const idx = parseInt(el.dataset.crollidx, 10);

    el.addEventListener('focus', function () { el.select(); renderCustomRollSuggestions(idx, el.value); });
    // v.33: sama pola kayak mode item biasa - cek pas blur (request Denny).
    el.addEventListener('blur', function () {

      setTimeout(function () { const b = document.getElementById('customRollSuggestions-' + idx); if (b) b.innerHTML = ''; }, 150);
    });
    cekKodeRollTakDikenal_(itemBaru.kombinasi.warna[idx], itemBaru.kombinasi.kodeRoll[idx], crollWarn, itemBaru.kombinasi.kg[idx]);

// v.16: autocomplete warna utk item custom (per slot idx) - sumbernya sama kayak warna biasa
// (nama warna yang sudah ada stoknya), beda dari kombinasi biasa yang milih dari daftar
// kombinasi TETAP - di sini bebas ketik nama warna apa saja.
function renderCustomWarnaSuggestions(idx, query) {
  const box = document.getElementById('customWarnaSuggestions-' + idx);
  if (!box) return;
  const q = String(query || '').trim().toUpperCase();
  if (!q) { box.innerHTML = ''; return; }
  const semua = daftarSemuaWarnaDikenal_();
  const cocok = semua.filter(function (w) { return w.indexOf(q) === 0; });
  box.innerHTML = cocok.slice(0, 8).map(function (w) {
    return '<div class="suggestion-item" data-pick-cwarna="' + escapeAttr(w) + '" data-idx="' + idx + '">' + escapeHtml(w) + '</div>';
  }).join('');
  if (box.children.length) jagaTerlihat(box);
  box.querySelectorAll('[data-pick-cwarna]').forEach(function (el) {
    el.addEventListener('mousedown', function (e) {
      e.preventDefault();
      const i = parseInt(el.dataset.idx, 10);
      itemBaru.kombinasi.warna[i] = el.dataset.pickCwarna;
      itemBaru.kombinasi.kodeRoll[i] = null;
      renderDetailCard();
    });
  });
}
function renderCustomRollSuggestions(idx, query) {
  const box = document.getElementById('customRollSuggestions-' + idx);
  if (!box) return;
  const q = String(query || '').trim().toUpperCase();
  const warna = itemBaru.kombinasi.warna[idx];
  const semua = daftarRollUntukWarna(warna);
  const cocok = q ? semua.filter(function (r) { return String(r.kodeRoll).toUpperCase().indexOf(q) === 0; }) : semua;
  if (cocok.length) {
    box.innerHTML = cocok.map(function (r) {
      return '<div class="suggestion-item roll-suggestion" data-pick-croll="' + escapeAttr(r.kodeRoll || '') + '" data-kg="' + r.kg + '" data-idx="' + idx + '">Roll ' + escapeHtml(r.kodeRoll || '-') + ' / ' + r.kg + 'kg</div>';
    }).join('');
  } else if (!q && warna) {
    box.innerHTML = '<div class="suggestion-item roll-suggestion" style="color:var(--gray-label);cursor:default;">- / kg (belum ada roll tercatat buat warna ini)</div>';
  } else {
    box.innerHTML = '';
  }
  if (box.children.length) jagaTerlihat(box);
  box.querySelectorAll('[data-pick-croll]').forEach(function (el) {
    el.addEventListener('mousedown', function (e) {
      e.preventDefault();
      const i = parseInt(el.dataset.idx, 10);
      itemBaru.kombinasi.kodeRoll[i] = el.dataset.pickCroll || null;
      // v.11: tampilin lagi format lengkap "Roll <kode> / <kg>kg" (request Denny - infonya
      // emang harus tetap kelihatan, bukan cuma kodenya doang). Set langsung via .value (BUKAN
      // renderDetailCard()) - manggil render ulang sempat bikin bug baru: box saran ke-refresh
      // lagi gara-gara event focus ke-trigger ulang di input yang baru dibuat.
      const inputEl = document.querySelector('.roll-mini-input-custom[data-crollidx="' + i + '"]');
      if (inputEl) inputEl.value = 'Roll ' + (itemBaru.kombinasi.kodeRoll[i] || '-') + ' / ' + el.dataset.kg + 'kg';
      box.innerHTML = '';
      // v.35: kepilih dari saran = kode-nya PASTI ketemu, tapi tetap cek kecukupan kg yang udah
      // diketik duluan (request Denny) - sama pola kayak mode biasa/kombinasi.
      cekKodeRollTakDikenal_(itemBaru.kombinasi.warna[i], itemBaru.kombinasi.kodeRoll[i], document.getElementById('crollWarning-' + i), itemBaru.kombinasi.kg[i]);
    });
  });
}

function renderKombiRollSuggestions(idx, query) {
  const box = document.getElementById('kombiRollSuggestions-' + idx);
  if (!box) return;
  const q = String(query || '').trim().toUpperCase();
  const warna = itemBaru.kombinasi.warna[idx];
  const semua = daftarRollUntukWarna(warna);
  const cocok = q ? semua.filter(function (r) { return String(r.kodeRoll).toUpperCase().indexOf(q) === 0; }) : semua;
  if (cocok.length) {
    box.innerHTML = cocok.map(function (r) {
      return '<div class="suggestion-item roll-suggestion" data-pick-kombi-roll="' + escapeAttr(r.kodeRoll || '') + '" data-kg="' + r.kg + '">Roll ' + escapeHtml(r.kodeRoll || '-') + ' / ' + r.kg + 'kg</div>';
    }).join('');
  } else if (!q && warna) {
    box.innerHTML = '<div class="suggestion-item roll-suggestion" style="color:var(--gray-label);cursor:default;">- / kg (belum ada roll tercatat buat warna ini)</div>';

      // emang harus tetap kelihatan, bukan cuma kodenya doang). Set langsung via .value (BUKAN
      // renderDetailCard()) - manggil render ulang sempat bikin bug baru: box saran ke-refresh
      // lagi gara-gara event focus ke-trigger ulang di input yang baru dibuat. Lebar kolomnya
      // sendiri dibenerin lewat CSS (kg-mini dikecilin), bukan lewat motong info yang tampil.
      itemBaru.kombinasi.kodeRoll[idx] = el.dataset.pickKombiRoll || null;
      const inputEl = document.querySelector('.roll-mini-input[data-kidx="' + idx + '"]');
      if (inputEl) inputEl.value = 'Roll ' + (itemBaru.kombinasi.kodeRoll[idx] || '-') + ' / ' + el.dataset.kg + 'kg';
      box.innerHTML = '';
      // v.26: slot warna pertama + checkbox Pakai Habis aktif -> kg ikut roll BARU yang dipilih
      if (idx === 0 && itemBaru.kombinasi.pakaiHabis0) {
        itemBaru.kombinasi.kg[0] = String(el.dataset.kg);
        const kgInput0 = document.querySelector('.kg-mini[data-kidx="0"]');
        if (kgInput0) { kgInput0.value = itemBaru.kombinasi.kg[0]; cekKgLebih99(kgInput0, document.getElementById('kgWarning-0')); }
      }
      // v.35: cek kecukupan TERAKHIR (setelah kg ikut ke-update di atas kalau Pakai Habis aktif)
      // - roll-nya valid, tapi kg yang udah diketik duluan bisa aja masih lebih besar (request Denny).
      cekKodeRollTakDikenal_(itemBaru.kombinasi.warna[idx], itemBaru.kombinasi.kodeRoll[idx], document.getElementById('rollWarning-' + idx), itemBaru.kombinasi.kg[idx]);
    });
  });
}

// ------------------------------------------------------------
function renderQtyGrid() {
  const gridUtama = document.getElementById('qtyGridUtama');
  const gridLain = document.getElementById('qtyGridLain');
  gridUtama.innerHTML = DAFTAR_UKURAN_UTAMA.map(qtyCellHtml).join('');
  gridLain.innerHTML = DAFTAR_UKURAN_LAIN.map(qtyCellHtml).join('');
  document.querySelectorAll('.qty-grid input').forEach(function (el) {
    el.addEventListener('input', function () {
      const u = el.dataset.ukuran;
      const v = parseInt(el.value, 10) || 0;
      if (v > 0) itemBaru.ukuran[u] = v; else delete itemBaru.ukuran[u];
      hitungTotalQty();
      updateBottomBar();
    });
  });
}
function qtyCellHtml(u) {
  return '<div class="qty-cell"><label>' + u + '</label><input type="number" min="0" data-ukuran="' + u + '" value="' + (itemBaru.ukuran[u] || '') + '"></div>';
}
document.getElementById('toggleUkuranLain').addEventListener('click', function () {
  ukuranLainTerbuka = !ukuranLainTerbuka;
  document.getElementById('qtyGridLain').style.display = ukuranLainTerbuka ? 'grid' : 'none';
});
function hitungTotalQty() {
  const total = Object.keys(itemBaru.ukuran).reduce(function (s, k) { return s + itemBaru.ukuran[k]; }, 0);
  document.getElementById('totalQtyItem').textContent = total + ' pcs';
}

// ------------------------------------------------------------
// ESTIMASI PEMAKAIAN KAIN (dari standar_pemakaian, dipakai checkbox
// "Pakai Estimasi") - lookup kategori+varian(+posisi buat kombinasi),
// jumlahkan qty tiap ukuran x kg_per_pcs_<ukuran> standarnya.
// v.30: parameter posisi ditambahkan (opsional) - item TUNGGAL manggil tanpa posisi (match baris
// standar yang posisi-nya NULL, perilaku SAMA PERSIS kayak sebelumnya). Item KOMBINASI (mis.
// Trico: badan + tangan kanan + tangan kiri, request Denny) manggil dengan posisi 'badan' atau
// 'tangan' - 2 baris terpisah per varian di standar_pemakaian, "tangan" dipakai buat kanan
// MAUPUN kiri (angkanya sama, simetris).
// ------------------------------------------------------------
function cariStandarPemakaian_(kategori, varianLabel, posisi) {
  return standarPemakaianData.find(function (s) {
    return String(s.kategori).toLowerCase() === String(kategori).toLowerCase() &&
      String(s.varian).toLowerCase() === String(varianLabel).toLowerCase() &&
      (posisi ? String(s.posisi || '').toLowerCase() === String(posisi).toLowerCase() : !s.posisi);
  }) || null;
}
function hitungKgEstimasi_(it, posisi) {
  const standar = cariStandarPemakaian_(it.kategori, it.varianLabel, posisi);
  const labelPosisi = posisi ? ' posisi "' + posisi + '"' : '';
  if (!standar) return { ok: false, error: 'Standar pemakaian buat varian "' + it.varianLabel + '"' + labelPosisi + ' belum ada datanya.' };
  let total = 0;
  for (const u in it.ukuran) {
    const qty = it.ukuran[u];
    if (!qty) continue;
    const kgPerPcs = standar['kg_per_pcs_' + u.toLowerCase()];
    if (kgPerPcs === null || kgPerPcs === undefined) {
      return { ok: false, error: 'Standar pemakaian ukuran ' + u + labelPosisi + ' belum ada, isi kg manual dulu.' };
    }
    total += qty * parseFloat(kgPerPcs);
  }
  return { ok: true, kg: total };
}

// ------------------------------------------------------------
// TAMBAH KE DAFTAR / QUEUE
// ------------------------------------------------------------
// v.35 (request Denny): gerbang FINAL - re-cek kecukupan SEMUA kode roll yang keisi (fresh dari
// state itemBaru, gak ngandelin warning yang sempat/belum sempat muncul di layar - jaga2 kalau
// user gak sempat blur/ganti field tapi langsung mencet Tambah) sebelum boleh nambah ke antrian.
// Efek samping: ikut munculin/nutup pesan peringatan di layar (via cekKodeRollTakDikenal_), biar
// begitu ke-blokir, user langsung lihat kenapa - bukan cuma toast generik.
function semuaRollCukup_() {
  if (itemBaru.isCustom || itemBaru.isKombinasi || (itemBaru.varianLabel && isVarianRinger(itemBaru.varianLabel))) {
    if (!itemBaru.kombinasi) return true;
    const idElWarn = itemBaru.isCustom ? 'crollWarning-' : 'rollWarning-';
    return itemBaru.kombinasi.warna.every(function (w, i) {
      return cekKodeRollTakDikenal_(w, itemBaru.kombinasi.kodeRoll[i], document.getElementById(idElWarn + i), itemBaru.kombinasi.kg[i]);
    });
  }
  return cekKodeRollTakDikenal_(itemBaru.warna, itemBaru.kodeRoll, document.getElementById('rollWarningInfo'), itemBaru.kg);
}

function itemBaruValid() {
  const totalQty = Object.keys(itemBaru.ukuran).reduce(function (s, k) { return s + itemBaru.ukuran[k]; }, 0);
  if (totalQty <= 0) return false;
  if (itemBaru.isCustom) {
    if (!itemBaru.namaCustom.trim()) return false;
    if (itemBaru.kombinasi) {
      for (let i = 0; i < itemBaru.kombinasi.warna.length; i++) {
        // kg diisi tapi warna kosong = gak jelas mau motong stok warna apa
        if (itemBaru.kombinasi.kg[i] && !itemBaru.kombinasi.warna[i]) return false;
        // warna ke-2 (kombinasi) WAJIB ada kg-nya, beda dari warna 1 yang boleh kosong semua
        if (i === 1 && itemBaru.kombinasi.warna[i] && !itemBaru.kombinasi.kg[i]) return false;
      }
    }
    return semuaRollCukup_();
  }
  if (itemBaru.isKombinasi || (itemBaru.varianLabel && isVarianRinger(itemBaru.varianLabel))) {
    if (!itemBaru.kombinasi) return false;
    // v.31: "Pakai Estimasi" sekarang per-slot (independen per kolom warna) - slot yang
    // estimasinya aktif boleh kg kosong (baru dihitung pas Tambah dipencet), slot lain tetap
    // wajib diisi manual. Warna tetap wajib ada di semua slot.
    const isiLengkap = itemBaru.kombinasi.warna.every(function (w, i) {
      const estSlot = itemBaru.kombinasi.estimasiSlot && itemBaru.kombinasi.estimasiSlot[i];
      return w && (estSlot || itemBaru.kombinasi.kg[i]);
    });
    return isiLengkap && semuaRollCukup_();
  }
  // v.31: Kg Kain Terpakai sekarang WAJIB keisi lewat salah satu cara - manual, "Pakai habis",
  // atau "Pakai Estimasi" (request Denny, sebelumnya boleh kosong sama sekali).
  const isiLengkap = !!itemBaru.varianLabel && !!itemBaru.warna && (!!itemBaru.kg || itemBaru.pakaiHabis || itemBaru.estimasi);
  return isiLengkap && semuaRollCukup_();
}

function updateBottomBar() {
  const btnTambah = document.getElementById('btnTambah');
  btnTambah.disabled = false; // tetap boleh dicoba, validasi muncul via toast
}

document.getElementById('btnTambah').addEventListener('click', function () {
  if (!itemBaruValid()) {
    tampilkanToast('Lengkapi dulu detail item, qty ukuran, & Kg Kain Terpakai (isi manual, atau centang Pakai habis / Pakai Estimasi).');
    return;
  }
  if (itemBaru.estimasi) {
    const hasil = hitungKgEstimasi_(itemBaru);
    if (!hasil.ok) {
      tampilkanToast(hasil.error);
      return;
    }
    itemBaru.kg = hasil.kg.toFixed(2);
    itemBaru.kgSumber = 'Estimasi';
  }
  // v.31: kombinasi 3 warna (Trico dkk) - warna[0]=badan, warna[1]/[2]=tangan kanan & kiri
  // (angka sama, simetris). "Pakai Estimasi" per-slot (independen) - cuma slot yang dicentang
  // yang dihitung ulang, slot lain (manual/Pakai Habis) dibiarkan apa adanya.
  if (itemBaru.kombinasi && itemBaru.kombinasi.estimasiSlot) {
    const posisiPerSlot = ['badan', 'tangan', 'tangan'];
    for (let i = 0; i < itemBaru.kombinasi.warna.length; i++) {
      if (!itemBaru.kombinasi.estimasiSlot[i]) continue;
      const hasilKombi = hitungKgEstimasi_(itemBaru, posisiPerSlot[i] || 'tangan');
      if (!hasilKombi.ok) {
        tampilkanToast(hasilKombi.error);
        return;
      }
      itemBaru.kombinasi.kg[i] = hasilKombi.kg.toFixed(2);
      if (itemBaru.kombinasi.kgSumber) itemBaru.kombinasi.kgSumber[i] = 'Estimasi';
    }
  }
  // v.35 (request Denny): kg dari "Pakai Estimasi" baru KETAHUAN di titik ini (semuaRollCukup_()
  // di itemBaruValid() tadi gak bisa ngecek slot estimasi - kg-nya masih kosong waktu itu).
  // Cek ULANG sekarang, kg-nya udah pasti keisi (manual maupun barusan dihitung dari estimasi).
  if (!semuaRollCukup_()) {
    tampilkanToast('Kg kain (termasuk hasil estimasi) melebihi stok roll yang tersisa - cek lagi.');
    return;
  }
  daftarAntrian.push(Object.assign({ tempId: ++antrianSeq }, JSON.parse(JSON.stringify(itemBaru))));
  itemBaru = kosongkanItemBaru();
  openDropdown = null;
  renderDetailCard();
  renderQtyGrid();
  hitungTotalQty();
  renderQueue();
  tampilkanToast('✓ Item ditambahkan ke daftar');
});

function renderQueue() {
  const wrap = document.getElementById('queueWrap');
  const list = document.getElementById('queueList');
  const badge = document.getElementById('queueBadge');
  const btnBuatTeks = document.getElementById('btnBuatTeks');

  badge.textContent = daftarAntrian.length;
  btnBuatTeks.textContent = '🚀 Kirim Telegram (' + daftarAntrian.length + ')';
  btnBuatTeks.disabled = daftarAntrian.length === 0;
  wrap.style.display = daftarAntrian.length > 0 ? 'block' : 'none';

  list.innerHTML = daftarAntrian.map(function (it) {
    const deskripsi = deskripsiSingkatItem(it, true); // tampilkan [Pakai Habis]/[Estimasi] di antrian (referensi internal)
    const ukuranTeks = Object.keys(it.ukuran).map(function (u) { return u + it.ukuran[u]; }).join(' ');
    return '<div class="queue-item">' +
      '<div><span class="qtag' + (String(it.kategori).toLowerCase() === 'dewasa' ? ' dewasa' : '') + '">' + escapeHtml(it.kategori) + '</span>' +
      '<div class="qdesc">' + escapeHtml(deskripsi) + '</div>' +
      '<div class="qsizes">' + escapeHtml(ukuranTeks) + '</div></div>' +
      '<button class="qremove" data-tempid="' + it.tempId + '">✕</button>' +
      '</div>';
  }).join('');

  document.querySelectorAll('.qremove').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = parseInt(btn.dataset.tempid, 10);
      daftarAntrian = daftarAntrian.filter(function (it) { return it.tempId !== id; });
      renderQueue();
    });
  });
}

function deskripsiSingkatItem(it, sertakanSumber) {
  if (it.isCustom) {
    let s = it.namaCustom;
    if (it.kombinasi && it.kombinasi.warna[0]) {
      const bagian = it.kombinasi.warna.map(function (w, i) {
        if (!w) return null;
        return w + (it.kombinasi.kg[i] ? (' ' + it.kombinasi.kg[i] + 'kg') : '') + (it.kombinasi.kodeRoll[i] ? (' (roll ' + it.kombinasi.kodeRoll[i] + ')') : '');
      }).filter(Boolean);
      if (bagian.length) s += ' - ' + bagian.join(' + ');
    }
    return s;
  }
  if (it.isKombinasi || it.kombinasi) {
    const awalan = bikinAwalanPreview(it.kategori, it.kodeItem);
    const nama = (awalan ? awalan + ' ' : '') + it.kombinasi.warna.slice(0, 2).join(' ');
    const sumber0 = sertakanSumber && it.kombinasi.kgSumber && it.kombinasi.kgSumber[0];
    return nama + ' - ' + it.kombinasi.kg[0] + 'kg' + (sumber0 ? ' [' + sumber0 + ']' : '') + ' (roll ' + (it.kombinasi.kodeRoll[0] || '-') + ')';
  }
  const awalan = bikinAwalanPreview(it.kategori, it.kodeItem);
  const nama = (awalan ? awalan + ' ' : '') + it.warna;
  return nama + (it.kg ? (' - ' + it.kg + 'kg' + (sertakanSumber && it.kgSumber ? ' [' + it.kgSumber + ']' : '')) : '') + (it.kodeRoll ? (' (roll ' + it.kodeRoll + ')') : '');
}

// ------------------------------------------------------------
// TAMBAH KE DAFTAR -> LANGSUNG KIRIM KE TELEGRAM
// ------------------------------------------------------------
// v.36 (request Denny): SEBELUMNYA 2 langkah terpisah - "Buat Teks" (nampilin layar review dulu)
// baru "Kirim ke Telegram" (tombol terpisah di layar review itu). Sekarang digabung jadi 1 tap -
// tombol bar bawah ini LANGSUNG kirim, gak ada lagi layar "cek dulu sebelum kirim". previewScreen
// SEKARANG cuma tampil SETELAH berhasil terkirim (layar hasil, bukan layar konfirmasi).
document.getElementById('btnBuatTeks').addEventListener('click', function () {
  if (daftarAntrian.length === 0) return;
  if (!tg || !tg.initData) {
    tampilkanToast('Harus dibuka lewat Mini App Telegram.');
    return;
  }
  const teks = daftarAntrian.map(function (it, i) {
    const deskripsi = deskripsiSingkatItem(it, false); // request Denny: [Pakai Habis]/[Estimasi] JANGAN masuk teks Telegram, cukup di antrian & database
    const ukuranTeks = Object.keys(it.ukuran).map(function (u) { return u + it.ukuran[u] + ' = ' + it.ukuran[u]; }).join('\n');
    return (i + 1) + '. ' + deskripsi + '\n' + ukuranTeks;
  }).join('\n\n');
  document.getElementById('previewBox').textContent = teks; // dipakai Salin Teks setelah terkirim
  document.getElementById('peringatanBox').innerHTML = '';

  const btnBuatTeks = this;
  const labelAsli = btnBuatTeks.textContent;
  btnBuatTeks.disabled = true;
  btnBuatTeks.textContent = 'Mengirim...';

  const items = daftarAntrian.map(bangunPayloadItem);

  fetch(WORKER_URL + '/submit-produksi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: tg.initData, items: items })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.ok) {
        // v.02: baik ADA peringatan stok maupun TIDAK, datanya SAMA-SAMA sudah tersimpan
        // (data.ok true) - tampilkan layar hasil (previewScreen), bersihkan antrian, kasih
        // tombol buat mulai input baru.
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        daftarAntrian = [];
        if (data.peringatanStok && data.peringatanStok.length > 0) {
          document.getElementById('peringatanBox').innerHTML =
            '<div class="peringatan-box">⚠️ Tersimpan, tapi ada yang perlu dicek manual:<br>' + data.peringatanStok.map(escapeHtml).join('<br>') + '</div>';
        }
        document.getElementById('previewBox').textContent = '✅ Berhasil dikirim & tersimpan.';
        document.getElementById('app').style.display = 'none';
        document.getElementById('bottomBar').style.display = 'none';
        document.getElementById('previewScreen').style.display = 'block';
        document.getElementById('btnInputBaru').style.display = 'block';
        btnBuatTeks.disabled = false;
        btnBuatTeks.textContent = labelAsli;
      } else if (data.duplikat) {
        tampilkanToast(data.error);
        btnBuatTeks.disabled = false;
        btnBuatTeks.textContent = labelAsli;
      } else {
        tampilkanToast('Gagal: ' + data.error);
        btnBuatTeks.disabled = false;
        btnBuatTeks.textContent = labelAsli;
      }
    })
    .catch(function (err) {
      tampilkanToast('Gagal jaringan: ' + err.message);
      btnBuatTeks.disabled = false;
      btnBuatTeks.textContent = labelAsli;
    });
});

// v.02: dipencet setelah sukses kirim - balikin Mini App ke KONDISI SIAP INPUT lagi dari nol
// (form kosong, dsb) buat laporan BERIKUTNYA di hari yang sama.
document.getElementById('btnInputBaru').addEventListener('click', function () {
  itemBaru = kosongkanItemBaru();
  openDropdown = null;
  ukuranLainTerbuka = false;
  renderDetailCard();
  renderQtyGrid();
  hitungTotalQty();
  renderQueue();
  document.getElementById('peringatanBox').innerHTML = '';
  document.getElementById('previewScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bottomBar').style.display = 'flex';
  document.getElementById('btnInputBaru').style.display = 'none';
});

document.getElementById('btnSalinTeks').addEventListener('click', function () {
  const teks = document.getElementById('previewBox').textContent;
  navigator.clipboard.writeText(teks).then(function () { tampilkanToast('Teks disalin'); });
});

function bangunPayloadItem(it) {
  if (it.isCustom) {
    const payload = { custom: true, namaCustom: it.namaCustom, ukuran: it.ukuran };
    if (it.kombinasi && it.kombinasi.warna[0]) {
      payload.warna1 = it.kombinasi.warna[0];
      payload.kg1 = it.kombinasi.kg[0] ? parseFloat(it.kombinasi.kg[0]) : null;
      payload.kodeRoll1 = it.kombinasi.kodeRoll[0] || null;
      payload.kgSumber1 = (it.kombinasi.kgSumber && it.kombinasi.kgSumber[0]) || null;
      if (it.kombinasi.warna[1]) {
        payload.warna2 = it.kombinasi.warna[1];
        payload.kg2 = it.kombinasi.kg[1] ? parseFloat(it.kombinasi.kg[1]) : null;
        payload.kodeRoll2 = it.kombinasi.kodeRoll[1] || null;
        payload.kgSumber2 = (it.kombinasi.kgSumber && it.kombinasi.kgSumber[1]) || null;
      }
    }
    return payload;
  }
  if (it.isKombinasi || it.kombinasi) {
    return {
      kategori: it.kategori, kodeItem: it.kodeItem,
      kombinasi: { warna: it.kombinasi.warna, kg: it.kombinasi.kg.map(function (v) { return parseFloat(v) || 0; }), kodeRoll: it.kombinasi.kodeRoll, kgSumber: it.kombinasi.kgSumber || [] },
      ukuran: it.ukuran
    };
  }
  return { kategori: it.kategori, kodeItem: it.kodeItem, warna: it.warna, kg: it.kg || null, kgSumber: it.kgSumber || null, kodeRoll: it.kodeRoll || null, ukuran: it.ukuran };
}

// ------------------------------------------------------------
// HELPER UMUM
// ------------------------------------------------------------
function escapeHtml(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeAttr(t) { return escapeHtml(t).replace(/"/g, '&quot;'); }
function tampilkanToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 2500);
}

// ------------------------------------------------------------
// BOOTSTRAP
// ------------------------------------------------------------
renderQtyGrid();
muatDataReferensi();
</script>
