document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8fe95425-81a0-4ca4-b056-40c3bcec4865\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"968ba345-beb3-49bd-be9a-f89f71f4ca0a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5aaf8ea3-192c-4012-8199-fe49ff8ea5e4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"f3a98058-fd37-41cd-8f40-5e501749475c\"><\u002Fscript>\n\n<style>\n  :root{\n    --ink:#1C1C1E;\n    --ink-2:#8E8E93;\n    --ink-3:#C6C6C8;\n    --canvas:#F2F2F7;\n    --card:#FFFFFF;\n    --sep:#E5E5EA;\n    --danger:#FF3B30;\n    --danger-bg:#FFF0EF;\n    --success:#34C759;\n\n    --theme-accent:#3AAFC0;\n    --theme-accent-deep:#1F7A88;\n    --theme-accent-soft:#E4F6F8;\n    --theme-bg-image: none;\n    --scale-app:1;\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\n  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}\n  body{\n    font-family:\"Space Grotesk\",-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"SF Pro Display\",\"Segoe UI\",Roboto,sans-serif;\n    color:var(--ink);\n    background-color:var(--canvas);\n    background-image:var(--theme-bg-image);\n    transition:background-color .4s ease;\n    padding-bottom:135px;\n    -webkit-font-smoothing:antialiased;\n  }\n\n  .topbar{padding:10px 16px 0;}\n  .topbar-top-row{display:flex;align-items:center;justify-content:space-between;}\n  .topbar-eyebrow{\n    font-size:11.5px;font-weight:600;color:var(--theme-accent-deep);letter-spacing:.2px;\n    text-transform:uppercase;transition:color .4s;\n  }\n  .topbar-title{font-size:22px;font-weight:750;letter-spacing:-.3px;line-height:1.1;}\n  .version-badge{\n    display:inline-block;font-size:10px;font-weight:700;color:#fff;\n    background:var(--theme-accent-deep);padding:1px 8px;border-radius:20px;letter-spacing:.3px;\n    transition:background .4s;\n  }\n  #refreshLink{font-size:11.5px;}\n  .topbar-logo{\n    width:38px;height:38px;border-radius:0;background:transparent;\n    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;\n    flex-shrink:0;transition:background .4s;\n  }\n  .topbar-logo #topbarLogoPlaceholder{\n    font-size:8.5px;font-weight:700;color:var(--theme-accent-deep);text-align:center;line-height:1.15;\n  }\n\n  .loading-screen{text-align:center;padding:60px 30px;color:var(--ink-2);font-size:14px;line-height:1.7;}\n\n  .app-body{padding:6px 14px 0;}\n\n  .section-label{\n    font-size:12.5px;font-weight:600;color:var(--ink-2);\n    text-transform:uppercase;letter-spacing:.3px;\n    margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;\n  }\n  .section-label .count-chip{\n    background:var(--theme-accent);color:#fff;border-radius:20px;padding:2px 10px;\n    font-size:12.5px;font-weight:700;transition:background .4s;\n  }\n\n  .card{\n    background:var(--card);border-radius:18px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 0 0 0.5px rgba(0,0,0,.04);\n    overflow:hidden;\n  }\n  .card + .card{margin-top:8px;}\n\n  .row{\n    padding:9px 14px;border-bottom:0.5px solid var(--sep);\n    display:flex;flex-direction:column;\n  }\n  .row:last-child{border-bottom:none;}\n  .row-inline{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:20px;min-width:0;}\n  .row-label{font-size:calc(12px * var(--scale-app));color:var(--ink-2);font-weight:600;flex:0 0 auto;white-space:nowrap;}\n  select,input[type=number],input[type=text]{\n    width:100%;flex:1;min-width:0;border:none;outline:none;font-size:calc(16px * var(--scale-app));color:var(--ink);\n    background:transparent;padding:1px 0;font-family:inherit;font-weight:450;text-align:right;\n  }\n  #warnaInput{text-transform:uppercase;}\n  #warnaInput::placeholder{text-transform:none;color:var(--ink-3);font-weight:450;}\n  select:disabled{color:var(--ink-3);}\n\n  /* v.09: kolom Kg Kain Terpakai - hilangkan panah spinner bawaan number input, ganti placeholder\n     abu \"0\" (mirip pola \"— pilih —\" di Varian) drpd nilai default beneran. */\n  #kgInput::-webkit-outer-spin-button,\n  #kgInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}\n  #kgInput{-moz-appearance:textfield;}\n  #kgInput::placeholder{color:var(--ink-3);font-weight:450;}\n\n  /* v.10: Kode Roll - dropdown ala Varian (bukan lagi list teks horizontal) kalau ada roll stok\n     yang cocok sama Warna. Baris opsi dikasih warna latar (beda2 per baris) biar kontras dari\n     dropdown putih - lihat renderRollDropdown_() di script buat cara milih warnanya. */\n  #rollPickerBtn{font-family:inherit;}\n  #rollInput::placeholder{color:var(--ink-3);font-weight:450;}\n  .roll-opt{\n    padding:11px 14px;font-size:14.5px;font-weight:650;border-bottom:0.5px solid rgba(0,0,0,.06);\n    cursor:pointer;display:flex;justify-content:flex-end;align-items:center;color:#1C1C1E;\n  }\n  .roll-opt:last-child{border-bottom:none;}\n  .roll-opt .roll-opt-text{font-weight:600;font-size:14.5px;text-align:right;}\n  .roll-opt-manual{\n    padding:11px 14px;font-size:13.5px;font-weight:650;color:var(--theme-accent-deep);\n    background:#fff;cursor:pointer;text-align:right;\n  }\n  .roll-link{font-size:12.5px;color:var(--theme-accent-deep);font-weight:600;margin-top:6px;display:inline-block;cursor:pointer;}\n\n  .item-row{\n    padding:8px 14px;border-bottom:0.5px solid var(--sep);\n    display:flex;justify-content:space-between;align-items:center;gap:10px;\n  }\n  .item-row:last-child{border-bottom:none;}\n  .item-row-text{font-size:calc(14.5px * var(--scale-app));line-height:1.55;}\n  .item-row-text b{font-weight:650;}\n  .item-row-tag{\n    display:inline-block;font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:6px;\n    margin-right:6px;background:var(--theme-accent-soft);color:var(--theme-accent-deep);\n    transition:all .4s;\n  }\n  .item-row-del{\n    color:var(--danger);font-size:20px;line-height:1;cursor:pointer;flex-shrink:0;\n    width:28px;height:28px;display:flex;align-items:center;justify-content:center;\n  }\n  .empty-hint{text-align:center;color:var(--ink-2);font-size:14px;padding:26px 16px;}\n\n  /* v.07: Daftar Item dipindah ke BAWAH (sebelum tombol kirim), gaya gelap kontras - biar\n     kelihatan jelas beda dari form input di atasnya, mirip bubble preview Telegram di dashboard\n     QC (dark navy). Ini yang bakal BENERAN dikirim, jadi sengaja dibikin menonjol. */\n  .daftar-gelap{\n    background:#0E1621; border-radius:16px; padding:12px 12px 6px; margin-top:4px;\n  }\n  .daftar-gelap .section-label{ color:#8FA3B8; margin:2px 4px 8px; }\n  .daftar-gelap .section-label .count-chip{ background:var(--theme-accent); }\n  .daftar-gelap .card{ background:#1E2A38; box-shadow:none; }\n  .daftar-gelap .item-row{ border-bottom:0.5px solid rgba(255,255,255,.08); }\n  .daftar-gelap .item-row-text{ color:#E8EDF2; }\n  .daftar-gelap .item-row-text b{ color:#fff; }\n  .daftar-gelap .item-row-tag{ background:rgba(58,175,192,.22); color:#7FD8E5; }\n  .daftar-gelap .item-row-del{ color:#FF6B60; }\n  .daftar-gelap .empty-hint{ color:#8FA3B8; }\n\n  .tab-row{display:flex;gap:8px;}\n  .tab-card{\n    flex:1;border:none;border-radius:16px;padding:10px 8px;cursor:pointer;\n    display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;\n    background:var(--card);\n    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 0 0 0.5px rgba(0,0,0,.04);\n    color:var(--ink-2);transition:all .25s cubic-bezier(.2,.9,.3,1.2);\n  }\n  .tab-icon-badge{\n    width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;\n    background:var(--canvas);transition:all .3s;flex-shrink:0;\n  }\n  .tab-label{font-size:13.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;}\n  .tab-card.active{\n    color:#fff;transform:translateY(-3px) scale(1.015);\n    box-shadow:0 10px 22px -6px var(--tab-shadow, rgba(0,0,0,.25));\n  }\n  .tab-card.tab-anak.active{ background:linear-gradient(160deg,#4FC7D6,#217F8D); --tab-shadow:rgba(33,127,141,.4); }\n  .tab-card.tab-dewasa.active{ background:linear-gradient(160deg,#2E4A6E,#122238); --tab-shadow:rgba(18,34,56,.4); }\n  .tab-card.tab-lain.active{ background:linear-gradient(160deg,#9C8EE0,#6B5BC4); --tab-shadow:rgba(107,91,196,.4); }\n  .tab-card.active .tab-icon-badge{ background:rgba(255,255,255,.22); }\n  .tab-card.active .tab-label{ color:#fff; }\n\n  .qty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 14px;}\n  .qty-cell{display:flex;flex-direction:column;gap:2px;}\n  .qty-cell label{font-size:11px;color:var(--ink-2);font-weight:650;text-align:center;}\n  .qty-cell input{\n    border:1px solid var(--sep);border-radius:10px;padding:6px 4px;\n    text-align:center;font-size:15px;background:var(--canvas);font-weight:600;\n  }\n  .qty-cell input:focus{border-color:var(--theme-accent);background:#fff;}\n  .toggle-link{\n    font-size:12.5px;color:var(--theme-accent-deep);font-weight:600;cursor:pointer;\n    padding:2px 14px 8px;display:inline-block;transition:color .4s;\n  }\n  .total-row{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:8px 14px;border-top:0.5px solid var(--sep);\n    font-size:13px;color:var(--ink-2);font-weight:500;\n  }\n  .total-row b{color:var(--ink);font-size:16px;font-weight:700;}\n\n  .btn-row{\n    position:fixed;bottom:0;left:0;right:0;padding:8px 14px calc(12px + env(safe-area-inset-bottom));\n    background:rgba(242,242,247,.82);backdrop-filter:blur(20px) saturate(1.6);\n    -webkit-backdrop-filter:blur(20px) saturate(1.6);\n    border-top:0.5px solid var(--sep);\n    display:flex;gap:8px;\n  }\n  .btn{\n    flex:1;border:none;border-radius:13px;padding:12px;font-size:15.5px;font-weight:650;\n    cursor:pointer;letter-spacing:-.1px;font-family:\"Space Grotesk\",inherit;\n  }\n  .btn-primary{background:var(--theme-accent-deep);color:#fff;transition:background .4s;}\n  .btn-primary:disabled{background:var(--ink-3);cursor:not-allowed;}\n  .btn-secondary{background:var(--theme-accent-soft);color:var(--theme-accent-deep);transition:all .4s;}\n  .btn-green{background:var(--success);color:#fff;}\n  .btn-full{width:100%;}\n\n  .error-banner{\n    background:var(--danger-bg);color:var(--danger);border-radius:14px;\n    padding:12px 16px;font-size:14px;margin:0 0 6px;font-weight:550;\n  }\n  .badge{font-size:10.5px;background:var(--canvas);color:var(--ink-2);padding:2px 8px;border-radius:6px;font-weight:650;}\n\n  /* v.11: kg mencurigakan (3+ digit tanpa desimal, contoh \"253\" yang harusnya \"25.3\") -\n     border+background merah di input-nya + teks peringatan di bawahnya. */\n  .kg-suspicious{border-color:var(--danger) !important;background:var(--danger-bg) !important;}\n  .kg-warning-text{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:650;}\n\n  .success-screen{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 12px 0;}\n  .success-icon{\n    width:56px;height:56px;border-radius:16px;background:var(--theme-accent-soft);\n    display:flex;align-items:center;justify-content:center;margin-bottom:12px;transition:background .4s;\n  }\n  .success-icon svg{width:28px;height:28px;color:var(--theme-accent-deep);transition:color .4s;}\n  .success-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px;}\n\n  .cut-divider{position:relative;height:2px;margin:10px 4px 2px;background-image:repeating-linear-gradient(90deg, var(--ink-3) 0 7px, transparent 7px 15px);}\n  .cut-divider .scissor-chip{\n    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);\n    background:var(--canvas);width:28px;height:28px;border-radius:50%;\n    display:flex;align-items:center;justify-content:center;font-size:13px;\n    border:1.5px dashed var(--ink-3);transition:background .4s;\n  }\n  .success-sub{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:16px;}\n  .teks-box{\n    width:100%;min-height:150px;background:var(--card);border-radius:16px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 0 0 0.5px rgba(0,0,0,.04);\n    padding:16px;font-size:14px;line-height:1.75;white-space:pre-wrap;\n    font-family:\"Space Grotesk\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;text-align:left;color:var(--ink);\n  }\n  .copied-flash{color:var(--success);font-size:13.5px;font-weight:650;margin-top:10px;display:none;}\n\n  /* ---- Kombinasi 3 Warna ---- */\n  .combo-picker-btn{\n    width:100%;text-align:left;background:var(--theme-accent-soft);border:1.5px dashed var(--theme-accent);\n    border-radius:12px;padding:11px 13px;font-size:15px;font-weight:600;color:var(--theme-accent-deep);\n    cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .4s;\n  }\n  .combo-picker-btn .chev{font-size:13px;opacity:.7;}\n  .combo-dropdown{\n    position:static;margin-top:8px;background:#fff;border-radius:14px;border:1px solid var(--sep);\n    max-height:260px;overflow-y:auto;display:none;\n  }\n  .combo-opt{padding:10px 14px;font-size:14.5px;font-weight:600;border-bottom:0.5px solid var(--sep);cursor:pointer;\n    display:flex;justify-content:space-between;align-items:center;}\n  .combo-opt:last-child{border-bottom:none;}\n  .combo-opt .opt-sub{font-size:12px;color:var(--ink-2);font-weight:500;}\n  .warna-chips{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}\n  .warna-chip{\n    flex:1;min-width:80px;background:var(--canvas);border:1.5px solid var(--sep);border-radius:12px;\n    padding:10px 8px;text-align:center;position:relative;\n  }\n  .warna-chip .chip-order{\n    position:absolute;top:-8px;left:8px;background:var(--theme-accent-deep);color:#fff;\n    font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;\n    display:flex;align-items:center;justify-content:center;transition:background .4s;\n  }\n  .warna-chip .chip-text{font-size:12.5px;font-weight:700;letter-spacing:.2px;}\n  .ganti-link{font-size:12.5px;color:var(--theme-accent-deep);font-weight:600;margin-top:10px;display:inline-block;cursor:pointer;transition:color .4s;}\n  .combo-kgroll-row{display:flex;gap:8px;margin-top:8px;align-items:flex-start;}\n  .combo-kgroll-row input{\n    flex:1;border:1px solid var(--sep);border-radius:8px;padding:9px 8px;font-size:14px;background:var(--canvas);\n  }\n  .combo-kgroll-label{font-size:11.5px;color:var(--ink-2);font-weight:650;margin-top:12px;margin-bottom:2px;}\n\n  /* v.12: dropdown Kode Roll per warna kombinasi (3 warna) - pola SAMA kayak dropdown Kode\n     Roll mode biasa (lihat .roll-opt dkk), cuma ditaruh per baris warna. */\n  .combo-roll-wrap{flex:1;min-width:0;}\n  .combo-roll-wrap input{width:100%;box-sizing:border-box;}\n  .combo-roll-picker-btn{\n    width:100%;box-sizing:border-box;border:1px solid var(--sep);border-radius:8px;padding:9px 8px;\n    font-size:14px;background:var(--canvas);display:flex;justify-content:space-between;align-items:center;\n    cursor:pointer;color:var(--ink);\n  }\n  .combo-roll-picker-btn.placeholder{color:var(--ink-3);}\n  .combo-roll-picker-btn .chev{font-size:11px;color:var(--ink-2);flex-shrink:0;margin-left:6px;}\n  .combo-roll-picker-btn .combo-roll-picker-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}\n  .combo-roll-link{font-size:11.5px;color:var(--theme-accent-deep);font-weight:600;margin-top:5px;display:inline-block;cursor:pointer;}\n  /* v.13: opsi dropdown Kg+Roll kombinasi dipersempit fontnya (beda dari .roll-opt mode biasa\n     yang punya kolom selebar penuh) - kolom kombinasi cuma separuh lebar, teks dibikin lebih\n     kecil + padding lebih tipis biar KONSISTEN muat 1 baris, gak kadang muat kadang enggak. */\n  .combo-roll-opt{padding:9px 10px;}\n  .combo-roll-opt .roll-opt-text{font-size:12.5px;}\n\n  /* ---- Varian custom picker (ganti native <select> yang tampilannya gede bawaan Android) ---- */\n  .custom-select-btn{\n    flex:1;display:flex;justify-content:flex-end;align-items:center;gap:6px;cursor:pointer;\n    font-size:16px;font-weight:450;color:var(--ink);text-align:right;min-width:0;\n  }\n  .custom-select-btn.placeholder{color:var(--ink-3);}\n  .custom-select-btn .chev{font-size:11px;color:var(--ink-2);flex-shrink:0;}\n  .custom-select-btn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n\n  /* ---- Panel \"Atur Tampilan\" (v.08) ---- */\n  .cfg-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:0.5px solid var(--sep);}\n  .cfg-row:last-child{border-bottom:none;}\n  .cfg-row.off{opacity:.45;}\n  .cfg-row input[type=checkbox]{width:auto;flex:none;}\n  .cfg-row-label{flex:1;font-size:14px;font-weight:600;text-align:left;}\n  .cfg-move{display:flex;gap:4px;flex:none;}\n  .cfg-move button{border:none;background:var(--canvas);border-radius:8px;width:26px;height:26px;font-size:12px;cursor:pointer;color:var(--ink-2);}\n  .cfg-move button:disabled{opacity:.3;}\n  .cfg-swatch{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;}\n  .cfg-swatch.active{border-color:var(--ink);}\n  #cfgFontApp{text-align:left;border:1px solid var(--sep);border-radius:10px;padding:8px;background:#fff;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"topbar\">\n  <div class=\"topbar-top-row\">\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <div>\n        <div class=\"topbar-title\">INPUT PRODUKSI<\u002Fdiv>\n        <div class=\"topbar-eyebrow\" id=\"topbarEyebrow\" style=\"font-size:13px;color:#000000;\">Tim Potong<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;\">\n      <div class=\"version-badge\">ver.08<\u002Fdiv>\n      <div id=\"refreshLink\" style=\"margin-top:4px;font-size:11.5px;font-weight:600;color:var(--theme-accent-deep);cursor:pointer;\">🔄 Refresh<\u002Fdiv>\n      <div id=\"aturTampilanLink\" style=\"margin-top:4px;font-size:11.5px;font-weight:600;color:var(--theme-accent-deep);cursor:pointer;\">✏️ Atur Tampilan<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"previewModeBanner\" style=\"display:none;background:#3A2E00;color:#FFD666;font-size:11.5px;font-weight:700;text-align:center;padding:7px 10px;\">\n  🧪 MODE PREVIEW - \"Kirim ke Telegram\" &amp; \"Simpan Atur Tampilan\" DISIMULASIKAN (gak nulis ke Sheet/kirim ke grup beneran). Kategori/Varian/Warna/Kombinasi/Kode Roll akan pakai data ASLI kalau server bisa diakses - kalau gagal/gak ada koneksi ke server, otomatis pakai data contoh (dummy) biar tetap bisa didemoin.\n<\u002Fdiv>\n\n<div id=\"loadingScreen\" class=\"loading-screen\">Memuat data kategori/varian...<\u002Fdiv>\n\n<div id=\"mainWrap\" style=\"display:none;\">\n\n  <div class=\"app-body\" id=\"formScreen\">\n    <div id=\"errorBanner\" class=\"error-banner\" style=\"display:none;\"><\u002Fdiv>\n\n    <div class=\"section-label\" style=\"margin-top:6px;\">Kategori<\u002Fdiv>\n    <div class=\"tab-row\" id=\"kategoriSeg\"><\u002Fdiv>\n\n    <div class=\"cut-divider\"><div class=\"scissor-chip\">✂️<\u002Fdiv><\u002Fdiv>\n\n    <div class=\"section-label\">Detail Item Baru<\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"row\" style=\"position:relative;\">\n        <div class=\"row-inline\">\n          <div class=\"row-label\" style=\"color:#000000;font-size:14px;\">Varian<\u002Fdiv>\n          <div class=\"custom-select-btn placeholder\" id=\"varianPickerBtn\">\n            <span id=\"varianPickerLabel\">— pilih —<\u002Fspan>\n            <span class=\"chev\">▾<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"combo-dropdown\" id=\"varianDropdown\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"biasaRows\">\n        <div class=\"row\" id=\"rowWarna\" style=\"position:relative;\">\n          <div class=\"row-inline\" id=\"warnaInputWrap\">\n            <div class=\"row-label\" style=\"color:#000000;font-size:14px;\">Warna<\u002Fdiv>\n            <input type=\"text\" id=\"warnaInput\" autocomplete=\"off\" placeholder=\"— pilih warna —\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" id=\"rowKg\">\n          <div class=\"row-inline\">\n            <div class=\"row-label\" style=\"color:#000000;font-size:14px;\">Kg Kain Terpakai<\u002Fdiv>\n            <input type=\"number\" id=\"kgInput\" step=\"0.01\" autocomplete=\"off\" placeholder=\"0\">\n          <\u002Fdiv>\n          <div class=\"row-inline\" style=\"margin-top:6px;\">\n            <label style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:600;\">\n              <input type=\"checkbox\" id=\"pakaiEstimasiKg\" style=\"width:auto;flex:none;\">\n              Kg tidak diketahui - pakai estimasi standar\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div id=\"estimasiKgInfo\" style=\"display:none;font-size:11.5px;color:var(--theme-accent-deep);margin-top:2px;\"><\u002Fdiv>\n          <div id=\"kgWarningInfo\" class=\"kg-warning-text\" style=\"display:none;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" id=\"rowRoll\" style=\"position:relative;\">\n          <div class=\"row-inline\" id=\"rollInputWrap\">\n            <div class=\"row-label\" style=\"color:#000000;font-size:14px;\">Kode Roll <span class=\"badge\">wajib isi<\u002Fspan><\u002Fdiv>\n            <input type=\"text\" id=\"rollInput\" autocomplete=\"off\" inputmode=\"numeric\" pattern=\"[0-9]*\">\n          <\u002Fdiv>\n          <span class=\"roll-link\" id=\"rollKeDaftarLink\" style=\"display:none;\">🔽 Pilih dari stok tersedia<\u002Fspan>\n          <div class=\"row-inline\" id=\"rollPickerWrap\" style=\"display:none;\">\n            <div class=\"row-label\" style=\"color:#000000;font-size:14px;\">Kode Roll <span class=\"badge\">wajib isi<\u002Fspan><\u002Fdiv>\n            <div class=\"custom-select-btn placeholder\" id=\"rollPickerBtn\">\n              <span id=\"rollPickerLabel\">— pilih roll —<\u002Fspan>\n              <span class=\"chev\">▾<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"combo-dropdown\" id=\"rollDropdown\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"kombinasiRows\" style=\"display:none;\">\n        <div class=\"row\" style=\"position:relative;\">\n          <div class=\"row-label\">Warna <span class=\"badge\">Kombinasi 3 Warna<\u002Fspan><\u002Fdiv>\n          <div id=\"comboPickerWrap\">\n            <div class=\"combo-picker-btn\" id=\"comboPickerBtn\">\n              <span id=\"comboPickerLabel\">Pilih kombinasi warna...<\u002Fspan>\n              <span class=\"chev\">▾<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"combo-dropdown\" id=\"comboDropdown\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"comboHasil\" style=\"display:none;\">\n            <div class=\"warna-chips\" id=\"warnaChips\"><\u002Fdiv>\n            <span class=\"ganti-link\" id=\"gantiKombinasi\">Ganti kombinasi<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" id=\"kgRollComboRow\" style=\"display:none;\">\n          <div id=\"kgRollComboWrap\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cut-divider\"><div class=\"scissor-chip\">✂️<\u002Fdiv><\u002Fdiv>\n\n    <div class=\"section-label\">Qty per Size<\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"qty-grid\" id=\"qtyGrid\"><\u002Fdiv>\n      <span class=\"toggle-link\" id=\"toggleLain\">Tampilkan ukuran lain (3XL–6XL)<\u002Fspan>\n      <div class=\"qty-grid\" id=\"qtyGridLain\" style=\"display:none;\"><\u002Fdiv>\n      <div class=\"total-row\"><span style=\"color:#000000;\"><b>Total qty item ini<\u002Fb><\u002Fspan><b id=\"totalQty\" style=\"font-size:18px;\">0 pcs<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"daftarItemSection\" style=\"display:none;\">\n      <div class=\"cut-divider\"><div class=\"scissor-chip\">✂️<\u002Fdiv><\u002Fdiv>\n      <div class=\"daftar-gelap\">\n        <div class=\"section-label\"><span>Daftar Item (siap dikirim)<\u002Fspan><span class=\"count-chip\" id=\"itemCount\">0<\u002Fspan><\u002Fdiv>\n        <div class=\"card\">\n          <div id=\"itemList\">\n            <div class=\"empty-hint\" id=\"emptyHint\">Belum ada item ditambahkan<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"app-body\" id=\"successScreen\" style=\"display:none;\">\n    <div class=\"success-screen\">\n      <div class=\"success-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"success-title\">Teks siap dikirim<\u002Fdiv>\n      <div class=\"success-sub\">Cek dulu teksnya di bawah - kalau ada yang salah ketik, tap \"Kembali Edit\". Kalau sudah benar, tap \"Kirim ke Telegram\" buat kirim &amp; proses langsung.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"teks-box\" id=\"teksHasil   <div style=\"display:flex;gap:10px;padding:4px 4px 8px;\" id=\"cfgSwatchRow\"><\u002Fdiv>\n      <p style=\"font-size:11.5px;color:var(--ink-2);margin:0 4px 0;\">\"Otomatis\" = warna ikut kategori (Anak/Dewasa/Lain) seperti biasa.<\u002Fp>\n\n      <div style=\"display:flex;gap:10px;margin-top:18px;\">\n        <button class=\"btn btn-secondary\" id=\"cfgBatal\" style=\"flex:1;\">Batal<\u002Fbutton>\n        <button class=\"btn btn-primary\" id=\"cfgSimpan\" style=\"flex:1;\">Simpan<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<script>\n// =====================================================================================\n// MINI APP INPUT PRODUKSI - TIM POTONG - ver.02\n// Catatan revisi tiap rilis (mulai dari ver.02 - histori sebelumnya cuma dicatat via badge,\n// tidak ditulis di sini):\n//\n// ver.02 - Ikon Anak & Dewasa diganti pakai gambar custom (bukan emoji lagi); kg dibalikin\n// jadi 1 kolom biasa (percobaan pemisah koma dibatalkan, terbukti bikin bug tampilan).\n//\n// ver.03 - Format penulisan teks total diubah sesuai tabel spek baru Denny: Kategori ANAK\n// selalu ditulis literal \"ANAK\" di depan, tapi DEWASA TIDAK PAKAI kata \"DEWASA\" sama sekali.\n// Prefix Tele sekarang diambil dari kolom \"Kode Item\" di sheet KATEGORI VARIAN (bukan Label\n// Varian lagi) - jadi PENTING: nilai kolom Kode Item di sheet harus diisi ulang sesuai tabel\n// baru (lihat pesan chat). Kombinasi 3 warna sekarang pakai formula SAMA kayak item biasa\n// (adaPanjang dihapus, gak perlu lagi - Prefix Tele dari sheet sudah otomatis benar). Ditambah\n// autocomplete Warna khusus 8 kombinasi tetap buat varian Ringer (Dewasa).\n//\n// ver.04 - fix bug warna \"nempel\" (mis. jadi \"UNGU MUDA BATA\" padahal cuma mau ketik \"BATA\"):\n// penyebabnya saran autocomplete Warna muncul LANGSUNG begitu kolom disentuh (sebelum ngetik\n// apa-apa), jadi rawan ke-tap gak sengaja. Sekarang saran BARU muncul setelah mulai ngetik,\n// plus teks lama (kalau ada sisa) otomatis ke-select penuh saat kolom disentuh - jadi ngetik\n// selanjutnya otomatis GANTI, bukan nempel di belakang.\n//\n// ver.05 - BUG FIX PENTING: kata \"ANAK\" ternyata kepasang di SEMUA varian kategori Anak,\n// padahal seharusnya HANYA muncul buat varian Pendek/Panjang (Kode Item kosong/\"PJG\") - varian\n// lain (Ruffle/Setelan/Oneset Panjang/Oneset Pendek/Celana Pendek) sudah punya kode sendiri dan\n// SEHARUSNYA TANPA kata \"ANAK\" sama sekali. Ketauan setelah dites langsung tiap baris tabel\n// spek terhadap fungsi bikinAwalan_() - 5 dari 25 kasus gagal sebelum fix ini.\n//\n// ver.06 - fix bug warna nempel BABAK 2: fix ver.04 kemarin cuma nutup celah pas kolom\n// DISENTUH, tapi begitu SUDAH TAP salah satu saran, kolom tetap fokus (sengaja ditahan biar\n// tap-nya kedaftar) - jadi ketik lanjutan masih nempel di belakang kalau lupa hapus dulu.\n// Sekarang begitu 1 saran dipilih, teksnya otomatis ke-select juga (bukan cuma pas fokus awal)\n// - jadi ngetik lagi tanpa keluar-masuk kolom pun tetap otomatis GANTI, bukan nempel.\n// =====================================================================================\n\n// =====================================================================================\n// URL Web App Apps Script - GANTI kalau kamu redeploy ke project/URL yang berbeda\n// =====================================================================================\nconst WEBAPP_URL = \"https://script.google.com/macros/s/AKfycbzaWvCi3Vw2fnFgBPfn1qvFBSqYXOrdWi8yxvKc8WOtaIH78JN83dIMiQtQeockW6EDBw/exec\";\n\n// v.10-preview: MODE PREVIEW - biar bisa dites SEBELUM Apps Script v33 di-deploy. Data\n// kategori/varian/warna/kombinasi tetap dibaca LANGSUNG dari server asli (read-only, aman).\n// Yang di-SIMULASIKAN cuma yang: (a) butuh backend BARU yang belum jalan (estimasi Kg, dropdown\n// Kode Roll dari stok, simpan Atur Tampilan), atau (b) beneran NULIS data kalau dites di server\n// produksi (kirim ke Telegram) - lihat masing2 titik \"if (PREVIEW_MODE)\" di bawah buat detailnya.\n// Set false lalu upload ulang sebagai index.html begitu Apps Script v33 sudah di-deploy DAN\n// preview dropdown Kode Roll-nya sudah di-ACC, biar semuanya jalan ke server beneran.\nconst PREVIEW_MODE = false;\nconst DUMMY_STANDAR_PEMAKAIAN = [\n  { varian: 'RFL', kodeItem: '', kgPerPcs: 0.18 },\n  { varian: 'Kaos Anak', kodeItem: '', kgPerPcs: 0.15 },\n  { varian: 'Ringer', kodeItem: '', kgPerPcs: 0.22 }\n]; // v.08-preview: cuma dipakai kalau PREVIEW_MODE true DAN sheet STANDAR PEMAKAIAN beneran kosong -\n   // biar tombol \"pakai estimasi standar\" ada sesuatu buat didemoin. HAPUS/abaikan begitu sheet asli sudah diisi.\n\n// v.10-preview: contoh data stok roll per warna buat demo dropdown Kode Roll - cuma dipakai\n// kalau PREVIEW_MODE true DAN ?action=stokRoll gagal/kosong (backend v33 belum di-deploy).\n// Nilai \"NAVY\" sengaja dibikin sama kayak contoh screenshot Denny (3 roll, salah satunya angka\n// desimal panjang 7.979999999999997 - buat mastiin formatKg2_() bulatin & pad-nya bener).\nconst DUMMY_STOK_ROLL_PER_WARNA = {\n  'NAVY': [\n    { kodeRoll: '1427', kg: 25.1 },\n    { kodeRoll: '1426', kg: 24.85 },\n    { kodeRoll: '0668', kg: 7.979999999999997 }\n  ],\n  'BLACK': [\n    { kodeRoll: '0912', kg: 18.5 }\n  ],\n  'CREAM': [\n    { kodeRoll: '0231', kg: 6.333333333333333 },\n    { kodeRoll: '0455', kg: 112.4 }\n  ]\n};\n\n// v.10-preview: dummy KATEGORI/VARIAN, WARNA, & KOMBINASI WARNA - dipakai kalau fetch ke\n// WEBAPP_URL gagal TOTAL (mis. gak ada akses internet/CORS di lingkungan preview). Sebelumnya\n// cuma STANDAR_PEMAKAIAN & STOK_ROLL yang ada fallback dummy - Kategori/Varian yang GAGAL bikin\n// SELURUH form kosong (loading screen nyangkut), jadi sekarang dilengkapi juga.\nconst DUMMY_KATEGORI_VARIAN = {\n  'Anak': [\n    { label: 'Kaos Lengan Panjang', kode: 'PJ' },\n    { label: 'Kaos Lengan Panjang Kombinasi', kode: 'LT' },\n    { label: 'Setelan', kode: 'SET' },\n    { label: 'Celana Pendek', kode: 'CP' }\n  ],\n  'Dewasa': [\n    { label: 'Pendek', kode: 'TS' },\n    { label: 'Panjang', kode: 'LS' },\n    { label: 'Pendek Kombinasi', kode: 'TSK' },\n    { label: 'Panjang Kombinasi', kode: 'LSK' },\n    { label: 'Ruffle', kode: 'RFL' },\n    { label: 'Setelan', kode: 'SETD' }\n  ]\n};\nconst DUMMY_WARNA_LIST = ['NAVY', 'BLACK', 'CREAM', 'WHITE', 'GREY', 'MUSTARD', 'TERACOTA'];\nconst DUMMY_KOMBINASI_WARNA = [\n  { nama: 'WHITE MUSTARD', ketiga: 'STEEL BLUE' },\n  { nama: 'NAVY CREAM', ketiga: 'TERACOTA' },\n  { nama: 'BLACK TERACOTA', ketiga: 'MUSTARD' }\n];\n\nconst SIZES_UTAMA = [\"XS\",\"S\",\"M\",\"L\",\"XL\",\"XXL\"];\nconst SIZES_LAIN = [\"3XL\",\"4XL\",\"5XL\",\"6XL\"];\nconst CACHE_KEY = 'timpotong_kategori_varian_cache_v1';\nconst CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000;\nconst WARNA_CACHE_KEY = 'timpotong_warna_cache_v1';\nconst WARNA_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 1 hari - stok kain bergerak tiap hari, beda dari kategori/varian yang jarang berubah\nconst KOMBINASI_CACHE_KEY = 'timpotong_kombinasi_warna_cache_v1';\nconst KOMBINASI_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 hari - kombinasi warna jarang ganti tapi gak sejarang kategori/varian\nconst STANDAR_CACHE_KEY = 'timpotong_standar_pemakaian_cache_v1';\nconst STANDAR_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 hari - sama pola kayak kombinasi warna\nconst STOK_ROLL_CACHE_KEY = 'timpotong_stok_roll_cache_v1';\nconst STOK_ROLL_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 1 hari - sama pola kayak WARNA_CACHE (stok kain bergerak tiap hari)\nconst WARNA_KANONIK_CACHE_KEY = 'timpotong_warna_kanonik_cache_v1';\nconst WARNA_KANONIK_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 hari - sinonim warna jarang ganti, sama pola kayak kombinasi warna\n\nconst tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;\n\nconst THEME = {\n  anak: { key:'anak', accent:'#2FA8BA', accentDeep:'#1B7684', accentSoft:'#D8F1F3', canvas:'#D9F1F3', bgImage:'none' },\n  dewasa: { key:'dewasa'   { key:'sedang', label:'Sedang', value:1 },\n  { key:'besar', label:'Besar', value:1.15 },\n  { key:'sangatbesar', label:'Sangat Besar', value:1.3 }\n];\nfunction fontScaleValueApp(key){\n  const f = FONT_SCALE_PRESETS_APP.filter(function(p){ return p.key === key; })[0];\n  return f ? f.value : 1;\n}\nconst ROW_EL_BY_KEY = { warna: 'rowWarna', kg: 'rowKg', roll: 'rowRoll' };\n\nlet appGeneralConfig = { accent: 'auto', fontScale: 'sedang' };\nlet appFieldOrderConfig = [\n  { key: 'warna', label: 'Warna', show: true },\n  { key: 'kg', label: 'Kg Kain Terpakai', show: true },\n  { key: 'roll', label: 'Kode Roll', show: true }\n];\n\nfunction applyFontScaleApp(){\n  document.documentElement.style.setProperty('--scale-app', fontScaleValueApp(appGeneralConfig.fontScale));\n}\n\n// Reorder & show/hide baris di dalam #biasaRows sesuai appFieldOrderConfig. Roll boleh\n// disembunyikan (opsional), tapi Warna & Kg WAJIB tetap tampil (dijaga juga di backend).\nfunction applyFieldOrderApp(){\n  const wrap = document.getElementById('biasaRows');\n  appFieldOrderConfig.forEach(function(f){\n    const el = document.getElementById(ROW_EL_BY_KEY[f.key]);\n    if (!el) return;\n    wrap.appendChild(el); // pindahkan ke urutan paling akhir, satu-satu sesuai urutan config\n    const wajibTampil = (f.key === 'warna' || f.key === 'kg');\n    el.style.display = (f.show || wajibTampil) ? 'block' : 'none';\n  });\n}\n\nfunction terapkanInputConfigBundle(bundle){\n  if (bundle.fieldOrder) appFieldOrderConfig = bundle.fieldOrder;\n  if (bundle.general) appGeneralConfig = Object.assign({}, appGeneralConfig, bundle.general);\n  applyFieldOrderApp();\n  applyFontScaleApp();\n  // re-terapkan tema kategori yang lagi aktif skrg biar accent override langsung kepakai\n  if (state.kategori) terapkanTema(themeUntukKategori(state.kategori));\n}\n\nfetch(WEBAPP_URL + '?action=inputCfg', { cache: 'no-store' })\n  .then(function(r){ return r.json(); })\n  .then(function(data){ terapkanInputConfigBundle(data.config || {}); })\n  .catch(function(){ /* diamkan - pakai default kalau gagal, gak ganggu form utama */ });\n\nlet draftInputCfg = null;\nfunction cloneFieldOrder(list){ return list.map(function(f){ return { key:f.key, label:f.label, show:f.show }; }); }\n\nfunction renderCfgFieldOrder(){\n  const wrap = document.getElementById('cfgRowsFieldOrder');\n  const list = draftInputCfg.fieldOrder;\n  wrap.innerHTML = list.map(function(f, i){\n    const wajib = (f.key === 'warna' || f.key === 'kg');\n    return '<div class=\"cfg-row'+(f.show || wajib ? '' : ' off')+'\">' +\n      '<input type=\"checkbox\" data-idx=\"'+i+'\"'+(f.show || wajib ? ' checked' : '')+(wajib ? ' disabled' : '')+'>' +\n      '<span class=\"cfg-row-label\">'+f.label+(wajib ? ' <span class=\"badge\">wajib<\u002Fspan>' : '')+'<\u002Fspan>' +\n      '<div class=\"cfg-move\">' +\n        '<button type=\"button\" data-move=\"up\" data-idx=\"'+i+'\"'+(i===0?' disabled':'')+'>▲<\u002Fbutton>' +\n        '<button type=\"button\" data-move=\"down\" data-idx=\"'+i+'\"'+(i===list.length-1?' disabled':'')+'>▼<\u002Fbutton>' +\n      '<\u002Fdiv>' +\n    '<\u002Fdiv>';\n  }).join('');\n  wrap.querySelectorAll('input[type=checkbox]').forEach(function(cb){\n    cb.addEventListener('change', function(){\n      draftInputCfg.fieldOrder[parseInt(cb.dataset.idx,10)].show = cb.checked;\n    });\n  });\n  wrap.querySelectorAll('button[data-move]').forEach(function(btn){\n    btn.addEventListener('click', function(){\n      const i = parseInt(btn.dataset.idx,10);\n      const j = btn.dataset.move === 'up' ? i-1 : i+1;\n      if (j < 0 || j >= list.length) return;\n      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;\n      renderCfgFieldOrder();\n    });\n  });\n}\n\nfunction renderCfgSwatchesApp(){\n  const row = document.getElementById('cfgSwatchRow');\n  const opsi = [{key:'auto', label:'A'}].concat(Object.keys(ACCENT_PRESETS_APP).map(function(k){ return {key:k, label:k[0].toUpperCase()}; }));\n  row.innerH tal').addEventListener('click', function(){\n  applyFontScaleApp();\n  if (state.kategori) terapkanTema(themeUntukKategori(state.kategori)); // batal preview, balik ke yang tersimpan\n  document.getElementById('cfgOverlay').style.display = 'none';\n});\ndocument.getElementById('cfgSimpan').addEventListener('click', function(){\n  const btn = document.getElementById('cfgSimpan');\n  if (PREVIEW_MODE) {\n    // v.08-preview: backend v16 (?action=saveInputCfg) belum tentu sudah di-deploy - simpan\n    // cuma di memori tab ini (gak ke server) biar tetap bisa didemoin urutan/font/warnanya.\n    btn.disabled = true; btn.textContent = 'Menyimpan (simulasi)…';\n    setTimeout(function(){\n      btn.disabled = false; btn.textContent = 'Simpan';\n      terapkanInputConfigBundle(draftInputCfg);\n      document.getElementById('cfgOverlay').style.display = 'none';\n    }, 500);\n    return;\n  }\n  btn.disabled = true; btn.textContent = 'Menyimpan…';\n  const body = new URLSearchParams();\n  body.set('action', 'saveInputCfg');\n  body.set('data', JSON.stringify(draftInputCfg));\n  fetch(WEBAPP_URL, { method: 'POST', body: body })\n    .then(function(res){ return res.json(); })\n    .then(function(hasil){\n      btn.disabled = false; btn.textContent = 'Simpan';\n      if (hasil && hasil.ok){\n        terapkanInputConfigBundle(hasil.config || draftInputCfg);\n        document.getElementById('cfgOverlay').style.display = 'none';\n      } else {\n        showError('Gagal simpan tampilan: ' + ((hasil && hasil.error) || 'tidak diketahui'));\n      }\n    })\n    .catch(function(err){\n      btn.disabled = false; btn.textContent = 'Simpan';\n      showError('Gagal simpan tampilan: ' + err.message);\n    });\n});\n\nlet KATEGORI_VARIAN = {};\nlet KOMBINASI_WARNA = [];\nlet daftarItem = []; // item biasa: {mode:'biasa', kategori, kodeItem, varianLabel, warna, kg, roll, qty}\n                      // item kombinasi: {mode:'kombinasi', kategori, kodeItem, varianLabel, warnaTiga:[w1,w2,w3]
