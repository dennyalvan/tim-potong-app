dLain.style.display = showing ? 'none' : 'grid';\n  this.textContent = showing ? 'Tampilkan ukuran lain (3XL-6XL)' : 'Sembunyikan ukuran lain';\n});\n\nfunction isKombinasi(label){\n  const l = (label || '').toLowerCase();\n  return l.indexOf('kombinasi') !== -1 || l.indexOf('trico') !== -1;\n}\n\nfunction resetComboUI(){\n  comboPickerWrap.style.display = 'block';\n  comboHasil.style.display = 'none';\n  kgRollComboRow.style.display = 'none';\n  comboPickerLabel.textContent = 'Pilih kombinasi warna...';\n  state.comboWarna = null;\n  state.comboKg = ['','',''];\n  state.comboRoll = ['','',''];\n  state.comboRollAutoFilled = [false,false,false];\n}\n\nwarnaInput.addEventListener('input', function(){ state.warna = warnaInput.value; validate(); tampilkanSaranWarna(); tampilkanStokRoll_(); });\nwarnaInput.addEventListener('focus', function(){ warnaInput.select(); });\nwarnaInput.addEventListener('blur', function(){ setTimeout(function(){ warnaDropdown.style.display = 'none'; }, 150); });\n// v.11: kg mencurigakan = 3 digit ATAU LEBIH tanpa tanda desimal sama sekali (contoh \"253\",\n// \"1200\") - kain gak pernah seberat itu (paling berat biasanya ±40kg, gak pernah sampai 100kg),\n// hampir pasti tim potong lupa nulis titik desimalnya (maksudnya \"25.3\" bukan \"253\"). Dicek dari\n// STRING mentah (bukan angka hasil parseFloat), karena yang mau dideteksi justru KETIADAAN titik-nya.\nfunction kgMencurigakan_(rawStr){\n  return /^\\d{3,}$/.test(String(rawStr || '').trim());\n}\n\nkgInput.addEventListener('input', function(){\n  state.kg = kgInput.value;\n  const curiga = kgMencurigakan_(kgInput.value);\n  kgInput.classList.toggle('kg-suspicious', curiga);\n  kgWarningInfo.style.display = curiga ? 'block' : 'none';\n  kgWarningInfo.textContent = curiga ? '⚠️ ' + kgInput.value + ' kg? Kain jarang di atas 100kg (biasanya maks ±40kg) - cek lagi titik desimalnya, mungkin maksudnya ' + kgInput.value.slice(0, -1) + '.' + kgInput.value.slice(-1) + ' kg.' : '';\n  validate();\n});\n// v.09: rollAutoFilled nandain isi rollInput itu HASIL AUTO-SHOW (bukan diketik manual) - dipakai\n// tampilkanStokRoll_() buat tau boleh timpa/kosongin lagi apa nggak begitu Warna ganti.\nlet rollAutoFilled = false;\nrollInput.addEventListener('input', function(){ state.roll = rollInput.value; rollAutoFilled = false; });\n\ncomboPickerBtn.addEventListener('click', function(){\n  const showing = comboDropdown.style.display === 'block';\n  if (showing){ comboDropdown.style.display = 'none'; return; }\n  if (KOMBINASI_WARNA.length === 0){\n    showError('Sheet KOMBINASI WARNA masih kosong atau belum termuat. Coba Refresh Data.');\n    return;\n  }\n  comboDropdown.innerHTML = KOMBINASI_WARNA.map(function(c, idx){\n    return '<div class=\"combo-opt\" data-idx=\"'+idx+'\"><span>'+c.nama+'<\u002Fspan><span class=\"opt-sub\">+ '+c.ketiga+'<\u002Fspan><\u002Fdiv>';\n  }).join('');\n  comboDropdown.querySelectorAll('.combo-opt').forEach(function(el){\n    el.addEventListener('click', function(){\n      const c = KOMBINASI_WARNA[parseInt(el.dataset.idx,10)];\n      pilihKombinasi(c);\n      comboDropdown.style.display = 'none';\n    });\n  });\n  comboDropdown.style.display = 'block';\n});\n\nfunction pilihKombinasi(c){\n  const dua = c.nama.split(' ');\n  const tiga = [dua[0], dua[1], c.ketiga];\n  state.comboWarna = tiga;\n  warnaChips.innerHTML = tiga.map(function(w, i){\n    return '<div class=\"warna-chip\"><div class=\"chip-order\">'+(i+1)+'<\u002Fdiv><div class=\"chip-text\">'+w+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  comboPickerWrap.style.display = 'none';\n  comboHasil.style.display = 'block';\n\n  kgRollComboWrap.innerHTML = tiga.map(function(w, i){\n    return '<div class=\"combo-kgroll-label\">Kg + Kode Roll - ' + w + '<\u002Fdiv>' +\n      '<div class=\"combo-kgroll-row\">' +\n        '<input type=\"number\" step=\"0.01\" class=\"comboKgInput\" data-idx=\"'+i+'\" placeholder=\"kg\">' +\n        '<div class=\"combo-roll-wrap\" data-idx=\"'+i+'\">' +\n          '<input type=\"text\" class=\"comboRollInput\" data-idx=\"'+i+'\" placeholder=\"kode roll (opsional)\" inputmode=\"numeric\" pattern=\"[0-9]*\">' +\n          '<span class=\"combo-roll-link\" data-idx=\"'+i+'\" style=\"display:none;\">🔽 Pilih dari stok tersedia<\u002Fspan>' +\n          '<div class=\"combo-roll-picker-btn placeholder\" data-idx=\"'+i+'\" style=\"display:none;\">' +\n            '<span class=\"combo-roll-picker-label\">— pilih roll —<\u002Fspan><span class=\"chev\">▾<\u002Fspan>' +\n          '<\u002Fdiv>' +\n          '<div class=\"combo-dropdown combo-roll-dropdown\" data-idx=\"'+i+'\"><\u002Fdiv>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>';\n  }).join('');\n  kgRollComboRow.style.display = 'block';\n\n  document.querySelectorAll('.comboKgInput').forEach(function(inp){\n    inp.addEventListener('input', function(){\n      state.comboKg[parseInt(inp.dataset.idx,10)] = inp.value;\n      inp.classList.toggle('kg-suspicious', kgMencurigakan_(inp.value));\n      validate();\n    });\n  });\n  document.querySelectorAll('.comboRollInput').forEach(function(inp){\n    inp.addEventListener('input', function(){\n      const idx = parseInt(inp.dataset.idx,10);\n      state.comboRoll[idx] = inp.value;\n      state.comboRollAutoFilled[idx] = false;\n    });\n  });\n  document.querySelectorAll('.combo-roll-picker-btn').forEach(function(btn){\n    btn.addEventListener('click', function(){\n      const idx = btn.dataset.idx;\n      const dd = kgRollComboWrap.querySelector('.combo-roll-dropdown[data-idx=\"'+idx+'\"]');\n      const showing = dd.style.display === 'block';\n      kgRollComboWrap.querySelectorAll('.combo-roll-dropdown').forEach(function(x){ x.style.display = 'none'; });\n      dd.style.display = showing ? 'none' : 'block';\n    });\n  });\n  document.querySelectorAll('.combo-roll-link').forEach(function(link){\n    link.addEventListener('click', function(){ comboSwitchKePicker_(link.dataset.idx); });\n  });\n\n  // v.12: begitu kombinasi dipilih, langsung cek stok roll buat KETIGA warnanya (sama kayak\n  // tampilkanStokRoll_() di mode biasa, cuma dijalankan 3x - satu per warna). Kalau salah satu\n  // warna gak ada stok yang cocok, warna itu jatuh ke input manual (yang lain tetap dropdown).\n  tiga.forEach(function(w, i){ tampilkanStokRollCombo_(i, w); });\n\n  validate();\n}\n\n// ============ v.12: DROPDOWN KODE ROLL PER WARNA (mode Kombinasi 3 Warna) ============\n// Pola & fungsi-fungsi ini SENGAJA dibikin paralel 1:1 sama punya mode biasa\n// (renderRollDropdown_/pilihRoll_/switchKeManualRoll_/switchKePickerRoll_/resetRollPickerUI_/\n// tampilkanStokRoll_ di bawah) - bedanya cuma versi ini per-index (idx 0/1/2, satu per warna),\n// jadi 3 baris bisa beda kondisi (misal warna 1 & 3 ada stok jadi dropdown, warna 2 gak ada jadi manual).\nfunction comboRollWrapEl_(idx){ return kgRollComboWrap.querySelector('.combo-roll-wrap[data-idx=\"'+idx+'\"]'); }\n\nfunction comboSwitchKeManual_(idx, tampilkanLink){\n  const wrap = comboRollWrapEl_(idx);\n  wrap.querySelector('.comboRollInput').style.display = '';\n  wrap.querySelector('.combo-roll-picker-btn').style.display = 'none';\n  wrap.querySelector('.combo-roll-dropdown').style.display = 'none';\n  wrap.querySelector('.combo-roll-link').style.display = tampilkanLink ? 'inline-block' : 'none';\n}\nfunction comboSwitchKePickerRoll_(idx){\n  const wrap = comboRollWrapEl_(idx);\n  wrap.querySelector('.comboRollInput').style.display = 'none';\n  wrap.querySelector('.combo-roll-link').style.display = 'none';\n  wrap.querySelector('.combo-roll-picker-btn').style.display = '';\n}\nfunction comboSwitchKePicker_(idx){ comboSwitchKePickerRoll_(idx); } // dipanggil dari link \"🔽 Pilih dari stok tersedia\"\n\nfunction comboResetRollPickerUI_(idx){\n  comboSwitchKeManual_(idx, false);\n  const wrap = comboRollWrapEl_(idx);\n  wrap.querySelector('.combo-roll-picker-label').textContent = '— pilih roll —';\n  wrap.querySelector('.combo-roll-picker-btn').classList.add('placeholder');\n  const dd = wrap.querySelector('.combo-roll-dropdown');\n  dd.innerHTML = ''; dd.style.display = 'none';\n}\nfunction comboPilihRoll_(idx, kode, kg){\n  const wrap = comboRollWrapEl_(idx);\n  wrap.querySelector('.comboRollInput').value = kode;\n  state.comboRoll[idx] = kode;\n  state.comboRollAutoFilled[idx] = true;\n  wrap.querySelector('.combo-roll-picker-label').textContent = 'Roll ' + kode + ((kg !== undefined && kg !== null && !isNaN(kg)) ? ' / ' + formatKg2_(kg) + ' kg' : '');\n  wrap.querySelector('.combo-roll-picker-btn').classList.remove('placeholder');\n  wrap.querySelector('.combo-roll-dropdown').style.display = 'none';\n}\nfunction comboRenderRollDropdown_(idx, rolls){\n  const wrap = comboRollWrapEl_(idx);\n  const dd = wrap.querySelector('.combo-roll-dropdown');\n  // v.13: format teks dipersingkat KHUSUS versi kombinasi (\"1346 · 24.50kg\" bukan \"Roll 1346 /\n  // 24.50 kg\") - kolomnya cuma separuh lebar (Kg+Roll sebelahan), jadi butuh lebih ringkas biar\n  // konsisten muat 1 baris. Mode biasa TIDAK disentuh, tetap pakai format lengkapnya sendiri.\n  dd.innerHTML = rolls.map(function(r, i2){\n    const bg = ROLL_OPT_COLORS[i2 % ROLL_OPT_COLORS.length];\n    return '<div class=\"roll-opt combo-roll-opt\" data-kode=\"' + r.kodeRoll + '\" data-kg=\"' + r.kg + '\" style=\"background:' + bg + ';\">' +\n      '<span class=\"roll-opt-text\">' + r.kodeRoll + ' / ' + formatKg2_(r.kg) + 'kg<\u002Fspan><\u002Fdiv>';\n  }).join('') + '<div class=\"roll-opt-manual\">✏️ Manual<\u002Fdiv>';\n  dd.querySelectorAll('.roll-opt').forEach(function(el){\n    el.addEventListener('click', function(){ comboPilihRoll_(idx, el.dataset.kode, parseFloat(el.dataset.kg)); });\n  });\n  dd.querySelector('.roll-opt-manual').addEventListener('click', function(){\n    dd.style.display = 'none';\n    comboSwitchKeManual_(idx, true);\n    wrap.querySelector('.comboRollInput').focus();\n  });\n}\nfunction tampilkanStokRollCombo_(idx, warnaWord){\n  const wrap = comboRollWrapEl_(idx);\n  if (!wrap) return; // baris combo ini belum ke-render (kombinasi warna belum dipilih) - aman dilewati\n  const wRaw = (warnaWord || '').trim().toUpperCase();\n  const w = WARNA_KANONIK_MAP[wRaw] || wRaw; // v.12: \"CHOCO\" -> \"CINNAMON\" dkk kalau ada di KAMUS SINONIM WARNA\n  const rolls = w ? STOK_ROLL_PER_WARNA[w] : null;\n  const inp = wrap.querySelector('.comboRollInput');\n\n  if (!rolls || rolls.length === 0){\n    if (state.comboRollAutoFilled[idx]){ inp.value = ''; state.comboRoll[idx] = ''; state.comboRollAutoFilled[idx] = false; }\n    comboSwitchKeManual_(idx, false);\n    return;\n  }\n\n  comboRenderRollDropdown_(idx, rolls);\n\n  if (inp.value && !state.comboRollAutoFilled[idx]){\n    comboSwitchKeManual_(idx, true);\n    return;\n  }\n\n  if (rolls.length === 1){\n    comboPilihRoll_(idx, rolls[0].kodeRoll, rolls[0].kg);\n  } else {\n    inp.value = ''; state.comboRoll[idx] = ''; state.comboRollAutoFilled[idx] = false;\n    wrap.querySelector('.combo-roll-picker-label').textContent = '— pilih roll —';\n    wrap.querySelector('.combo-roll-picker-btn').classList.add('placeholder');\n  }\n  comboSwitchKePickerRoll_(idx);\n}\ndocument.addEventListener('click', function(e){\n  if (!e.target.closest('.combo-roll-wrap')) {\n    document.querySelectorAll('.combo-roll-dropdown').forEach(function(dd){ dd.style.display = 'none'; });\n  }\n});\n\ngantiKombinasi.addEventListener('click', function(){\n  resetComboUI();\n  validate();\n});\n\ndocument.addEventListener('click', function(e){\n  if (!comboPickerWrap.contains(e.target)) comboDropdown.style.display = 'none';\n});\n\nfunction validate(){\n  const total = updateTotal();\n  if (cbEstimasiKg && cbEstimasiKg.checked && state.mode !== 'kombinasi'){\n    const est = hitungEstimasiKg_();\n    if (est !== null){ kgInput.value = est; state.kg = String(est); }\n  }\n  let ok;\n  if (state.mode === 'kombinasi') {\n    ok = state.kategori && state.kodeItem !== null && state.comboWarna &&\n      state.comboKg.every(function(k){ return k && parseFloat(k) > 0 && !kgMencurigakan_(k); }) && total > 0;\n  } else {\n    ok = state.kategori && state.kodeItem !== null && state.warna.trim() &&\n      state.kg && parseFloat(state.kg) > 0 && !kgMencurigakan_(state.kg) && total > 0;\n  }\n  btnTambah.disabled = !ok;\n}\n\nfunction renderItemList(){\n  itemCountEl.textContent = daftarItem.length;\n  btnBuatTeks.textContent = 'Buat Teks (' + daftarItem.length + ')';\n  btnBuatTeks.disabled = daftarItem.length === 0;\n  document.getElementById('daftarItemSection').style.display = daftarItem.length === 0 ? 'none' : 'block';\n  if (daftarItem.length === 0){\n    itemList.innerHTML = '';\n    itemList.appendChild(emptyHint);\n    return;\n  }\n  itemList.innerHTML = '';\n  daftarItem.forEach(function(item, idx){\n    const qtyLines = Object.keys(item.qty).filter(function(s){return item.qty[s]>0;})\n      .map(function(s){ return s+item.qty[s]; }).join(' ');\n    let namaItem, subInfo;\n    if (item.mode === 'kombinasi') {\n      const awalanKombinasi = bikinAwalan_(item.kategori, item.kodeItem);\n      namaItem = (awalanKombinasi ? awalanKombinasi + ' ' : '') +\n        item.warnaTiga[0].toUpperCase() + ' ' + item.warnaTiga[1].toUpperCase();\n      subInfo = item.warnaTiga.map(function(w,i){ return w+' '+item.kgTiga[i]+'kg'; }).join(', ');\n    } else {\n      const awalanBiasa = bikinAwalan_(item.kategori, item.kodeItem);\n      namaItem = (awalanBiasa ? awalanBiasa + ' ' : '') + item.warna.toUpperCase();\n      subInfo = item.kg + 'kg' + (item.kgEstimasi ? ' <span class=\"badge\" style=\"color:var(--theme-accent-deep);\">≈ estimasi<\u002Fspan>' : '') + (item.roll ? ' (roll ' + item.roll + ')' : '');\n    }\n    const row = document.createElement('div');\n    row.className = 'item-row';\n    row.innerHTML =\n      '<div class=\"item-row-text\"><span class=\"item-row-tag\">'+item.kategori+'<\u002Fspan><b>' + namaItem + '<\u002Fb> - ' +\n      subInfo + '<br>' + qtyLines + '<\u002Fdiv>' +\n      '<div class=\"item-row-del\" data-idx=\"' + idx + '\">✕<\u002Fdiv>';\n    itemList.appendChild(row);\n  });\n  itemList.querySelectorAll('.item-row-del').forEach(function(el){\n    el.addEventListener('click', function(){\n      daftarItem.splice(parseInt(el.dataset.idx,10), 1);\n      renderItemList();\n    });\n  });\n}\n\nbtnTambah.addEventListener('click', function(){\n  hideError();\n  const labelTerpilih = state.varianLabel;\n  if (state.mode === 'kombinasi') {\n    daftarItem.push({\n      mode: 'kombinasi',\n      kategori: state.kategori,\n      kodeItem: state.kodeItem,\n      varianLabel: labelTerpilih,\n      warnaTiga: state.comboWarna.slice(),\n      kgTiga: state.comboKg.slice(),\n      rollTiga: state.comboRoll.slice(),\n      qty: Object.assign({}, state.qty)\n    });\n  } else {\n    daftarItem.push({\n      mode: 'biasa',\n      kategori: state.kategori,\n      kodeItem: state.kodeItem,\n      varianLabel: labelTerpilih,\n      warna: state.warna,\n      kg: state.kg,\n      roll: state.roll,\n      kgEstimasi: !!state.kgEstimasi,\n      qty: Object.assign({}, state.qty)\n    });\n  }\n  renderItemList();\n\n  // Reset field DETAIL ITEM (kategori TETAP, biar cepat isi item berikutnya kategori sama)\n  state.kodeItem = null; state.varianLabel = null; state.mode = 'biasa';\n  state.warna = ''; state.kg = ''; state.roll = ''; state.kgEstimasi = false;\n  state.comboWarna = null; state.comboKg = ['','','']; state.comboRoll = ['','',''];\n  varianPickerLabel.textContent = '— pilih —';\n  varianPickerBtn.classList.add('placeholder');\n  warnaInput.value = ''; kgInput.value = ''; kgInput.disabled = false; rollInput.value = '';\n  rollAutoFilled = false; resetRollPickerUI_();\n  cbEstimasiKg.checked = false; estimasiKgInfo.style.display = 'none';\n  biasaRows.style.display = 'block';\n  kombinasiRows.style.display = 'none';\n  resetComboUI();\n  resetQtyInputs();\n  state.qty = {};\n  validate();\n  window.scrollTo(0,0);\n});\n\nfunction escapeHtml_(s){\n  return String(s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');\n}\n\n// rev.49: format penulisan BARU sesuai tabel spek Denny - Kategori ANAK selalu ditulis literal\n// \"ANAK\" di depan (dibutuhkan aturan konversi buat trigger dengan benar), Kategori DEWASA\n// TIDAK pakai kata \"DEWASA\" sama sekali (langsung ke kode/warna) - beda dari sebelumnya.\n// Prefix Tele (kolom \"Kode Item\" di sheet KATEGORI VARIAN) dipakai APA ADANYA di sini (bukan\n// Label Varian lagi), karena sekarang seringkali beda (mis. Label \"Panjang\" tapi ditulis \"PJG\").\n// rev.49/ver.05: format penulisan sesuai tabel spek Denny. Kata \"ANAK\" HANYA muncul untuk\n// varian Pendek/Panjang (Kode Item kosong atau \"PJG\") - varian Anak lainnya yang SUDAH punya\n// kode sendiri (RFL/SET./ONSET/SPEN/CELANA) TIDAK pakai kata \"ANAK\" sama sekali. Kategori\n// DEWASA TIDAK PERNAH pakai kata \"DEWASA\" sama sekali, di varian manapun.\nfunction bikinAwalan_(kategori, kodeItem){\n  const kodeUpper = kodeItem ? kodeItem.toUpperCase() : '';\n  const butuhKataAnak = kategori.toLowerCase() === 'anak' && (kodeUpper === '' || kodeUpper === 'PJG');\n  if (butuhKataAnak){\n    return kodeUpper ? ('ANAK ' + kodeUpper) : 'ANAK';\n  }\n  return kodeUpper; // semua kasus lain (Anak RFL/SET./ONSET/SPEN/CELANA, dan semua Dewasa) - TANPA kata kategori\n}\n\nfunction generateTeksHtmlPreview_(){\n  return daftarItem.map(function(item){\n    const daftarSize = Object.keys(item.qty).filter(function(s){ return item.qty[s] > 0; });\n    const totalQtyItem = daftarSize.reduce(function(sum,s){ return sum + item.qty[s]; }, 0);\n    const qtyHtml = daftarSize.map(function(s){ return escapeHtml_(s) + '<b>' + item.qty[s] + '<\u002Fb>'; }).join(' ') +\n      ' = <b>' + totalQtyItem + '<\u002Fb>';\n\n    if (item.mode === 'kombinasi') {\n      // Format khusus KOMBINASI 3 warna - memanfaatkan mekanisme \"RefStok\"/breakdown yang\n      // SUDAH ADA di sistem lama: baris pertama = item utama (warna 1+2, kg warna pertama),\n      // 2 baris berikutnya = breakdown pemakaian kain warna ke-2 & ke-3 secara terpisah,\n      // baris terakhir = qty (berlaku buat 1 item gabungan ini). Awalannya pakai formula yang\n      // SAMA kayak item biasa (bikinAwalan_) - Prefix Tele dari sheet sudah otomatis benar\n      // buat kombinasi (mis. \"PJG\" buat Panjang Kombinasi, kosong buat Pendek Kombinasi).\n      const awalan = bikinAwalan_(item.kategori, item.kodeItem);\n      const w = item.warnaTiga, kg = item.kgTiga, roll = item.rollTiga;\n      const kataDepanLine1 = (awalan ? awalan + ' ' : '') + w[0].toUpperCase() + ' ' + w[1].toUpperCase();\n      const line1 = escapeHtml_(kataDepanLine1 + ' ' + kg[0]) +\n        (roll[0] ? escapeHtml_(' / ' + roll[0]) : '');\n      const line2 = escapeHtml_(w[1].toUpperCase() + ' ' + kg[1]) + (roll[1] ? escapeHtml_(' / ' + roll[1]) : '');\n      const line3 = escapeHtml_(w[2].toUpperCase() + ' ' + kg[2]) + (roll[2] ? escapeHtml_(' / ' + roll[2]) : '');\n      return line1 + '\\n' + line2 + '\\n' + line3 + '\\n' + qtyHtml;\n    }\n\n    const awalan = bikinAwalan_(item.kategori, item.kodeItem);\n    const namaAwal = (awalan ? awalan + ' ' : '') + item.warna.toUpperCase();\n    let line1Text;\n    if (item.roll) {\n      line1Text = namaAwal + ' ' + item.kg + ' / ' + item.roll;\n    } else {\n      line1Text = namaAwal + ' ' + item.kg + 'kg';\n    }\n    return escapeHtml_(line1Text) + '\\n' + qtyHtml;\n  }).join('\\n\\n');\n}\n\nbtnBuatTeks.addEventListener('click', function(){\n  if (daftarItem.length === 0) return;\n  document.getElementById('teksHasil').innerHTML = generateTeksHtmlPreview_();\n  document.getElementById('formScreen').style.display = 'none';\n  document.getElementById('successScreen').style.display = 'block';\n  document.getElementById('btnRowForm').style.display = 'none';\n  document.getElementById('btnRowSukses').style.display = 'flex';\n  document.getElementById('copiedFlash').style.display = 'none';\n  window.scrollTo(0,0);\n});\n\nbtnKembali.addEventListener('click', function(){\n  document.getElementById('formScreen').style.display = 'block';\n  document.getElementById('successScreen').style.display = 'none';\n  document.getElementById('btnRowForm').style.display = 'flex';\n  document.getElementById('btnRowSukses').style.display = 'none';\n});\n\n// v.08: dulu tombol ini nunggu respons server dulu (bisa berasa delay/nge-freeze sebentar)\n// baru pindah ke layar \"Terkirim & tersimpan\". SEKARANG optimistic: begitu ditap, langsung\n// pindah ke layar sukses (no delay, gak nunggu jaringan sama sekali) - proses kirim beneran\n// (fetch ke server) jalan di BELAKANG LAYAR. Kalau gagal (jaringan jelek dll), item TETAP\n// disimpan di localStorage (antrianKirimTertunda) dan dicoba lagi otomatis + ada tombol \"Coba\n// Kirim Ulang\" manual, jadi data gak pernah hilang biarpun sudah pindah layar/nutup app.\nconst PENDING_KIRIM_KEY = 'antrianKirimTertunda_v1';\n\nfunction bacaAntrianTertunda_(){\n  try { return JSON.parse(localStorage.getItem(PENDING_KIRIM_KEY) || '[]'); } catch(e){ return []; }\n}\nfunction simpanAntrianTertunda_(list){\n  try { localStorage.setItem(PENDING_KIRIM_KEY, JSON.stringify(list)); } catch(e){}\n}\nfunction tambahKeAntrianTertunda_(teks){\n  const list = bacaAntrianTertunda_();\n  const tempId = Date.now() + '_' + Math.floor(Math.random()*1000);\n  list.push({ tempId: tempId, teks: teks, ts: Date.now() });\n  simpanAntrianTertunda_(list);\n  return tempId;\n}\nfunction hapusDariAntrianTertunda_(tempId){\n  simpanAntrianTertunda_(bacaAntrianTertunda_().filter(function(p){ return p.tempId !== tempId; }));\n}\n\nfunction tampilkanBannerKirim_(pesan, tipe){\n  let el = document.getElementById('kirimStatusBanner');\n  if (!el) {\n    el = document.createElement('div');\n    el.id = 'kirimStatusBanner';\n    el.className = 'error-banner';\n    el.style.cssText = 'position:fixed;left:14px;right:14px;bottom:90px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.12);';\n    document.body.appendChild(el);\n  }\n  el.style.background = tipe === 'gagal' ? 'var(--danger-bg)' : 'var(--theme-accent-soft)';\n  el.style.color = tipe === 'gagal' ? 'var(--danger)' : 'var(--theme-accent-deep)';\n  el.innerHTML = '';\n  const span = document.createElement('span');\n  span.textContent = pesan;\n  el.appendChild(span);\n  if (tipe === 'gagal') {\n    const btnRetry = document.createElement('button');\n    btnRetry.textContent = 'Coba Kirim Ulang';\n    btnRetry.className = 'btn btn-secondary';\n    btnRetry.style.cssText = 'margin-top:8px;padding:8px 14px;font-size:13.5px;';\n    btnRetry.addEventListener('click', function(){ procesAntrianTertunda_(); });\n    el.appendChild(document.createElement('br'));\n    el.appendChild(btnRetry);\n  }\n  return el;\n}\nfunction hapusBannerKirim_(){\n  const el = document.getElementById('kirimStatusBanner');\n  if (el) el.remove();\n}\n\n// Kirim 1 item tertunda ke server. Dipanggil pertama kali begitu tombol ditap, DAN dipanggil\n// lagi otomatis tiap kali app dibuka kalau masih ada sisa yang belum sukses dari sesi\n// sebelumnya (lihat pemanggilan procesAntrianTertunda_() di bagian bawah file).\nfunction kirimSatuTertunda_(pending, isBackground){\n  if (PREVIEW_MODE) {\n    // v.08-preview: JANGAN beneran nulis ke Sheet/kirim ke grup produksi - simulasikan sukses\n    // setelah jeda kecil (biar kelihatan \"proses di background\"-nya), baru hapus dari antrian.\n    return new Promise(function(resolve){\n      setTimeout(function(){\n        hapusDariAntrianTertunda_(pending.tempId);\n        hapusBannerKirim_();\n        resolve(true);\n      }, 900);\n    });\n  }\n  const initData = tg ? tg.initData : '';\n  if (!initData) {\n    if (!isBackground) tampilkanBannerKirim_('Mini App ini perlu dibuka dari Telegram - gak bisa kirim dari browser biasa. Data belum hilang, buka lagi lewat tombol Telegram.', 'gagal');\n    return Promise.resolve(false);\n  }\n  const body = new URLSearchParams();\n  body.set('action', 'kirimProduksiMiniApp');\n  body.set('teks', pending.teks);\n  body.set('initData', initData);\n  return fetch(WEBAPP_URL, { method: 'POST', body: body })\n    .then(function(res){ return res.json(); })\n    .then(function(hasil){\n      if (hasil && hasil.ok) {\n        hapusDariAntrianTertunda_(pending.tempId);\n        hapusBannerKirim_();\n        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');\n        return true;\n      }\n      if (hasil && hasil.duplikat) {\n        // v.11: server bilang ini kiriman DOBEL (kiriman pertamanya SUDAH berhasil duluan) -\n        // hapus dari antrian tertunda juga, JANGAN dianggap gagal & dicoba kirim ulang terus\n        // (kalau tetap dianggap gagal, ini bakal nyoba kirim ulang selamanya dan selalu ditolak\n        // server sampai 24 jam - banner error nyangkut terus padahal datanya sudah aman tersimpan).\n        hapusDariAntrianTertunda_(pending.tempId);\n        tampilkanBannerKirim_('ℹ️ Data ini sudah terkirim duluan (kiriman ganda terdeteksi) - tidak dikirim ulang.', 'info');\n        setTimeout(hapusBannerKirim_, 4000);\n        return true;\n      }\n      tampilkanBannerKirim_('Gagal mengirim: ' + ((hasil && hasil.error) || 'tidak diketahui') + ' - data masih tersimpan, coba lagi.', 'gagal');\n      return false;\n    })\n    .catch(function(err){\n      tampilkanBannerKirim_('Gagal mengirim (jaringan): ' + err.message + ' - data masih tersimpan, coba lagi.', 'gagal');\n      return false;\n    });\n}\nfunction procesAntrianTertunda_(){\n  const list = bacaAntrianTertunda_();\n  if (!list.length) return;\n  // proses satu-satu (biar gak dobel-kirim kalau banyak nyangkut dari beberapa sesi)\n  let p = Promise.resolve();\n  list.forEach(function(item){\n    p = p.then(function(){ return kirimSatuTertunda_(item, true); });\n  });\n}\n\nbtnKirimChat.addEventListener('click', function(){\n  const teks = document.getElementById('teksHasil').textContent;\n  if (!teks.trim()) return;\n  if (tg && !tg.initData) {\n    tampilkanErrorKirim_('Mini App ini perlu dibuka dari Telegram (initData kosong) - gak bisa kirim langsung dari browser biasa.');\n    return;\n  }\n\n  // 1) Simpan ke antrian tertunda DULU (biar gak hilang walau app ditutup sebelum fetch selesai)\n  const tempId = tambahKeAntrianTertunda_(teks);\n  const jumlahItemDikirim = daftarItem.length;\n\n  // 2) LANGSUNG pindah ke layar sukses - no delay, gak nunggu jaringan sama sekali\n  daftarItem = [];\n  document.getElementById('successScreen').innerHTML =\n    '<div class=\"success-screen\"><div class=\"success-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/><\u002Fsvg><\u002Fdiv>' +\n    '<div class=\"success-title\">Terkirim &amp; tersimpan<\u002Fdiv>' +\n    '<div class=\"success-sub\">' + jumlahItemDikirim + ' item ' + (PREVIEW_MODE ? 'DISIMULASIKAN diproses (mode preview, gak beneran masuk Sheet/Telegram).' : 'sedang diproses ke Sheet & dikirim ke grup di latar belakang.') + '<\u002Fdiv><\u002Fdiv>';\n  document.getElementById('btnRowSukses').style.display = 'none';\n  const btnBaru = document.createElement('button');\n  btnBaru.className = 'btn btn-primary btn-full';\n  btnBaru.textContent = 'Input Laporan Baru';\n  btnBaru.style.marginTop = '10px';\n  btnBaru.addEventListener('click', function(){ window.location.reload(); });\n  document.getElementById('successScreen').appendChild(btnBaru);\n  window.scrollTo(0,0);\n\n  // 3) Proses kirim beneran di belakang layar, gak nge-block UI di atas sama sekali\n  kirimSatuTertunda_({ tempId: tempId, teks: teks }, false);\n});\n\n// Kalau ada sisa antrian yang belum sukses dari sesi sebelumnya (app sempat ketutup/reload\n// sebelum fetch selesai), coba kirim ulang otomatis begitu app ini dibuka lagi.\nif (bacaAntrianTertunda_().length) { procesAntrianTertunda_(); }\n\nfunction tampilkanErrorKirim_(pesan){\n  let el = document.getElementById('kirimErrorBanner');\n  if (!el) {\n    el = document.createElement('div');\n    el.id = 'kirimErrorBanner';\n    el.className = 'error-banner';\n    document.getElementById('btnRowSukses').insertAdjacentElement('beforebegin', el);\n  }\n  el.textContent = pesan;\n  el.style.display = 'block';\n}\n\nbtnSalin.addEventListener('click', function(){\n  const teks = document.getElementById('teksHasil').textContent;\n  const flash = document.getElementById('copiedFlash');\n  function tampilkanSukses(){\n    flash.style.display = 'block';\n    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');\n  }\n  if (navigator.clipboard && navigator.clipboard.writeText){\n    navigator.clipboard.writeText(teks).then(tampilkanSukses).catch(function(){\n      fallbackCopy(teks, tampilkanSukses);\n    });\n  } else {\n    fallbackCopy(teks, tampilkanSukses);\n  }\n});\n\nfunction fallbackCopy(teks, cb){\n  const ta = document.createElement('textarea');\n  ta.value = teks;\n  ta.style.position = 'fixed';\n  ta.style.opacity = '0';\n  document.body.appendChild(ta);\n  ta.focus(); ta.select();\n  try { document.execCommand('copy'); cb(); } catch(e){}\n  document.body.removeChild(ta);\n}\n\nfunction initUI(){\n  document.getElementById('loadingScreen').style.display = 'none';\n  document.getElementById('mainWrap').style.display = 'block';\n  renderKategori();\n  renderQtyGrid(qtyGrid, SIZES_UTAMA);\n  renderQtyGrid(qtyGridLain, SIZES_LAIN);\n  renderItemList();\n  validate();\n}\n\nfunction fetchFresh(isBackground){\n  return fetch(WEBAPP_URL + '?action=kategori', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(data){\n      KATEGORI_VARIAN = (data && Object.keys(data).length) ? data : (PREVIEW_MODE ? DUMMY_KATEGORI_VARIAN : data);\n      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: KATEGORI_VARIAN })); } catch(e){}\n      if (!isBackground) initUI();\n    })\n    .catch(function(err){\n      // v.10-preview: kalau gagal TOTAL (bukan cuma kosong) & lagi PREVIEW_MODE, tetap render\n      // pakai data dummy biar bisa didemoin tanpa akses ke server asli.\n      if (PREVIEW_MODE){\n        KATEGORI_VARIAN = DUMMY_KATEGORI_VARIAN;\n        if (!isBackground) initUI();\n        return;\n      }\n      if (!isBackground) {\n        document.getElementById('loadingScreen').textContent = 'Gagal memuat data: ' + err.message + ' (cek WEBAPP_URL di kode)';\n      }\n    });\n}\n\nif (PREVIEW_MODE) document.getElementById('previewModeBanner').style.display = 'block';\nif (tg){ tg.ready(); tg.expand(); }\n\n// ---- Dropdown saran Warna CUSTOM (bukan <datalist> bawaan browser - itu berantakan &\n// gak konsisten posisinya di WebView Android). Ini murni div biasa yang kita kontrol sendiri\n// posisi & tampilannya, nempel PERSIS di bawah kolom Warna, gak nimpa kolom lain. ----\nlet WARNA_LIST = [];\nconst warnaDropdown = document.createElement('div');\nwarnaDropdown.id = 'warnaDropdown';\nwarnaDropdown.style.cssText = 'display:none;position:static;width:100%;box-sizing:border-box;margin-top:8px;background:#fff;border-radius:12px;' +\n  'border:1px solid var(--sep);max-height:200px;overflow-y:auto;';\ndocument.getElementById('warnaInputWrap').insertAdjacentElement('afterend', warnaDropdown);\n\n// rev.49: RINGER (Dewasa) cuma boleh 8 kombinasi 2-warna TETAP ini (beda dari daftar warna\n// stok biasa) - dipakai gantiin saran autocomplete Warna KHUSUS saat varian Ringer dipilih.\nconst RING_WARNA_LIST = [\n  'GREY NAVY', 'PUTIH TERACOTA', 'PUTIH HITAM', 'MUSTARD NAVY',\n  'PUTIH COKLAT', 'PUTIH MUSTARD', 'PUTIH MERAH', 'PUTIH BIRU'\n];\n\nfunction tampilkanSaranWarna(){\n  const sumberList = (state.varianLabel && state.varianLabel.toLowerCase().indexOf('ringer') !== -1)\n    ? RING_WARNA_LIST : WARNA_LIST;\n  if (sumberList.length === 0) { warnaDropdown.style.display = 'none'; return; }\n  const q = warnaInput.value.trim().toUpperCase();\n  const cocok = q ? sumberList.filter(function(w){ return w.toUpperCase().indexOf(q) !== -1; }) : sumberList;\n  if (cocok.length === 0) { warnaDropdown.style.display = 'none'; return; }\n  warnaDropdown.innerHTML = cocok.slice(0,8).map(function(w, idx){\n    const bg = SOFT_BLUE_COLORS[idx % SOFT_BLUE_COLORS.length];\n    return '<div class=\"warna-opt\" style=\"padding:10px 14px;font-size:14.5px;font-weight:600;' +\n      'border-bottom:0.5px solid #E5E5EA;background:' + bg + ';\">' + w + '<\u002Fdiv>';\n  }).join('');\n  const opts = warnaDropdown.querySelectorAll('.warna-opt');\n  opts[opts.length-1].style.borderBottom = 'none';\n  opts.forEach(function(el){\n    el.addEventListener('mousedown', function(ev){ ev.preventDefault(); }); // biar blur gak duluan sebelum sempat ke-tap\n    el.addEventListener('click', function(){\n      warnaInput.value = el.textContent;\n      state.warna = el.textContent;\n      warnaDropdown.style.display = 'none';\n      warnaInput.focus();\n      warnaInput.select(); // biar kalau lanjut ngetik tanpa keluar-masuk kolom dulu, otomatis GANTI bukan nempel\n      validate();\n      tampilkanStokRoll_();\n    });\n  });\n  warnaDropdown.style.display = 'block';\n}\n\nfunction fetchWarnaFresh(){\n  fetch(WEBAPP_URL + '?action=warna', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(list){\n      WARNA_LIST = (list && list.length) ? list : (PREVIEW_MODE ? DUMMY_WARNA_LIST : list);\n      try { localStorage.setItem(WARNA_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: WARNA_LIST })); } catch(e){}\n    })\n    .catch(function(){ if (PREVIEW_MODE) WARNA_LIST = DUMMY_WARNA_LIST; /* selain itu diamkan - autocomplete cuma bonus, gak boleh ganggu form kalau gagal */ });\n}\n(function bootstrapWarna(){\n  try {\n    const cached = JSON.parse(localStorage.getItem(WARNA_CACHE_KEY) || 'null');\n    if (cached && cached.data && (Date.now() - cached.ts) < WARNA_CACHE_TTL_MS){\n      WARNA_LIST = cached.data;\n    }\n  } catch(e){}\n  fetchWarnaFresh(); // selalu refresh diam-diam juga, biar ikutan warna baru dari stok masuk\n})();\n\n// v.09: Kode Roll + Kg Sisa per warna KANONIK di STOK KAIN, dipakai buat auto-show Kode Roll\n// begitu Warna dipilih (mode biasa saja - lihat tampilkanStokRoll_()). Bukan cuma bonus tampilan:\n// biar tim potong gak salah ketik nomor roll, tapi field tetap bisa diedit manual kalau ternyata\n// mau pakai roll lain.\nlet STOK_ROLL_PER_WARNA = {};\n// v.12: fungsi ini dipanggil begitu data STOK_ROLL_PER_WARNA baru datang dari server (fetch\n// pertama pas app dibuka BISA masih berjalan pas orang udah keburu milih kombinasi/warna -\n// tanpa ini, baris yang kepilih duluan sebelum data sampai bakal nyangkut di manual selamanya,\n// gak pernah dicek ulang lagi). Mode biasa cuma dipanggil kalau memang lagi mode biasa (biar\n// gak nimpa input yang lagi dipakai buat kombinasi), sama juga sebaliknya.\nfunction segarkanRollPickerAktif_(){\n  if (state.mode === 'kombinasi'){\n    if (state.comboWarna) state.comboWarna.forEach(function(w, i){ tampilkanStokRollCombo_(i, w); });\n  } else {\n    tampilkanStokRoll_();\n  }\n}\nfunction fetchStokRollFresh(){\n  fetch(WEBAPP_URL + '?action=stokRoll', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(map){\n      STOK_ROLL_PER_WARNA = (map && Object.keys(map).length) ? map : (PREVIEW_MODE ? DUMMY_STOK_ROLL_PER_WARNA : {});\n      try { localStorage.setItem(STOK_ROLL_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: STOK_ROLL_PER_WARNA })); } catch(e){}\n      segarkanRollPickerAktif_();\n    })\n    .catch(function(){ STOK_ROLL_PER_WARNA = PREVIEW_MODE ? DUMMY_STOK_ROLL_PER_WARNA : {}; });\n}\n(function bootstrapStokRoll(){\n  try {\n    const cached = JSON.parse(localStorage.getItem(STOK_ROLL_CACHE_KEY) || 'null');\n    if (cached && cached.data && (Date.now() - cached.ts) < STOK_ROLL_CACHE_TTL_MS){\n      STOK_ROLL_PER_WARNA = cached.data;\n    }\n  } catch(e){}\n  fetchStokRollFresh();\n})();\n\n// v.10: 2 digit di depan koma (di-pad nol kalau cuma 1 digit) + selalu 2 di belakang koma -\n// format tampilan kg biar rapi & konsisten di dropdown Kode Roll. Cuma buat TAMPILAN (angka yang\n// beneran dikirim ke server tetap presisi asli, gak kepengaruh).\nfunction formatKg2_(kg){\n  const n = Math.round((parseFloat(kg) || 0) * 100) / 100;\n  const fixed = n.toFixed(2);\n  const neg = fixed.charAt(0) === '-';\n  const parts = (neg ? fixed.slice(1) : fixed).split('.');\n  const intPart = parts[0].length < 2 ? parts[0].padStart(2, '0') : parts[0];\n  return (neg ? '-' : '') + intPart + '.' + parts[1];\n}\n\n// v.10: warna latar baris dropdown Kode Roll - diganti-ganti per baris (bukan putih polos)\n// biar kontras jelas dari latar dropdown yang putih. Muter lagi kalau roll-nya lebih banyak\n// dari daftar warna ini.\nconst ROLL_OPT_COLORS = ['#F1F7FD', '#EAF3FB', '#F5F9FE', '#E6F0FA', '#EFF6FC', '#E3EEF9'];\n\nfunction renderRollDropdown_(rolls){\n  rollDropdown.innerHTML = rolls.map(function(r, idx){\n    const bg = ROLL_OPT_COLORS[idx % ROLL_OPT_COLORS.length];\n    return '<div class=\"roll-opt\" data-kode=\"' + r.kodeRoll + '\" data-kg=\"' + r.kg + '\" style=\"background:' + bg + ';\">' +\n      '<span class=\"roll-opt-text\">Roll ' + r.kodeRoll + ' / ' + formatKg2_(r.kg) + ' kg<\u002Fspan><\u002Fdiv>';\n  }).join('') + '<div class=\"roll-opt-manual\" id=\"rollOptManual\">✏️ Ketik manual<\u002Fdiv>';\n\n  rollDropdown.querySelectorAll('.roll-opt').forEach(function(el){\n    el.addEventListener('click', function(){ pilihRoll_(el.dataset.kode, parseFloat(el.dataset.kg)); });\n  });\n  document.getElementById('rollOptManual').addEventListener('click', function(){\n    rollDropdown.style.display = 'none';\n    switchKeManualRoll_(true);\n    rollInput.focus();\n  });\n}\n\n// v.11: param ke-2 `kg` BARU (opsional) - kalau diisi, kg roll itu ikut ditampilkan di tombol\n// Kode Roll (bukan cuma \"Roll 0024\" doang) - biar tim potong bisa langsung nyontek angka kg-nya\n// pas ngisi \"Kg Kain Terpakai\", gak perlu buka dropdown lagi buat lihat angkanya.\nfunction pilihRoll_(kode, kg){\n  rollInput.value = kode;\n  state.roll = kode;\n  rollAutoFilled = true;\n  rollPickerLabel.textContent = 'Roll ' + kode + ((kg !== undefined && kg !== null && !isNaN(kg)) ? ' / ' + formatKg2_(kg) + ' kg' : '');\n  rollPickerBtn.classList.remove('placeholder');\n  rollDropdown.style.display = 'none';\n}\n\nfunction switchKeManualRoll_(tampilkanLinkKeDaftar){\n  rollPickerWrap.style.display = 'none';\n  rollInputWrap.style.display = '';\n  rollDropdown.style.display = 'none';\n  rollKeDaftarLink.style.display = tampilkanLinkKeDaftar ? 'inline-block' : 'none';\n}\n\nfunction switchKePickerRoll_(){\n  rollInputWrap.style.display = 'none';\n  rollKeDaftarLink.style.display = 'none';\n  rollPickerWrap.style.display = '';\n}\n\nfunction resetRollPickerUI_(){\n  switchKeManualRoll_(false);\n  rollPickerLabel.textContent = '— pilih roll —';\n  rollPickerBtn.classList.add('placeholder');\n  rollDropdown.innerHTML = '';\n  rollDropdown.style.display = 'none';\n}\n\nrollPickerBtn.addEventListener('click', function(){\n  const showing = rollDropdown.style.display === 'block';\n  rollDropdown.style.display = showing ? 'none' : 'block';\n});\nrollKeDaftarLink.addEventListener('click', function(){ switchKePickerRoll_(); });\ndocument.addEventListener('click', function(e){\n  if (!rollPickerBtn.contains(e.target) && !rollDropdown.contains(e.target)) {\n    rollDropdown.style.display = 'none';\n  }\n});\n\n// Cocokkan warna yang lagi diketik/dipilih ke STOK_ROLL_PER_WARNA - persis kayak alur\n// bacaPetaWarnaKanonik() di backend (uppercase langsung), jadi cukup cocok persis di sini.\nfunction tampilkanStokRoll_(){\n  if (state.mode === 'kombinasi'){ resetRollPickerUI_(); return; } // v.10: kombinasi TETAP manual, gak disentuh\n  const w = (state.warna || '').trim().toUpperCase();\n  const rolls = w ? STOK_ROLL_PER_WARNA[w] : null;\n\n  if (!rolls || rolls.length === 0){\n    // Warna gak ada stok yang cocok - balik ke input manual biasa. Kalau isi sebelumnya HASIL\n    // AUTO (bukan diketik manual tim potong), kosongkan lagi biar gak nyangkut punya warna lama.\n    if (rollAutoFilled){ rollInput.value = ''; state.roll = ''; rollAutoFilled = false; }\n    switchKeManualRoll_(false);\n    return;\n  }\n\n  renderRollDropdown_(rolls);\n\n  // Kalau tim potong SUDAH ngetik kode roll sendiri (bukan hasil auto-show), jangan diganggu -\n  // tetap di mode manual, cuma dikasih link buat pindah ke dropdown stok kalau mau.\n  if (rollInput.value && !rollAutoFilled){\n    switchKeManualRoll_(true);\n    return;\n  }\n\n  if (rolls.length === 1){\n    pilihRoll_(rolls[0].kodeRoll, rolls[0].kg); // cuma 1 roll cocok - auto-pilih langsung\n  } else {\n    rollInput.value = ''; state.roll = ''; rollAutoFilled = false;\n    rollPickerLabel.textContent = '— pilih roll —';\n    rollPickerBtn.classList.add('placeholder');\n  }\n  switchKePickerRoll_();\n}\n\nfunction fetchKombinasiFresh(){\n  fetch(WEBAPP_URL + '?action=kombinasi', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(list){\n      KOMBINASI_WARNA = (list && list.length) ? list : (PREVIEW_MODE ? DUMMY_KOMBINASI_WARNA : list);\n      try { localStorage.setItem(KOMBINASI_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: KOMBINASI_WARNA })); } catch(e){}\n    })\n    .catch(function(){ if (PREVIEW_MODE) KOMBINASI_WARNA = DUMMY_KOMBINASI_WARNA; /* selain itu diamkan - combo picker akan kasih pesan error saat dibuka */ });\n}\n(function bootstrapKombinasi(){\n  try {\n    const cached = JSON.parse(localStorage.getItem(KOMBINASI_CACHE_KEY) || 'null');\n    if (cached && cached.data && (Date.now() - cached.ts) < KOMBINASI_CACHE_TTL_MS){\n      KOMBINASI_WARNA = cached.data;\n    }\n  } catch(e){}\n  fetchKombinasiFresh();\n})();\n\n// v.12: peta sinonim warna (SINONIM -> KANONIK, mis. \"CHOCO\" -> \"CINNAMON\") dari sheet KAMUS\n// SINONIM WARNA - dipakai KHUSUS buat nyari roll warna Kombinasi (lihat tampilkanStokRollCombo_()).\n// Nama yang DITAMPILKAN ke tim potong (chip warna, teks kirim) TETAP pakai kata asli dari sheet\n// KOMBINASI WARNA (mis. \"CHOCO\") - peta ini cuma dipakai buat translate SEBELUM nyari ke\n// STOK_ROLL_PER_WARNA, gak pernah nimpa tampilan.\nlet WARNA_KANONIK_MAP = {};\nfunction fetchWarnaKanonikFresh(){\n  fetch(WEBAPP_URL + '?action=warnaKanonik', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(map){\n      WARNA_KANONIK_MAP = map || {};\n      try { localStorage.setItem(WARNA_KANONIK_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: WARNA_KANONIK_MAP })); } catch(e){}\n      segarkanRollPickerAktif_(); // v.12: sama kayak STOK_ROLL_PER_WARNA - data ini juga bisa datang belakangan\n    })\n    .catch(function(){ /* diamkan - kalau gagal, kombinasi yang gak pas namanya sama stok jatuh ke manual (aman) */ });\n}\n(function bootstrapWarnaKanonik(){\n  try {\n    const cached = JSON.parse(localStorage.getItem(WARNA_KANONIK_CACHE_KEY) || 'null');\n    if (cached && cached.data && (Date.now() - cached.ts) < WARNA_KANONIK_CACHE_TTL_MS){\n      WARNA_KANONIK_MAP = cached.data;\n    }\n  } catch(e){}\n  fetchWarnaKanonikFresh();\n})();\n\n// v.08: tabel Kg standar per varian (dipakai fitur \"Kg tidak diketahui - pakai estimasi\n// standar\"). Datanya dibaca dari sheet \"STANDAR PEMAKAIAN\" (Kategori | Varian | Kg per Pcs) -\n// sheet ini BARU/masih kosong sampai Denny isi datanya sendiri, jadi awalnya toggle akan selalu\n// bilang \"belum tersedia\" sampai sheet-nya diisi. Lihat cariStandarKg_() buat logic pencocokan.\nlet STANDAR_PEMAKAIAN_LIST = [];\nfunction fetchStandarFresh(){\n  fetch(WEBAPP_URL + '?action=standarPemakaian', { cache: 'no-store' })\n    .then(function(r){ return r.json(); })\n    .then(function(list){\n      STANDAR_PEMAKAIAN_LIST = (list && list.length) ? list : (PREVIEW_MODE ? DUMMY_STANDAR_PEMAKAIAN : []);\n      try { localStorage.setItem(STANDAR_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: STANDAR_PEMAKAIAN_LIST })); } catch(e){}\n    })\n    .catch(function(){ if (PREVIEW_MODE) STANDAR_PEMAKAIAN_LIST = DUMMY_STANDAR_PEMAKAIAN; });\n}\n(function bootstrapStandar(){\n  try {\n    const cached = JSON.parse(localStorage.getItem(STANDAR_CACHE_KEY) || 'null');\n    if (cached && cached.data && (Date.now() - cached.ts) < STANDAR_CACHE_TTL_MS){\n      STANDAR_PEMAKAIAN_LIST = cached.data;\n    }\n  } catch(e){}\n  fetchStandarFresh();\n})();\n\n// Cari Kg per Pcs standar - cocokkan dulu lewat kodeItem (persis), kalau gak ketemu coba lewat\n// varianLabel (case-insensitive). null kalau memang belum ada datanya di sheet.\nfunction cariStandarKg_(kodeItem, varianLabel){\n  for (let i=0; i<STANDAR_PEMAKAIAN_LIST.length; i++){\n    const s = STANDAR_PEMAKAIAN_LIST[i];\n    if (kodeItem !== null && s.kodeItem && s.kodeItem === kodeItem) return parseFloat(s.kgPerPcs) || null;\n  }\n  for (let i=0; i<STANDAR_PEMAKAIAN_LIST.length; i++){\n    const s = STANDAR_PEMAKAIAN_LIST[i];\n    if (s.varian && varianLabel && s.varian.trim().toLowerCase() === varianLabel.trim().toLowerCase()) return parseFloat(s.kgPerPcs) || null;\n  }\n  return null;\n}\n\nconst cbEstimasiKg = document.getElementById('pakaiEstimasiKg');\nconst estimasiKgInfo = document.getElementById('estimasiKgInfo');\nconst kgWarningInfo = document.getElementById('kgWarningInfo');\n\nfunction hitungEstimasiKg_(){\n  const total = updateTotal();\n  const kgPerPcs = cariStandarKg_(state.kodeItem, state.varianLabel);\n  if (kgPerPcs === null){\n    estimasiKgInfo.style.display = 'block';\n    estimasiKgInfo.style.color = 'var(--danger)';\n    estimasiKgInfo.textContent = 'Data standar untuk varian ini belum tersedia - isi Kg manual.';\n    return null;\n  }\n  if (total <= 0){\n    estimasiKgInfo.style.display = 'block';\n    estimasiKgInfo.style.color = 'var(--theme-accent-deep)';\n    estimasiKgInfo.textContent = 'Isi qty per ukuran dulu buat hitung estimasinya (' + kgPerPcs + ' kg/pcs).';\n    return null;\n  }\n  const est = Math.round(total * kgPerPcs * 100) / 100;\n  estimasiKgInfo.style.display = 'block';\n  estimasiKgInfo.style.color = 'var(--theme-accent-deep)';\n  estimasiKgInfo.textContent = '≈ ' + est + ' kg (estimasi ' + kgPerPcs + ' kg/pcs × ' + total + ' pcs)';\n  return est;\n}\n\ncbEstimasiKg.addEventListener('change', function(){\n  if (cbEstimasiKg.checked){\n    if (state.kodeItem === null){\n      cbEstimasiKg.checked = false;\n      showError('Pilih Varian dulu sebelum pakai estimasi standar.');\n      return;\n    }\n    const est = hitungEstimasiKg_();\n    if (est === null){\n      cbEstimasiKg.checked = false; // gak ada datanya / qty masih kosong - balik ke input manual\n      validate();\n      return;\n    }\n    kgInput.value = est;\n    kgInput.disabled = true;\n    state.kg = String(est);\n    state.kgEstimasi = true;\n  } else {\n    kgInput.disabled = false;\n    estimasiKgInfo.style.display = 'none';\n    state.kgEstimasi = false;\n  }\n  validate();\n});\n\nlet dariCache = false;\ntry {\n  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');\n  if (cached && cached.data && (Date.now() - cached.ts) < CACHE_TTL_MS){\n    KATEGORI_VARIAN = cached.data;\n    dariCache = true;\n    initUI();\n    fetchFresh(true);\n  }\n} catch(e){}\nif (!dariCache) fetchFresh(false);\n\ndocument.getElementById('refreshLink').addEventListener('click', function(){\n  try {\n    localStorage.removeItem(CACHE_KEY);\n    localStorage.removeItem(WARNA_CACHE_KEY);\n    localStorage.removeItem(KOMBINASI_CACHE_KEY);\n  } catch(e){}\n  document.getElementById('mainWrap').style.display = 'none';\n  const ls = document.getElementById('loadingScreen');\n  ls.style.display = 'block';\n  ls.textContent = 'Memuat ulang data terbaru...';\n  fetchFresh(false);\n  fetchWarnaFresh();\n  fetchKombinasiFresh();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
